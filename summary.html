<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Summary - คิดเงินก๊วน</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00C853; --gold: #FFD700; }
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        body { background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .price-config { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .price-config input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px; text-align: center; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; color: #888; font-weight: 300; border-bottom: 2px solid #eee; padding: 10px; }
        td { padding: 12px 10px; border-bottom: 1px solid #eee; }
        
        .paid-btn { padding: 6px 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .status-unpaid { background: #ffebee; color: #d32f2f; }
        .status-paid { background: #e8f5e9; color: #2e7d32; }
        
        .total-summary { display: flex; justify-content: space-around; background: #333; color: white; padding: 20px; border-radius: 15px; margin-top: 20px; }
        .total-item { text-align: center; }
        .total-item small { display: block; color: #bbb; }
        .total-item span { font-size: 1.4em; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>💰 สรุปยอดเงินก๊วน</h2>
            <button onclick="window.location.href='admin.html'" style="padding:8px 15px; border-radius:8px; border:1px solid #ddd; background:#fff;">กลับหน้าคัดตัว</button>
        </div>

        <div class="card">
            <div class="price-config">
                <div>
                    <label><small>ค่าสนามรวม</small></label>
                    <input type="number" id="court-total" value="0" oninput="calculateAll()">
                </div>
                <div>
                    <label><small>ค่าลูก/ลูก</small></label>
                    <input type="number" id="price-per-shuttle" value="30" oninput="calculateAll()">
                </div>
                <div>
                    <label><small>คนหารค่าสนาม</small></label>
                    <input type="number" id="people-count" value="0" disabled>
                </div>
            </div>
        </div>

        <div class="card" style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>ชื่อ</th>
                        <th>เกม</th>
                        <th>ลูก</th>
                        <th>รวม (บาท)</th>
                        <th>สถานะ</th>
                    </tr>
                </thead>
                <tbody id="summary-table">
                    </tbody>
            </table>
        </div>

        <div class="total-summary">
            <div class="total-item">
                <small>เก็บเงินได้แล้ว</small>
                <span id="collected-money">0</span>
            </div>
            <div class="total-item">
                <small>ยอดที่ต้องเก็บทั้งหมด</small>
                <span id="grand-total">0</span>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDQbnx83sbs1sO4xsuLUV50uxbBinr2VtY", authDomain: "earlybird-queue.firebaseapp.com", projectId: "earlybird-queue", storageBucket: "earlybird-queue.firebasestorage.app", messagingSenderId: "310694006567", appId: "1:310694006567:web:f56fc19ed03b81bf8c2302" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const currentSessionId = localStorage.getItem('last_session_id');
        let playersData = [];

        window.onload = () => {
            if (!currentSessionId) return alert("ไม่พบข้อมูลก๊วน");
            
            // ดึงข้อมูลสมาชิกทุกคนในก๊วน
            onSnapshot(collection(db, `sessions/${currentSessionId}/attendance`), (snap) => {
                playersData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                document.getElementById('people-count').value = playersData.length;
                calculateAll();
            });
        };

        window.calculateAll = () => {
            const courtTotal = parseFloat(document.getElementById('court-total').value) || 0;
            const pricePerShuttle = parseFloat(document.getElementById('price-per-shuttle').value) || 0;
            const peopleCount = playersData.length || 1;
            
            const courtPerPerson = courtTotal / peopleCount;
            const table = document.getElementById('summary-table');
            table.innerHTML = "";

            let totalToCollect = 0;
            let totalCollected = 0;

            playersData.forEach(p => {
                const shuttleCost = (p.shuttle_used || 0) * pricePerShuttle;
                const finalTotal = Math.ceil(courtPerPerson + shuttleCost);
                totalToCollect += finalTotal;
                if (p.is_paid) totalCollected += finalTotal;

                table.innerHTML += `
                    <tr>
                        <td><b>${p.display_name}</b></td>
                        <td>${p.games_played || 0}</td>
                        <td>${p.shuttle_used || 0}</td>
                        <td><b style="color:#2e7d32">${finalTotal}</b></td>
                        <td>
                            <button class="paid-btn ${p.is_paid ? 'status-paid' : 'status-unpaid'}" 
                                onclick="togglePaid('${p.id}', ${p.is_paid})">
                                ${p.is_paid ? '✅ จ่ายแล้ว' : '⏳ รอยืนยัน'}
                            </button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('grand-total').innerText = `฿ ${totalToCollect}`;
            document.getElementById('collected-money').innerText = `฿ ${totalCollected}`;
        };

        window.togglePaid = async (uid, currentStatus) => {
            const memberRef = doc(db, `sessions/${currentSessionId}/attendance`, uid);
            await updateDoc(memberRef, { is_paid: !currentStatus });
        };
    </script>
</body>
</html>
