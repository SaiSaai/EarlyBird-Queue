<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badminton Queue - Member</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00C853; }
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        body { background: #fdfcf0; margin: 0; padding: 15px; }
        .hidden { display: none !important; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .btn-join { width:100%; padding: 12px; border: none; border-radius: 10px; font-weight: bold; background: var(--primary); color: white; font-size: 1.1em; cursor: pointer; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; }
        #debug-log { font-size: 10px; color: #999; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="loading-zone">
        <div style="text-align:center; margin-top:100px;">
            <div class="spinner">🌀</div>
            <p id="status-text">กำลังเริ่มต้นระบบ LINE...</p>
        </div>
    </div>

    <div id="register-zone" class="hidden">
        <div class="card">
            <h2>ลงชื่อเข้าก๊วน 👋</h2>
            <input type="text" id="user-name" placeholder="ใส่ชื่อเล่นของคุณ">
            <select id="user-skill">
                <option value="yellow">Level: มือใหม่</option>
                <option value="green" selected>Level: พื้นฐาน</option>
                <option value="blue">Level: ทั่วไป</option>
            </select>
            <button class="btn-join" onclick="handleCheckIn()">ลงชื่อเลย</button>
        </div>
    </div>

    <div id="main-zone" class="hidden">
        <div class="card" id="my-info" style="background: #e8f5e9;"></div>
        <h3>⏳ คิวรอในก๊วน</h3>
        <div id="middle-queue-list"></div>
    </div>

    <div id="debug-log"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDQbnx83sbs1sO4xsuLUV50uxbBinr2VtY", authDomain: "earlybird-queue.firebaseapp.com", projectId: "earlybird-queue", storageBucket: "earlybird-queue.firebasestorage.app", messagingSenderId: "310694006567", appId: "1:310694006567:web:f56fc19ed03b81bf8c2302" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let lineUserId = "";
        let currentSessionId = "";

        const log = (msg) => {
            console.log(msg);
            document.getElementById('status-text').innerText = msg;
            document.getElementById('debug-log').innerHTML += `<br>> ${msg}`;
        };

        window.onload = async () => {
            try {
                log("กำลังติดต่อ LINE...");
                await liff.init({ liffId: "2009012689-o7UBlAd7" });
                
                if (!liff.isLoggedIn()) {
                    log("กรุณาเข้าสู่ระบบ LINE...");
                    liff.login();
                    return;
                }

                const profile = await liff.getProfile();
                lineUserId = profile.userId;
                log("พบ LINE ID: " + lineUserId.substring(0,5) + "...");

                // ดึง Session จาก URL
                const urlParams = new URLSearchParams(window.location.search);
                let session = urlParams.get('session');

                if (session) {
                    log("พบก๊วนใหม่จาก QR...");
                    currentSessionId = session;
                    localStorage.setItem('last_session_id', session);
                } else {
                    log("ดึงก๊วนเดิมจากความจำ...");
                    currentSessionId = localStorage.getItem('last_session_id');
                }

                if (!currentSessionId) {
                    log("❌ ไม่พบ ID ก๊วน กรุณาสแกน QR ใหม่");
                    return;
                }

                checkUserStatus();

            } catch (err) {
                log("💥 เกิดข้อผิดพลาด: " + err.message);
            }
        };

        async function checkUserStatus() {
            log("กำลังเช็คสถานะสมาชิก...");
            try {
                const docRef = doc(db, `sessions/${currentSessionId}/attendance`, lineUserId);
                const docSnap = await getDoc(docRef);

                document.getElementById('loading-zone').classList.add('hidden');

                if (docSnap.exists()) {
                    log("พบข้อมูล! ยินดีต้อนรับกลับ");
                    showMain(docSnap.data());
                } else {
                    log("ยังไม่เคยลงชื่อ...");
                    document.getElementById('register-zone').classList.remove('hidden');
                }
            } catch (e) {
                log("🔥 Firebase Error: " + e.message);
            }
        }

        window.handleCheckIn = async () => {
            const name = document.getElementById('user-name').value.trim();
            const skill = document.getElementById('user-skill').value;
            if(!name) return alert("ใส่ชื่อด้วยจ้า");

            log("กำลังบันทึกข้อมูล...");
            const userData = { display_name: name, skill_level: skill, is_playing: false, games_played: 0, shuttle_used: 0, last_match_end: Date.now() };
            
            try {
                await setDoc(doc(db, `sessions/${currentSessionId}/attendance`, lineUserId), userData);
                showMain(userData);
            } catch (e) {
                alert("บันทึกไม่สำเร็จ: " + e.message);
            }
        };

        function showMain(userData) {
            document.getElementById('register-zone').classList.add('hidden');
            document.getElementById('main-zone').classList.remove('hidden');
            document.getElementById('my-info').innerHTML = `คุณ: <b>${userData.display_name}</b> | ระดับ: ${userData.skill_level}`;
            
            // Sync คิวกลางแบบ Real-time
            onSnapshot(doc(db, "sessions", currentSessionId), (doc) => {
                const data = doc.data();
                const list = document.getElementById('middle-queue-list');
                list.innerHTML = "";
                if(data?.middle_queue?.length > 0) {
                    data.middle_queue.forEach((q, i) => {
                        const pNames = q.slots.filter(s => s).map(s => s.name).join(" vs ");
                        list.innerHTML += `<div class="card">คิวที่ ${i+1}: ${pNames}</div>`;
                    });
                } else {
                    list.innerHTML = "<p>ยังไม่มีคิวจัดไว้</p>";
                }
            });
        }
    </script>
</body>
</html>
