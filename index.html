<!DOCTYPE html>
<html>
<head>
    <title>คิวแบดมินตัน</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
    <h1>คิวแข่งวันนี้</h1>
    <div id="queue-list"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";//"https://www.gstatic.com/firebasejs/12.8.0/firebase-analytics.js";

        const firebaseConfig = { 
             apiKey: "AIzaSyDQbnx83sbs1sO4xsuLUV50uxbBinr2VtY",
            authDomain: "earlybird-queue.firebaseapp.com",
            projectId: "earlybird-queue",
            storageBucket: "earlybird-queue.firebasestorage.app",
            messagingSenderId: "310694006567",
            appId: "1:310694006567:web:f56fc19ed03b81bf8c2302",
            measurementId: "G-CHJP8C4V5S"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ดึงข้อมูลคิวแบบ Real-time
        onSnapshot(collection(db, "queues"), (snapshot) => {
            const list = document.getElementById('queue-list');
            list.innerHTML = "";
            snapshot.forEach(doc => {
                const data = doc.data();
                list.innerHTML += `<p>${data.pairA} vs ${data.pairB} - สถานะ: ${data.status}</p>`;
            });
        });
        async function main() {
    // 2. สั่งให้ LIFF ทำงาน
    await liff.init({ liffId: "2009012689-o7UBlAd7" });

    if (!liff.isLoggedIn()) {
      liff.login(); // ถ้ายังไม่ล็อกอิน ให้เด้งหน้า Login ของ Line
    } else {
      const profile = await liff.getProfile();
      
      // 3. เอาข้อมูลจาก Line ไปบันทึกลง Firebase (Users Table)
      const userRef = doc(db, "users", profile.userId);
      await setDoc(userRef, {
        line_user_id: profile.userId,
        display_name: profile.displayName,
        profile_image_url: profile.pictureUrl,
        last_seen: Date.now()
      }, { merge: true });

      console.log("ยินดีต้อนรับคุณ", profile.displayName);
      
      // โชว์รูปโปรไฟล์บนหน้าเว็บหน่อย
      document.getElementById('user-info').innerHTML = `
        <img src="${profile.pictureUrl}" width="50" style="border-radius:50%">
        <p>สวัสดีคุณ ${profile.displayName}</p>
        <button onclick="checkIn()">เข้าก๊วนวันนี้</button>
      `;
    }
  }

  main();
    </script>
</body>
</html>
