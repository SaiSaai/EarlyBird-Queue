<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Queue - Badminton</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Kanit', sans-serif; background: #1a1a1a; color: white; padding: 15px; }
        .court-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .court-card { background: #333; padding: 10px; border-radius: 15px; border-top: 4px solid #4caf50; }
        .queue-item { background: #444; padding: 10px; margin-bottom: 10px; border-radius: 10px; display: flex; justify-content: space-between; }
        .highlight { background: #ffd700 !important; color: black !important; font-weight: bold; border: 2px solid white; }
        h3 { color: #ffd700; border-bottom: 1px solid #444; padding-bottom: 5px; }
    </style>
</head>
<body>
    <h3>🎾 กำลังแข่งขัน</h3>
    <div id="live-courts" class="court-grid"></div>

    <h3>⏳ คิวถัดไป (Queue)</h3>
    <div id="middle-queue"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
            apiKey: "AIzaSyDQbnx83sbs1sO4xsuLUV50uxbBinr2VtY",
            authDomain: "earlybird-queue.firebaseapp.com",
            projectId: "earlybird-queue",
            storageBucket: "earlybird-queue.firebasestorage.app",
            messagingSenderId: "310694006567",
            appId: "1:310694006567:web:f56fc19ed03b81bf8c2302",
            measurementId: "G-CHJP8C4V5S"
        };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session');
    let myId = "";

    async function init() {
        await liff.init({ liffId: "2009012689-o7UBlAd7" });
        if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            myId = profile.userId;
        }
        listenData();
    }

    function listenData() {
        // ดึงสถานะคิวกลางจาก LocalStorage (ในเคสนี้ถ้าดูคนละเครื่อง คิวกลางต้องบันทึกใน Firestore ด้วยจะดีกว่า)
        // เพื่อความง่าย ผมจะแสดงเฉพาะคนที่มีสถานะ is_playing ในหน้า Dashboard นี้ครับ
        onSnapshot(collection(db, `sessions/${sessionId}/attendance`), (snap) => {
            const players = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderPlaying(players);
        });
    }

    function renderPlaying(players) {
        const container = document.getElementById('live-courts');
        container.innerHTML = "";
        const playing = players.filter(p => p.is_playing);
        
        playing.forEach(p => {
            const div = document.createElement('div');
            div.className = `court-card ${p.id === myId ? 'highlight' : ''}`;
            div.innerText = p.display_name;
            container.appendChild(div);
        });
    }
    // หมายเหตุ: สำหรับการโชว์คิวกลาง (Middle Queue) ข้อมูลต้องถูกแชร์จาก Admin ขึ้น Firestore ก่อนครับ

    init();
</script>
</body>
</html>
