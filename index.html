<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Board</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; padding: 20px; background: #fdfcf0; }
        .board { max-width: 500px; margin: 0 auto; }
        .queue-item { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 5px solid #2196f3; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .btn-back { position: fixed; top: 10px; left: 10px; background: #fff; padding: 5px 12px; border-radius: 15px; text-decoration: none; font-size: 12px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <a href="profile.html" class="btn-back">👤 โปรไฟล์ฉัน</a>
    <div class="board">
        <h2 style="text-align:center;">⌛ คิวรอลงสนาม</h2>
        <div id="list">กำลังโหลดคิว...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDQbnx83sbs1sO4xsuLUV50uxbBinr2VtY", authDomain: "earlybird-queue.firebaseapp.com", projectId: "earlybird-queue", storageBucket: "earlybird-queue.firebasestorage.app", messagingSenderId: "310694006567", appId: "1:310694006567:web:f56fc19ed03b81bf8c2302" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const sid = new URLSearchParams(window.location.search).get('session') || localStorage.getItem('last_sid');

        if (sid) {
            onSnapshot(doc(db, "sessions", sid), (d) => {
                const q = d.data()?.middle_queue || [];
                document.getElementById('list').innerHTML = q.length ? q.map((c, i) => `
                    <div class="queue-item">
                        <b>คิวที่ ${i+1}</b><br>
                        ${c.slots.filter(s=>s).map(s=>s.name).join(" vs ")}
                    </div>
                `).join('') : "ยังไม่มีคิวรอ";
            });
        } else {
            document.getElementById('list').innerText = "ไม่พบรหัสก๊วน";
        }
    </script>
</body>
</html>
