<!DOCTYPE html>
<html>
<head>
    <title>คิวแบดมินตัน</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
    <h1>คิวแข่งวันนี้</h1>
    
    <div id="app" style="margin-bottom: 20px;"></div>

    <hr>
    <h3>รายการคิว</h3>
    <div id="queue-list"></div>

    <script type="module">
        // 1. เพิ่มฟังก์ชัน doc, setDoc, getDoc ในการ import
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyDQbnx83sbs1sO4xsuLUV50uxbBinr2VtY",
            authDomain: "earlybird-queue.firebaseapp.com",
            projectId: "earlybird-queue",
            storageBucket: "earlybird-queue.firebasestorage.app",
            messagingSenderId: "310694006567",
            appId: "1:310694006567:web:f56fc19ed03b81bf8c2302",
            measurementId: "G-CHJP8C4V5S"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ดึงค่า Session ID จาก URL (ถ้ามีคนสแกน QR เข้ามา)
        const urlParams = new URLSearchParams(window.location.search);
        const currentSessionId = urlParams.get('session');

        async function initLIFF() {
            try {
                // อย่าลืมใส่ LIFF ID จริงของคุณที่นี่
                await liff.init({ liffId: "2009012689-o7UBlAd7" });
                
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const profile = await liff.getProfile();
                    await syncUserData(profile);
                }
            } catch (err) {
                console.error("LIFF Init Error:", err);
            }
        }

        async function syncUserData(profile) {
            const userRef = doc(db, "users", profile.userId);
            const userSnap = await getDoc(userRef);
            let levelColor = "YELLOW"; 

            if (userSnap.exists()) {
                levelColor = userSnap.data().level_color || "YELLOW";
            }

            await setDoc(userRef, {
                display_name: profile.displayName,
                profile_image_url: profile.pictureUrl,
                level_color: levelColor,
                last_login: Date.now()
            }, { merge: true });

            document.getElementById('app').innerHTML = `
                <div class="user-card" style="background-color: #fef9e7; padding: 20px; border-radius: 15px; text-align: center;">
                    <img src="${profile.pictureUrl}" width="80" style="border-radius: 50%; border: 3px solid white;">
                    <h2>สวัสดีคุณ ${profile.displayName}</h2>
                    <p>ระดับของคุณ: ${levelColor}</p>
                    <button id="checkInBtn" style="background-color: #a2d2ff; border: none; padding: 15px 30px; border-radius: 10px; font-weight: bold; cursor: pointer;">
                        เข้าก๊วนวันนี้
                    </button>
                </div>
            `;

            // เพิ่ม Event ให้ปุ่มเช็คอิน
            document.getElementById('checkInBtn').onclick = () => checkIn(profile);
        }

        async function checkIn(profile) {
            if (!currentSessionId) {
                alert("กรุณาสแกน QR Code ของก๊วนเพื่อเช็คอิน");
                return;
            }
            
            // บันทึกการเช็คอินลงใน Attendance
            const attendanceRef = doc(db, `sessions/${currentSessionId}/attendance`, profile.userId);
            await setDoc(attendanceRef, {
                user_id: profile.userId,
                display_name: profile.displayName,
                check_in_time: Date.now(),
                is_paid: false
            });
            
            alert("เช็คอินสำเร็จ! ชื่อของคุณเข้าสู่ระบบแล้ว");
        }

        // โค้ดสำหรับแสดงคิว (Real-time)
        onSnapshot(collection(db, "queues"), (snapshot) => {
            const list = document.getElementById('queue-list');
            list.innerHTML = "";
            snapshot.forEach(doc => {
                const data = doc.data();
                list.innerHTML += `<p>${data.pairA} vs ${data.pairB} - [${data.status}]</p>`;
            });
        });

        initLIFF();
    </script>
</body>
</html>
