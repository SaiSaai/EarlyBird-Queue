<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมาชิก - แก้ไขข้อมูล</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>ข้อมูลสมาชิก</h1>
        <nav>
            <a href="admin.html">แอดมิน</a>
            <a href="queue.html">คิว</a>
        </nav>
    </header>

    <main>
        <section>
            <form id="memberForm">
                <label for="memberName">ชื่อ:</label>
                <input type="text" id="memberName" placeholder="กรุณากรอกชื่อ" required>

                <label for="memberImage">รูปโปรไฟล์:</label>
                <input type="file" id="memberImage" accept="image/*" required>

                <label for="amountDue">ยอดเงินที่ต้องจ่าย:</label>
                <input type="number" id="amountDue" placeholder="กรุณากรอกยอดเงิน" required>

                <button type="submit">บันทึกข้อมูล</button>
            </form>
        </section>
    </main>
</body>
</html>
