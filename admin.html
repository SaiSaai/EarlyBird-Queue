<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badminton Admin - Pro Edition 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --sidebar-width: 320px; /* ลดความกว้างลงเพื่อให้เหลือพื้นที่สนาม */
            --primary-bg: #fdfcf0; --team-a: #a2d2ff; --team-b: #b9fbc0; --accent-red: #ffcfd2; --playing-bg: #f0fff4; 
            --v-yellow: #FFD700; --v-green: #00C853; --v-blue: #2962FF; --v-red: #D50000; --v-black: #000000;
        }
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        body { 
            background-color: var(--primary-bg); 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; /* ล็อกหน้าจอไม่ให้ Scroll ทั้งหน้า */
        }
        
        /* ปรับ Sidebar เป็นแนวตั้งแทน */
        #left-sidebar-container { 
            width: var(--sidebar-width); 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            background: #fff; 
            border-right: 2px solid #eee; 
            flex-shrink: 0; 
        }
        .queue-split-area { 
            display: flex; 
            flex-direction: column; /* เปลี่ยนจาก row เป็น column */
            flex: 1; 
            min-height: 0; 
        }
        .side-panel { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            padding: 10px; /* ลด padding */
            overflow: hidden; 
        }

        .side-panel h3 { font-size: 1em; margin: 5px 0; }
        /* พื้นที่หลักทางขวา */
        .panel-main { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; /* ให้ Scroll เฉพาะฝั่งขวา */
            display: flex; 
            flex-direction: column; 
            gap: 15px;
        }
        .list-box { flex: 1; border: 1px solid #ddd; border-radius: 12px; overflow-y: auto; padding: 10px; background: #fafafa; }
        
        .player-item { padding: 10px; margin-bottom: 8px; border-radius: 10px; border: 2px solid #eee; background: white; cursor: pointer; font-weight: bold; display: flex; align-items: center; transition: 0.2s; }
        .player-item:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        .skill-dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.2); flex-shrink: 0; }
        .lvl-yellow { background: var(--v-yellow); } .lvl-green { background: var(--v-green); } .lvl-blue { background: var(--v-blue); } .lvl-red { background: var(--v-red); } .lvl-black { background: var(--v-black); }
        .sel-a { border-color: var(--team-a); background: #e7f3ff; } .sel-b { border-color: var(--team-b); background: #f0fff4; }

        /* ปรับ Grid สนามให้เล็กลงหน่อยเพื่อประหยัดพื้นที่ */
        .courts-wrapper { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 10px; 
        }
        .court-card { background: white; border-radius: 20px; padding: 15px; box-shadow: 0 8px 15px rgba(0,0,0,0.05); border-top: 10px solid #ccc; }
        .court-card.playing { border-top-color: #4caf50; background: var(--playing-bg); }
        .slot { background: white; padding: 10px; border-radius: 8px; font-size: 0.85em; font-weight: bold; border: 1px dashed #ccc; cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: 42px; margin-bottom: 5px; overflow: hidden; }
        .slot.occupied { border-style: solid; border-color: rgba(0,0,0,0.1); }

        button { cursor: pointer; border: none; font-family: 'Kanit'; font-weight: 600; border-radius: 10px; transition: 0.2s; }
        .btn-primary { background: #007bff; color: white; }
        .btn-start { background: #4caf50; color: white; width: 100%; padding: 12px; margin-top: 8px; }
        .btn-end { background: var(--accent-red); color: #d00; width: 100%; padding: 12px; margin-top: 8px; }
        
        /* ปรับตารางประวัติให้กะทัดรัด */
        .history-section { 
            margin-top: 10px; 
            padding: 15px; 
            flex-shrink: 0; /* ไม่ให้ส่วนประวัติโดนบีบจนหาย */
        }
        .history-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .history-table td, .history-table th { 
            padding: 8px 5px; 
            font-size: 0.8em; 
        }
        
        /* สไตล์เพิ่มเติมสำหรับตารางประวัติ */
        .badge-court {
            background: #444; color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.8em;
        }
        /* ชื่อทีมในประวัติให้เล็กลงเล็กน้อยแต่ยังอ่านง่าย */
        .team-pill { 
            padding: 2px 6px; 
            font-size: 0.85em; 
        }
        .team-a-pill { background-color: var(--team-a); color: #004085; }
        .team-b-pill { background-color: var(--team-b); color: #09440c; }
        .vs-text { margin: 0 10px; font-weight: bold; color: #999; font-style: italic; }
        .game-no { font-weight: bold; color: #666; }

        #qr-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 25px; text-align: center; }
    </style>
</head>
<body>

    <div id="left-sidebar-container">
        <div class="queue-split-area">
            <div class="side-panel" style="border-bottom: 1px solid #eee;">
                <h3>👥 คิวรอ (FIFO)</h3>
                <div id="checkin-list" class="list-box"></div>
                <button id="confirmBtn" class="btn-primary" style="width:100%; padding:14px; margin-top:8px; font-size:1em;">ยืนยันลงสนาม (0)</button>
            </div>
            <div class="side-panel" style="background: #fffdf5;">
                <h3>⏳ คิวกลาง</h3>
                <div id="queue-list" class="list-box"></div>
            </div>
        </div>
        <div style="padding: 10px; background: #f9f9f9; border-top: 1px solid #eee;">
            <textarea id="bulk-paste-input" rows="2" placeholder="วางรายชื่อที่นี่..." style="width: 100%; border-radius: 8px; border: 1px solid #ddd; padding: 10px; font-size: 0.8em; resize: none;"></textarea>
            <button onclick="importBulkPlayers()" style="width: 100%; padding: 10px; margin-top: 5px; background: #6f42c1; color: white;">🚀 นำเข้ารายชื่อ</button>
        </div>
    </div>

    <div class="panel-main">
        <div style="display:flex; gap:12px; margin-bottom:20px; align-items: center;">
            <button onclick="createSession()" style="background: #4caf50; color: white; padding: 12px 20px;">🚀 เปิดก๊วนใหม่</button>
            <button onclick="addNewCourt()" style="background: #2196f3; color: white; padding: 12px 20px;">➕ เพิ่มสนาม</button>
            <button onclick="terminateSession()" style="background: #ff4d4f; color: white; padding: 12px 20px;">🏁 จบก๊วน & ส่งสรุป</button>
            <div id="qrcode" onclick="expandQR()" style="margin-left: auto; cursor: zoom-in;"></div>
        </div>

        <div id="empty-msg" style="text-align:center; color:#999; margin-top:50px;">ยังไม่มีสนาม กด "เพิ่มสนาม"</div>
        <div class="courts-wrapper" id="main-grid"></div>

        <div class="history-section">
            <h3>📜 ประวัติการแข่งวันนี้</h3>
            <table class="history-table">
                <thead>
                    <tr><th>#</th><th>สนาม</th><th>คู่แข่งขัน</th><th>เวลาจบ</th></tr>
                </thead>
                <tbody id="match-history-list"></tbody>
            </table>
        </div>
    </div>

    <div id="qr-overlay" onclick="this.style.display='none'"><div class="modal-content"><h2>Scan QR!</h2><div id="qr-big" style="display:flex; justify-content:center; margin:20px 0;"></div><p id="sid-text"></p></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, query, orderBy, updateDoc, writeBatch, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDQbnx83sbs1sO4xsuLUV50uxbBinr2VtY", authDomain: "earlybird-queue.firebaseapp.com", projectId: "earlybird-queue", storageBucket: "earlybird-queue.firebasestorage.app", messagingSenderId: "310694006567", appId: "1:310694006567:web:f56fc19ed03b81bf8c2302" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let selectedSlots = [null, null, null, null], currentSessionId = localStorage.getItem('last_sid') || "", lastSnapshotData = [], middleQueue = [], nextCourtNumber = 1;

        window.onload = () => {
            if (currentSessionId) {
                generateQR(currentSessionId);
                listenToAttendance();
                listenToMatches();
                const sq = localStorage.getItem(`queue_${currentSessionId}`);
                if(sq) { middleQueue = JSON.parse(sq); renderMiddleQueue(); }
                loadCourtsFromLocal();
            }
            new Sortable(document.getElementById('main-grid'), { animation: 150, handle: '.court-header', onEnd: saveCourtsToLocal });
        };

        // --- Session Management ---
        window.createSession = async () => {
            if(currentSessionId && !confirm("เริ่มก๊วนใหม่? ข้อมูลปัจจุบันจะถูกเคลียร์")) return;
            const sid = "GS" + Date.now().toString().slice(-6);
            await setDoc(doc(db, "sessions", sid), { status: "active", created_at: Date.now() });
            localStorage.setItem('last_sid', sid); location.reload();
        };

        window.terminateSession = async () => {
            if (lastSnapshotData.length === 0) return alert("ไม่มีข้อมูลสมาชิก");
            const baseRate = 150; // ปรับค่าสนามพื้นฐานที่นี่
            let totalShuttle = 0, totalExtra = 0, totalDiscount = 0;
            lastSnapshotData.forEach(p => {
                totalShuttle += (p.data.shuttle_used || 0);
                totalExtra += (p.data.extra_cost || 0);
                totalDiscount += (p.data.discount || 0);
            });
            const netTotal = (lastSnapshotData.length * baseRate) + totalExtra - totalDiscount;
            const report = `📊 สรุปก๊วนวันนี้\n----------------\n👥 สมาชิก: ${lastSnapshotData.length} คน\n🏸 ลูกแบด: ${totalShuttle} ลูก\n💰 ยอดเพิ่ม: ${totalExtra} บ.\n💸 ส่วนลด: ${totalDiscount} บ.\n----------------\n💵 ยอดรวมสุทธิ: ${netTotal.toLocaleString()} บาท`;

            if (confirm(report + "\n\nกดตกลงเพื่อ Copy รายงานและจบก๊วน")) {
                await navigator.clipboard.writeText(report);
                await updateDoc(doc(db, "sessions", currentSessionId), { status: "closed", summary: report });
                localStorage.removeItem(`courts_${currentSessionId}`);
                localStorage.removeItem(`queue_${currentSessionId}`);
                alert("คัดลอกรายงานแล้ว! นำไปวางใน LINE ได้เลย"); location.reload();
            }
        };

        // --- Core Functions ---
        async function saveCourtsToLocal() {
            if(!currentSessionId) return;
            const courts = [];
            document.querySelectorAll('.court-card').forEach(card => {
                const slots = [];
                card.querySelectorAll('.slot').forEach(s => slots.push({ uid: s.dataset.uid || null, html: s.innerHTML, occupied: s.classList.contains('occupied') }));
                courts.push({ id: card.id, courtNum: card.querySelector('select').value, status: document.getElementById(`status-${card.id}`).innerText, playing: card.classList.contains('playing'), shuttle: document.getElementById(`shuttle-${card.id}`).innerText, slots });
            });
            localStorage.setItem(`courts_${currentSessionId}`, JSON.stringify(courts));
            await updateDoc(doc(db, "sessions", currentSessionId), { live_courts: courts });
        }

        function loadCourtsFromLocal() {
            const data = localStorage.getItem(`courts_${currentSessionId}`);
            if(!data) return;
            const courts = JSON.parse(data);
            if(courts.length > 0) document.getElementById('empty-msg').style.display = 'none';
            courts.forEach(c => renderCourtUI(c));
            nextCourtNumber = courts.length > 0 ? Math.max(...courts.map(c => parseInt(c.courtNum))) + 1 : 1;
        }

        function renderCourtUI(c) {
            const opts = Array.from({length:10}, (_, i) => `<option value="${i+1}" ${i+1==c.courtNum?'selected':''}>สนาม ${i+1}</option>`).join('');
            const html = `<div class="court-card ${c.playing?'playing':''}" id="${c.id}">
                <div class="court-header" style="display:flex; justify-content:space-between; margin-bottom:10px;">
                    <select onchange="saveCourtsToLocal()">${opts}</select>
                    <button onclick="this.closest('.court-card').remove(); saveCourtsToLocal();" style="color:red; background:none;">ลบ</button>
                </div>
                <div id="status-${c.id}" style="font-size:0.8em; font-weight:bold; color:#666; margin-bottom:5px;">${c.status}</div>
                <div style="display:flex; gap:8px;">
                    <div style="flex:1; background:var(--team-a); padding:5px; border-radius:10px;">
                        <div class="slot ${c.slots[0].occupied?'occupied':''}" data-uid="${c.slots[0].uid||''}" onclick="assignSlot(this, '${c.id}')">${c.slots[0].html}</div>
                        <div class="slot ${c.slots[1].occupied?'occupied':''}" data-uid="${c.slots[1].uid||''}" onclick="assignSlot(this, '${c.id}')">${c.slots[1].html}</div>
                    </div>
                    <div style="flex:1; background:var(--team-b); padding:5px; border-radius:10px;">
                        <div class="slot ${c.slots[2].occupied?'occupied':''}" data-uid="${c.slots[2].uid||''}" onclick="assignSlot(this, '${c.id}')">${c.slots[2].html}</div>
                        <div class="slot ${c.slots[3].occupied?'occupied':''}" data-uid="${c.slots[3].uid||''}" onclick="assignSlot(this, '${c.id}')">${c.slots[3].html}</div>
                    </div>
                </div>
                <div style="text-align:center; margin:8px 0; font-size:0.9em;">🏸 <button onclick="changeShuttle('${c.id}',-1)">-</button> <b id="shuttle-${c.id}">${c.shuttle||1}</b> <button onclick="changeShuttle('${c.id}',1)">+</button></div>
                <button id="btn-start-${c.id}" class="btn-start" style="display:${c.playing?'none':'block'}" onclick="startMatch('${c.id}')">▶️ เริ่มเกม</button>
                <button id="btn-end-${c.id}" class="btn-end" style="display:${c.playing?'block':'none'}" onclick="handleEndGame('${c.id}')">⏹️ จบเกม</button>
            </div>`;
            document.getElementById('main-grid').insertAdjacentHTML('beforeend', html);
        }

        window.addNewCourt = () => {
            document.getElementById('empty-msg').style.display = 'none';
            const id = `c-${Date.now()}`;
            renderCourtUI({ id, courtNum: nextCourtNumber++, status: "🟢 ว่าง", shuttle: "1", playing: false, slots: [{html:"ว่าง",occupied:false},{html:"ว่าง",occupied:false},{html:"ว่าง",occupied:false},{html:"ว่าง",occupied:false}] });
            saveCourtsToLocal();
        };

        // --- Game Logic ---
        window.assignSlot = async (el, courtId) => {
            const sIdx = selectedSlots.findIndex(p => p !== null);
            const oldUid = el.dataset.uid;
            const batch = writeBatch(db);

            if (sIdx === -1 && oldUid) {
                if(confirm("เอาออกจากสนาม?")) {
                    batch.update(doc(db, `sessions/${currentSessionId}/attendance`, oldUid), { is_playing: false });
                    await batch.commit(); el.innerText = "ว่าง"; el.classList.remove('occupied'); delete el.dataset.uid;
                    saveCourtsToLocal(); renderFIFO();
                } return;
            }
            if (sIdx !== -1) {
                if (oldUid) batch.update(doc(db, `sessions/${currentSessionId}/attendance`, oldUid), { is_playing: false });
                batch.update(doc(db, `sessions/${currentSessionId}/attendance`, selectedSlots[sIdx].id), { is_playing: true });
                await batch.commit();
                const p = lastSnapshotData.find(d => d.id === selectedSlots[sIdx].id);
                el.innerHTML = `<span class="skill-dot lvl-${p.data.skill_level}"></span> ${p.data.display_name}`;
                el.dataset.uid = p.id; el.classList.add('occupied');
                selectedSlots[sIdx] = null; saveCourtsToLocal(); renderFIFO();
            }
        };

        window.startMatch = (id) => {
            const card = document.getElementById(id);
            if(card.querySelectorAll('.occupied').length === 0) return alert("ยังไม่มีคนในสนาม");
            card.classList.add('playing'); document.getElementById(`status-${id}`).innerText = "🎾 กำลังแข่ง";
            document.getElementById(`btn-start-${id}`).style.display = "none";
            document.getElementById(`btn-end-${id}`).style.display = "block";
            saveCourtsToLocal();
        };

        window.handleEndGame = async (id) => {
            const card = document.getElementById(id);
            const players = Array.from(card.querySelectorAll('.slot')).map(s => s.innerText.replace('ว่าง','').trim() || "-");
            const batch = writeBatch(db);
            
            // บันทึกประวัติ
            const mRef = doc(collection(db, `sessions/${currentSessionId}/matches`));
            batch.set(mRef, { court: card.querySelector('select').value, teamA: [players[0], players[1]], teamB: [players[2], players[3]], timestamp: Date.now() });

            const sUsed = parseInt(document.getElementById(`shuttle-${id}`).innerText);
            card.querySelectorAll('.occupied').forEach(s => {
                batch.update(doc(db, `sessions/${currentSessionId}/attendance`, s.dataset.uid), { is_playing: false, last_match_end: Date.now(), games_played: increment(1), shuttle_used: increment(sUsed) });
                s.innerText = "ว่าง"; s.classList.remove('occupied'); delete s.dataset.uid;
            });
            await batch.commit();
            card.classList.remove('playing'); document.getElementById(`status-${id}`).innerText = "🟢 ว่าง";
            document.getElementById(`shuttle-${id}`).innerText = "1";
            document.getElementById(`btn-start-${id}`).style.display = "block";
            document.getElementById(`btn-end-${id}`).style.display = "none";
            saveCourtsToLocal(); renderFIFO(); checkAndFillEmptyCourts();
        };

        // --- Queue System ---
        // --- ส่วนที่ 1: แก้ไขฟังก์ชัน renderFIFO เพื่อจัดการชื่อซ้ำและแสดงจำนวนเกม ---
        window.renderFIFO = () => {
            const list = document.getElementById('checkin-list'); 
            list.innerHTML = "";
            
            // 1. รวบรวม ID ของคนที่ "ถูกเลือกอยู่" ทั้งใน selectedSlots และใน middleQueue (คิวกลาง)
            // เพื่อเอาไปกรองออก ไม่ให้ชื่อปรากฏซ้ำในคิวรอ
            const selectedIds = selectedSlots.filter(s => s).map(s => s.id);
            const inMiddleQueueIds = middleQueue.flatMap(q => q.slots.filter(s => s).map(s => s.id));
            const excludedIds = [...selectedIds, ...inMiddleQueueIds];

            lastSnapshotData.forEach(p => {
                // เงื่อนไข: ต้องไม่กำลังแข่ง (is_playing) และไม่อยู่ในรายชื่อที่ถูกเลือก/คิวกลาง (excludedIds)
                // ยกเว้น! ถ้าคนนั้นถูกเลือกอยู่ใน selectedSlots "ปัจจุบัน" ให้แสดงออกมาเพื่อให้กดเอาออกได้ (มีสีไฮไลต์)
                const isCurrentlySelected = selectedIds.includes(p.id);

                if (!p.data.is_playing && (!excludedIds.includes(p.id) || isCurrentlySelected)) {
                    const selIdx = selectedSlots.findIndex(s => s?.id === p.id);
                    const div = document.createElement('div');
                    
                    let selectClass = "";
                    if (selIdx !== -1) {
                        selectClass = (selIdx < 2) ? " sel-a" : " sel-b";
                    }
                    
                    // ดึงจำนวนเกม (ถ้าไม่มีให้เป็น 0)
                    const games = p.data.games_played || 0;

                    div.className = "player-item" + selectClass;
                    // เพิ่ม (G: ${games}) ต่อท้ายชื่อ
                    div.innerHTML = `
                        <span class="skill-dot lvl-${p.data.skill_level}"></span> 
                        <span style="flex:1; margin-left:8px;">${p.data.display_name}</span>
                        <span style="font-size:0.8em; color:#666;">(${games})</span>
                    `;
                    
                    div.onclick = () => {
                        const idx = selectedSlots.findIndex(s => s?.id === p.id);
                        if(idx > -1) {
                            selectedSlots[idx] = null;
                        } else {
                            const f = selectedSlots.indexOf(null);
                            if(f > -1) {
                                selectedSlots[f] = {id: p.id, name: p.data.display_name};
                            }
                        }
                        renderFIFO(); 
                        updateBtn();
                        highlightInHistory(); 
                    };
                    list.appendChild(div);
                }
            });
        };

        // --- ส่วนที่ 2: ฟังก์ชัน Highlight ประวัติแบบ Multi-Selection แยกสีทีม ---
        window.highlightInHistory = () => {
            // 1. ล้างไฮไลต์เก่าทั้งหมดในตารางประวัติก่อน
            document.querySelectorAll('.clickable-name').forEach(el => {
                el.style.backgroundColor = ""; 
                el.style.border = "none";
                el.style.boxShadow = "none";
                el.style.transform = "scale(1)";
            });

            // 2. วนลูปเช็กชื่อจาก selectedSlots ทั้ง 4 ช่อง
            selectedSlots.forEach((slot, index) => {
                if (slot && slot.name) {
                    const searchName = slot.name.trim();
                    // กำหนดสีตามทีม: ช่อง 0,1 คือทีม A (น้ำเงิน) | ช่อง 2,3 คือทีม B (เขียว)
                    const highlightColor = (index < 2) ? "#007bff" : "#28a745"; 
                    const bgColor = (index < 2) ? "#e7f3ff" : "#f0fff4";

                    // 3. ค้นหาชื่อที่ตรงกันในตารางประวัติ
                    document.querySelectorAll('.clickable-name').forEach(el => {
                        if (el.innerText.trim() === searchName) {
                            el.style.border = `2px solid ${highlightColor}`;
                            el.style.backgroundColor = bgColor;
                            el.style.boxShadow = `0 0 8px ${highlightColor}66`; // ใส่ Glow อ่อนๆ
                            el.style.transform = "scale(1.05)"; // ขยายขนาดเล็กน้อยให้เด่น
                            el.style.transition = "0.2s";
                        }
                    });
                }
            });
        };

        function renderMiddleQueue() {
            const list = document.getElementById('queue-list'); list.innerHTML = "";
            middleQueue.forEach((q, i) => {
                const div = document.createElement('div'); div.className = "player-item"; div.style.fontSize = "0.8em";
                div.innerHTML = `Q${i+1}: ${q.slots[0]?.name||'-'}+${q.slots[1]?.name||'-'} VS ${q.slots[2]?.name||'-'}+${q.slots[3]?.name||'-'}`;
                div.onclick = () => { selectedSlots = [...q.slots]; middleQueue.splice(i, 1); saveQueue(); renderMiddleQueue(); renderFIFO(); };
                list.appendChild(div);
            });
        }

        document.getElementById('confirmBtn').onclick = () => {
            if(!selectedSlots.filter(s => s).length) return;
            middleQueue.push({slots: [...selectedSlots]});
            selectedSlots = [null,null,null,null]; saveQueue(); renderFIFO(); renderMiddleQueue(); checkAndFillEmptyCourts();
        };

        async function checkAndFillEmptyCourts() {
            const empty = Array.from(document.querySelectorAll('.court-card')).find(c => !c.classList.contains('playing') && c.querySelectorAll('.occupied').length === 0);
            if(empty && middleQueue.length > 0 && middleQueue[0].slots.filter(s=>s).length === 4) {
                const q = middleQueue.shift(); const batch = writeBatch(db); const slots = empty.querySelectorAll('.slot');
                q.slots.forEach((p, i) => {
                    batch.update(doc(db, `sessions/${currentSessionId}/attendance`, p.id), { is_playing: true });
                    const pd = lastSnapshotData.find(d => d.id === p.id);
                    slots[i].innerHTML = `<span class="skill-dot lvl-${pd.data.skill_level}"></span> ${p.name}`;
                    slots[i].dataset.uid = p.id; slots[i].classList.add('occupied');
                });
                await batch.commit(); saveQueue(); renderMiddleQueue(); renderFIFO(); saveCourtsToLocal();
            }
        }

        // --- Database Listeners ---
        function listenToAttendance() {
            onSnapshot(query(collection(db, `sessions/${currentSessionId}/attendance`), orderBy("last_match_end", "asc")), snap => {
                lastSnapshotData = snap.docs.map(d => ({ id: d.id, data: d.data() })); renderFIFO();
            });
        }

        // --- ส่วนที่ 3: ปรับปรุง listenToMatches เล็กน้อย (เพื่อให้แน่ใจว่าโหลดข้อมูลใหม่แล้วไฮไลต์ยังอยู่) ---
        function listenToMatches() {
            onSnapshot(query(collection(db, `sessions/${currentSessionId}/matches`), orderBy("timestamp", "desc")), snap => {
                const list = document.getElementById('match-history-list');
                list.innerHTML = "";
                
                snap.docs.forEach((doc, i) => {
                    const m = doc.data();
                    const time = new Date(m.timestamp).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
                    const gameNumber = snap.size - i;

                    const row = `
                        <tr>
                            <td class="game-no">เกมที่ ${gameNumber}</td>
                            <td><span class="badge-court">สนาม ${m.court}</span></td>
                            <td>
                                <div class="team-group">
                                    <span class="team-pill team-a-pill clickable-name" onclick="highlightName('${m.teamA[0]}')">${m.teamA[0]}</span> + 
                                    <span class="team-pill team-a-pill clickable-name" onclick="highlightName('${m.teamA[1]}')">${m.teamA[1]}</span>
                                    <span class="vs-text">VS</span>
                                    <span class="team-pill team-b-pill clickable-name" onclick="highlightName('${m.teamB[0]}')">${m.teamB[0]}</span> + 
                                    <span class="team-pill team-b-pill clickable-name" onclick="highlightName('${m.teamB[1]}')">${m.teamB[1]}</span>
                                </div>
                            </td>
                            <td style="color: #888; font-size: 0.8em; text-align: right;">${time} น.</td>
                        </tr>
                    `;
                    list.insertAdjacentHTML('beforeend', row);
                });
                // เมื่อข้อมูลประวัติโหลดเสร็จ ให้คงไฮไลต์ปัจจุบันไว้
                highlightInHistory(); 
            });
        }

        // เพิ่มฟังก์ชันนี้ลงใน <script> ของคุณ
        window.highlightName = (name) => {
            // ลบไฮไลต์เก่าทั้งหมดก่อน
            document.querySelectorAll('.clickable-name').forEach(el => el.style.border = "none");
            
            // ค้นหาทุกชื่อที่ตรงกับที่กด แล้วใส่ Border เน้นให้เห็นชัด
            document.querySelectorAll('.clickable-name').forEach(el => {
                if(el.innerText.trim() === name.trim()) {
                    el.style.border = "2px solid #ff0000"; // ขอบแดงเน้นชื่อ
                    el.style.boxShadow = "0 0 5px rgba(255,0,0,0.5)";
                }
            });
        };

        // --- Helper ---
        window.importBulkPlayers = async () => {
            const input = document.getElementById('bulk-paste-input');
            const lines = input.value.trim().split('\n').map(l => l.replace(/^\d+\.\s*/, '').trim()).filter(n => n);
            if(!lines.length) return;
            const batch = writeBatch(db); const now = Date.now();
            lines.forEach((name, i) => {
                const id = "m_" + now + i;
                batch.set(doc(db, `sessions/${currentSessionId}/attendance`, id), { id, display_name: name, skill_level: "yellow", is_playing: false, games_played: 0, shuttle_used: 0, last_match_end: now + i, checkin_at: now });
            });
            await batch.commit(); input.value = "";
        };

        const saveQueue = () => localStorage.setItem(`queue_${currentSessionId}`, JSON.stringify(middleQueue));
        window.changeShuttle = (id, v) => { const el = document.getElementById(`shuttle-${id}`); let n = parseInt(el.innerText)+v; if(n>0) { el.innerText=n; saveCourtsToLocal(); } };
        window.updateBtn = () => { document.getElementById('confirmBtn').innerText = `ยืนยันลงสนาม (${selectedSlots.filter(s=>s).length})`; };
        window.generateQR = (id) => { document.getElementById("qrcode").innerHTML = ""; new QRCode(document.getElementById("qrcode"), { text: `https://early-bird-queue.vercel.app/index.html?session=${id}`, width: 50, height: 50 }); };
        window.expandQR = () => { document.getElementById('qr-big').innerHTML = ""; new QRCode(document.getElementById('qr-big'), { text: `https://early-bird-queue.vercel.app/profile.html?session=${currentSessionId}`, width: 200, height: 200 }); document.getElementById('sid-text').innerText = "Session ID: " + currentSessionId; document.getElementById('qr-overlay').style.display = 'flex'; };
    </script>
</body>
