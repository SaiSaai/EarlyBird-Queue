<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badminton Admin PRO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary-bg: #fdfcf0; --team-a: #a2d2ff; --team-b: #b9fbc0; --accent-red: #ffcfd2; --text-color: #444; }
        * { font-family: 'Kanit', sans-serif !important; box-sizing: border-box; }
        body { background-color: var(--primary-bg); color: var(--text-color); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Side Panels */
        .side-panel { width: 300px; transition: 0.3s; flex-shrink: 0; display: flex; flex-direction: column; background: #fff; border-right: 2px solid #eee; padding: 15px; position: relative; }
        .side-panel.collapsed { width: 50px; padding: 15px 5px; overflow: hidden; }
        .side-panel.collapsed .content-view { display: none; }
        .side-panel.collapsed::after { content: attr(data-label); writing-mode: vertical-rl; text-orientation: mixed; font-weight: bold; color: #888; margin: 20px auto; display: block; }
        
        /* Responsive Grid Logic */
        .panel-main { flex: 1; padding: 20px; overflow-y: auto; transition: 0.3s; }
        .courts-wrapper { 
            display: grid; 
            gap: 20px; 
            grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); 
        }

        /* Responsive Breakpoints */
        @media (max-width: 1024px) { body { --cols: 2; } }
        @media (max-width: 600px) { body { --cols: 1; } }

        /* UI Elements */
        .list-box { flex: 1; border: 1px solid #ddd; border-radius: 15px; overflow-y: auto; padding: 10px; background: #fafafa; }
        button { border: none !important; border-radius: 12px !important; cursor: pointer; transition: 0.2s; font-weight: 600; }
        
        .court-card { background: white; border-radius: 20px; padding: 15px; box-shadow: 0 8px 15px rgba(0,0,0,0.05); border-top: 10px solid #ccc; }
        .court-card.playing { border-top-color: #4caf50; background: #f0fff4; }
        .court-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #f8f9fa; border-radius: 15px; cursor: grab; margin-bottom: 10px; }
        
        .player-item { padding: 12px; margin-bottom: 8px; border-radius: 12px; border: 2px solid #eee; background: white; cursor: pointer; text-align: center; font-weight: 600; user-select: none; }
        .sel-a { border-color: var(--team-a); background: #e7f3ff; }
        .sel-b { border-color: var(--team-b); background: #f0fff4; }
        
        .slot { background: white; padding: 10px; border-radius: 10px; font-size: 0.85em; text-align: center; font-weight: bold; border: 1px dashed #ccc; cursor: pointer; min-height: 45px; display: flex; align-items: center; justify-content: center; }
        .slot.occupied { border-style: solid; border-color: #eee; }

        .skill-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 5px; }
        .lvl-yellow { background: #fff9ae; } .lvl-green { background: #c1f0c8; } .lvl-blue { background: #b8e2f2; } .lvl-red { background: #ffcfd2; } .lvl-black { background: #444; }

        #qr-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; justify-content: center; align-items: center; cursor: pointer; }
        .skill-picker { display: none; position: fixed; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 9999; padding: 10px; }
    </style>
</head>
<body style="--cols: 1;">

    <div class="side-panel" id="panel-wait" data-label="👥 คิวรอ">
        <div class="content-view">
            <h3 onclick="togglePanel('panel-wait')" style="cursor:pointer">👥 คิวรอ (หุบ)</h3>
            <div id="checkin-list" class="list-box"></div>
            <button id="confirmBtn" style="background:#007bff; color:white; width:100%; padding:15px; margin-top:10px;">ยืนยันลงสนาม (0)</button>
        </div>
    </div>

    <div class="side-panel" id="panel-mid" data-label="⏳ คิวกลาง" style="background:#fffdf5;">
        <div class="content-view">
            <h3 onclick="togglePanel('panel-mid')" style="cursor:pointer">⏳ คิวกลาง (หุบ)</h3>
            <div id="queue-list" class="list-box"></div>
        </div>
    </div>

    <div class="panel-main">
        <div style="display:flex; gap:15px; margin-bottom:20px; align-items:center;">
            <button id="btnCreate" style="background:#4caf50; color:white; padding:12px 25px;">🚀 เปิดก๊วนใหม่</button>
            <button id="btnAddCourt" style="background:#2196f3; color:white; padding:12px 25px;">➕ เพิ่มสนาม</button>
            <div id="qrcode" style="margin-left:auto; cursor:zoom-in; background:white; padding:5px; border-radius:10px; border:1px solid #ddd;"></div>
        </div>
        <div class="courts-wrapper" id="main-grid"></div>
    </div>

    <div id="qr-overlay" onclick="this.style.display='none'"><div id="qr-big"><div id="qr-target"></div></div></div>
    <div id="skillPicker" class="skill-picker"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, addDoc, onSnapshot, query, orderBy, updateDoc, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDQbnx83sbs1sO4xsuLUV50uxbBinr2VtY", authDomain: "earlybird-queue.firebaseapp.com", projectId: "earlybird-queue", storageBucket: "earlybird-queue.firebasestorage.app", messagingSenderId: "310694006567", appId: "1:310694006567:web:f56fc19ed03b81bf8c2302" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentSessionId = "", selectedSlots = [null, null, null, null], allPlayers = [], middleQueue = [], timers = {}, nextCourtNum = 1;

        // --- Layout Responsive ---
        window.togglePanel = (id) => {
            document.getElementById(id).classList.toggle('collapsed');
            updateGridCols();
        };

        function updateGridCols() {
            const waitOpen = !document.getElementById('panel-wait').classList.contains('collapsed');
            const midOpen = !document.getElementById('panel-mid').classList.contains('collapsed');
            let cols = 3;
            if (waitOpen && midOpen) cols = 1;
            else if (waitOpen || midOpen) cols = 2;
            document.body.style.setProperty('--cols', window.innerWidth < 768 ? 1 : cols);
        }
        window.onresize = updateGridCols;

        // --- Core Functions ---
        window.startMatch = (id) => {
            const card = document.getElementById(id);
            if(card.querySelectorAll('.slot.occupied').length === 0) return;
            card.classList.add('playing');
            document.getElementById(`status-${id}`).innerText = "🎾 กำลังแข่ง...";
            document.getElementById(`start-${id}`).style.display = "none";
            document.getElementById(`end-${id}`).style.display = "block";
            let sec = 0;
            timers[id] = setInterval(() => {
                sec++;
                const m = String(Math.floor(sec/60)).padStart(2,'0'), s = String(sec%60).padStart(2,'0');
                document.getElementById(`timer-${id}`).innerText = `${m}:${s}`;
            }, 1000);
        };

        window.endMatch = async (id) => {
            if(!confirm("จบเกม?")) return;
            const card = document.getElementById(id);
            const uids = Array.from(card.querySelectorAll('.slot.occupied')).map(s => s.dataset.uid);
            const batch = writeBatch(db);
            uids.forEach(u => batch.update(doc(db, `sessions/${currentSessionId}/attendance`, u), { is_playing: false, last_match_end: Date.now() }));
            await batch.commit();
            clearInterval(timers[id]);
            card.classList.remove('playing');
            card.querySelectorAll('.slot').forEach(s => { s.innerText="ว่าง"; s.classList.remove('occupied'); delete s.dataset.uid; });
            document.getElementById(`status-${id}`).innerText = "🟢 ว่าง";
            document.getElementById(`start-${id}`).style.display = "block";
            document.getElementById(`end-${id}`).style.display = "none";
            checkAutoFill();
        };

        window.shuttle = (id, v) => {
            const el = document.getElementById(`shuttle-${id}`);
            let n = parseInt(el.innerText) + v;
            if(n >= 0) el.innerText = n;
        };

        window.addNewCourt = () => {
            const id = `c-${Date.now()}`;
            const num = nextCourtNum++;
            const options = Array.from({length:25}, (_, i) => `<option value="${i+1}" ${i+1==num?'selected':''}>สนาม ${i+1}</option>`).join('');
            const html = `
                <div class="court-card" id="${id}">
                    <div class="court-header">
                        <select style="border:none; background:none; font-weight:bold; color:#2196f3; font-size:1em;">${options}</select>
                        <span id="timer-${id}" style="font-family:monospace; font-weight:bold;">00:00</span>
                        <button onclick="window.deleteCourt('${id}')" style="color:red; background:none;">ลบ</button>
                    </div>
                    <div id="status-${id}" style="font-size:0.8em; color:#999; margin-bottom:5px;">🟢 ว่าง</div>
                    <div style="display:flex; gap:8px;">
                        <div style="flex:1; background:var(--team-a); padding:8px; border-radius:12px; display:flex; flex-direction:column; gap:5px;">
                            <div class="slot" onclick="window.assignSlot(this, '${id}')">ว่าง</div>
                            <div class="slot" onclick="window.assignSlot(this, '${id}')">ว่าง</div>
                        </div>
                        <div style="flex:1; background:var(--team-b); padding:8px; border-radius:12px; display:flex; flex-direction:column; gap:5px;">
                            <div class="slot" onclick="window.assignSlot(this, '${id}')">ว่าง</div>
                            <div class="slot" onclick="window.assignSlot(this, '${id}')">ว่าง</div>
                        </div>
                    </div>
                    <div style="display:flex; align-items:center; justify-content:center; gap:10px; margin-top:10px; font-size:0.9em;">
                        ลูกแบด: <button onclick="window.shuttle('${id}',-1)">-</button> <b id="shuttle-${id}">1</b> <button onclick="window.shuttle('${id}',1)">+</button>
                    </div>
                    <button id="start-${id}" onclick="window.startMatch('${id}')" style="background:#4caf50; color:white; width:100%; padding:10px; margin-top:10px;">เริ่มเกม</button>
                    <button id="end-${id}" onclick="window.endMatch('${id}')" style="background:#ffcfd2; color:red; width:100%; padding:10px; margin-top:10px; display:none;">จบเกม</button>
                </div>`;
            document.getElementById('main-grid').insertAdjacentHTML('beforeend', html);
        };

        window.deleteCourt = (id) => { if(!document.getElementById(id).classList.contains('playing')) document.getElementById(id).remove(); };

        // --- Selection & Skills (Long Press) ---
        let pressTimer;
        function renderFIFO() {
            const list = document.getElementById('checkin-list'); list.innerHTML = "";
            const queuedIds = new Set(middleQueue.flatMap(q => q.slots.filter(s => s).map(s => s.id)));
            allPlayers.forEach(p => {
                if (p.data.is_playing || queuedIds.has(p.id)) return;
                const idx = selectedSlots.findIndex(s => s?.id === p.id);
                const div = document.createElement('div');
                div.className = `player-item ${idx !== -1 ? (idx < 2 ? 'sel-a' : 'sel-b') : ''}`;
                div.innerHTML = `<span class="skill-dot lvl-${p.data.skill_level || 'yellow'}"></span> ${p.data.display_name}`;
                
                div.onmousedown = (e) => { pressTimer = window.setTimeout(() => showSkillPicker(e, p.id), 600); };
                div.onmouseup = () => clearTimeout(pressTimer);
                div.ontouchstart = (e) => { pressTimer = window.setTimeout(() => showSkillPicker(e.touches[0], p.id), 600); };
                div.ontouchend = () => clearTimeout(pressTimer);

                div.onclick = () => {
                    if (idx !== -1) selectedSlots[idx] = null;
                    else { const f = selectedSlots.indexOf(null); if (f !== -1) selectedSlots[f] = { id: p.id, name: p.data.display_name }; }
                    renderFIFO();
                };
                list.appendChild(div);
            });
            document.getElementById('confirmBtn').innerText = `ยืนยันลงสนาม (${selectedSlots.filter(s=>s).length})`;
        }

        function showSkillPicker(e, uid) {
            const pk = document.getElementById('skillPicker');
            pk.style.display = 'block'; pk.style.left = e.pageX+'px'; pk.style.top = e.pageY+'px';
            pk.innerHTML = ['yellow','green','blue','red','black'].map(l => `<div style="padding:10px; cursor:pointer;" onclick="updateSkillDb('${uid}', '${l}')"><span class="skill-dot lvl-${l}"></span> ${l}</div>`).join('');
        }

        window.updateSkillDb = async (uid, lvl) => {
            await updateDoc(doc(db, `sessions/${currentSessionId}/attendance`, uid), { skill_level: lvl });
            document.getElementById('skillPicker').style.display = 'none';
        };

        // --- Logic & Events ---
        document.getElementById('confirmBtn').onclick = () => {
            const ps = selectedSlots.filter(s => s); if(!ps.length) return;
            middleQueue.push({ slots: [...selectedSlots] });
            selectedSlots = [null,null,null,null]; renderFIFO(); renderMiddleQueue(); checkAutoFill();
        };

        function renderMiddleQueue() {
            const list = document.getElementById('queue-list'); list.innerHTML = "";
            middleQueue.forEach(q => {
                const div = document.createElement('div'); div.className = "player-item"; div.style.borderLeft = "8px solid #ffd166";
                div.innerHTML = `<div style="display:flex; gap:5px; font-size:0.7em;">
                    <div style="flex:1; background:var(--team-a); border-radius:5px;">${q.slots[0]?.name||'-'}<br>${q.slots[1]?.name||'-'}</div>
                    <div style="flex:1; background:var(--team-b); border-radius:5px;">${q.slots[2]?.name||'-'}<br>${q.slots[3]?.name||'-'}</div>
                </div>`;
                list.appendChild(div);
            });
        }

        async function checkAutoFill() {
            const empty = Array.from(document.querySelectorAll('.court-card')).find(c => !c.classList.contains('playing') && c.querySelectorAll('.occupied').length === 0);
            if(empty && middleQueue.length > 0) {
                const q = middleQueue.shift();
                const batch = writeBatch(db), slots = empty.querySelectorAll('.slot');
                q.slots.forEach((p, i) => { if(p) {
                    batch.update(doc(db, `sessions/${currentSessionId}/attendance`, p.id), { is_playing: true });
                    const pD = allPlayers.find(x => x.id === p.id);
                    slots[i].innerHTML = `<span class="skill-dot lvl-${pD.data.skill_level||'yellow'}"></span> ${p.name}`;
                    slots[i].dataset.uid = p.id; slots[i].classList.add('occupied');
                }});
                await batch.commit(); renderMiddleQueue(); renderFIFO();
            }
        }

        document.getElementById('btnCreate').onclick = async () => {
            const ref = await addDoc(collection(db, "sessions"), { created_at: serverTimestamp() });
            currentSessionId = ref.id;
            const url = `https://early-bird-queue.vercel.app/index.html?session=${currentSessionId}`;
            new QRCode(document.getElementById("qrcode"), { text: url, width: 60, height: 60 });
            new QRCode(document.getElementById("qr-target"), { text: url, width: 280, height: 280 });
            document.getElementById("qrcode").onclick = () => document.getElementById("qr-overlay").style.display = 'flex';
            onSnapshot(query(collection(db, `sessions/${currentSessionId}/attendance`), orderBy("last_match_end", "asc")), snap => {
                allPlayers = snap.docs.map(d => ({ id: d.id, data: d.data() })); renderFIFO();
            });
            window.addNewCourt(); window.addNewCourt();
            new Sortable(document.getElementById('main-grid'), { animation: 150, handle: '.court-header' });
            updateGridCols();
        };

        document.getElementById('btnAddCourt').onclick = window.addNewCourt;
    </script>
</body>
</html>
