<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badminton Admin - Dropdown Fixed</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary-bg: #fdfcf0; --team-a: #a2d2ff; --team-b: #b9fbc0; --accent-red: #ffcfd2; --text-color: #444; --playing-bg: #f0fff4; }
        body { font-family: 'Kanit', sans-serif; background-color: var(--primary-bg); color: var(--text-color); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        .side-panel { width: 280px; background: #fff; border-right: 2px solid #eee; padding: 15px; display: flex; flex-direction: column; transition: 0.3s; flex-shrink: 0; }
        .panel-main { flex: 1; padding: 20px; overflow-y: auto; }
        .list-box { flex: 1; border: 1px solid #ddd; border-radius: 12px; overflow-y: auto; padding: 10px; background: #fafafa; }
        
        /* Drag Handle: เฉพาะแถบด้านบนสนามที่ลากได้ */
        .court-header { cursor: grab; display: flex; justify-content: space-between; align-items: center; padding-bottom: 5px; border-bottom: 1px solid #eee; margin-bottom: 8px; }
        .court-header:active { cursor: grabbing; }

        .player-item { padding: 10px; margin-bottom: 8px; border-radius: 10px; border: 2px solid #eee; background: white; cursor: pointer; font-weight: bold; text-align: center; }
        .sel-a { border-color: var(--team-a); background: #e7f3ff; }
        .sel-b { border-color: var(--team-b); background: #f0fff4; }

        .queue-group { background: white; border: 2px solid #ffeeba; border-radius: 12px; padding: 10px; margin-bottom: 12px; cursor: pointer; border-left: 8px solid #ffd166; }
        .q-split { display: flex; gap: 8px; margin-top: 8px; }
        .q-tag { flex: 1; font-size: 0.8em; padding: 6px; border-radius: 6px; text-align: center; font-weight: bold; }

        .courts-wrapper { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
        .court-card { background: white; border-radius: 20px; padding: 15px; box-shadow: 0 8px 15px rgba(0,0,0,0.05); border-top: 10px solid #ccc; position: relative; }
        .court-card.playing { border-top-color: #4caf50; background: var(--playing-bg); }

        .team-box { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 15px; min-height: 90px; }
        .slot { background: white; padding: 10px; border-radius: 8px; font-size: 0.9em; text-align: center; font-weight: bold; border: 1px dashed #ccc; cursor: pointer; }
        .slot.occupied { border-style: solid; border-color: rgba(0,0,0,0.1); }

        select, button { font-family: 'Kanit'; font-weight: bold; border-radius: 10px; border: none; cursor: pointer; }
        select { background: #fff; border: 1px solid #ddd; padding: 3px 8px; font-size: 1em; }
        
        .btn-confirm { background: #007bff; color: white; width: 100%; padding: 12px; margin-top: 10px; }
        .btn-start { background: #4caf50; color: white; padding: 10px; width: 100%; margin-top: 8px; }
        .btn-end { background: var(--accent-red); color: #d00; padding: 10px; width: 100%; margin-top: 8px; display: none; }
        .shuttle-counter { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; background: #f9f9f9; padding: 5px; border-radius: 10px; }
        
        .side-panel.collapsed { width: 40px !important; padding: 10px 5px !important; cursor: pointer; background: #eee !important; }
        .side-panel.collapsed * { display: none !important; }
        .side-panel.collapsed::after { content: attr(data-label); writing-mode: vertical-rl; text-orientation: mixed; font-weight: bold; margin: 20px auto; display: block; color: #888; }
        .sortable-ghost { opacity: 0.3; }
    </style>
</head>
<body>

    <div class="side-panel" id="panel-fifo" data-label="👥 คิวรอ" onclick="checkAndOpen('panel-fifo')">
        <h3>👥 คิวรอ <span onclick="event.stopPropagation(); togglePanel('panel-fifo')">❌</span></h3>
        <div id="checkin-list" class="list-box"></div>
        <button id="confirmBtn" class="btn-confirm">ยืนยันลงสนาม (0)</button>
    </div>

    <div class="side-panel" id="panel-queue" data-label="⏳ คิวกลาง" onclick="checkAndOpen('panel-queue')" style="background: #fffdf5;">
        <h3>⏳ คิวกลาง <span onclick="event.stopPropagation(); togglePanel('panel-queue')">❌</span></h3>
        <div id="queue-list" class="list-box"></div>
    </div>

    <div class="panel-main">
        <div style="display:flex; gap:15px; margin-bottom:20px;">
            <button onclick="createSession()" style="background: #4caf50; color: white; padding: 10px 20px;">🚀 เปิดก๊วน</button>
            <button onclick="addNewCourt()" style="background: #2196f3; color: white; padding: 10px 20px;">➕ เพิ่มสนาม</button>
            <div id="qrcode" style="margin-left: auto;"></div>
        </div>
        <div class="courts-wrapper" id="main-grid"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, addDoc, onSnapshot, query, orderBy, updateDoc, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDQbnx83sbs1sO4xsuLUV50uxbBinr2VtY",
            authDomain: "earlybird-queue.firebaseapp.com",
            projectId: "earlybird-queue",
            storageBucket: "earlybird-queue.firebasestorage.app",
            messagingSenderId: "310694006567",
            appId: "1:310694006567:web:f56fc19ed03b81bf8c2302"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let selectedSlots = [null, null, null, null]; 
        let currentSessionId = "";
        let queuedPlayerIds = new Set();
        let lastSnapshotData = [];
        let middleQueue = [];
        let nextCourtNumber = 1;

        window.togglePanel = (id) => document.getElementById(id).classList.toggle('collapsed');
        window.checkAndOpen = (id) => {
            const el = document.getElementById(id);
            if (el.classList.contains('collapsed')) el.classList.remove('collapsed');
        };

        window.createSession = async () => {
            const sessionRef = await addDoc(collection(db, "sessions"), { created_at: serverTimestamp() });
            currentSessionId = sessionRef.id;
            new QRCode(document.getElementById("qrcode"), { text: `https://early-bird-queue.vercel.app/index.html?session=${currentSessionId}`, width: 60, height: 60 });
            listenToAttendance();
            addNewCourt(); addNewCourt();
            
            // Fix Sortable: ใช้ handle เพื่อให้ไม่กวน Dropdown
            new Sortable(document.getElementById('main-grid'), { 
                animation: 150, 
                handle: '.court-header', // ให้ลากได้เฉพาะที่หัวสนาม
                ghostClass: 'sortable-ghost',
                filter: 'select, button, .slot', // ป้องกันการลากเมื่อกดโดนปุ่มหรือ Dropdown
                preventOnFilter: false
            });
        };

        window.addNewCourt = () => {
            const id = `court-${Date.now()}`;
            const courtNum = nextCourtNumber++; // Auto-increment เลขสนาม
            
            document.getElementById('main-grid').insertAdjacentHTML('beforeend', `
                <div class="court-card" id="${id}">
                    <div class="court-header">
                        <select>${generateOptions(courtNum)}</select>
                        <button onclick="this.closest('.court-card').remove()" style="color:red; background:none; font-size:0.7em;">ลบ</button>
                    </div>
                    <span id="status-${id}" style="font-size:0.7em; color:#999;">🟢 ว่าง</span>
                    <div style="display:flex; gap:10px; margin-top:5px;">
                        <div class="team-box" style="background:var(--team-a)"><div class="slot" onclick="assignSlot(this, '${id}')">ว่าง</div><div class="slot" onclick="assignSlot(this, '${id}')">ว่าง</div></div>
                        <div class="team-box" style="background:var(--team-b)"><div class="slot" onclick="assignSlot(this, '${id}')">ว่าง</div><div class="slot" onclick="assignSlot(this, '${id}')">ว่าง</div></div>
                    </div>
                    <div class="shuttle-counter">
                        <span>🏸 ลูกแบด:</span>
                        <button onclick="changeShuttle('${id}', -1)">-</button>
                        <b id="shuttle-${id}">1</b>
                        <button onclick="changeShuttle('${id}', 1)">+</button>
                    </div>
                    <button id="btn-start-${id}" class="btn-start" onclick="startMatch('${id}')">▶️ เริ่มเกม</button>
                    <button id="btn-end-${id}" class="btn-end" onclick="endMatch('${id}')">⏹️ จบเกม / เคลียร์</button>
                </div>`);
            checkAndFillEmptyCourts();
        };

        function generateOptions(selectedNum) {
            let opt = ""; 
            for(let i=1; i<=20; i++) {
                const selected = (i === selectedNum) ? "selected" : "";
                opt += `<option value="${i}" ${selected}>สนาม ${i}</option>`;
            }
            return opt;
        }

        // --- Logic อื่นๆ (Auto Fill, Middle Queue, Match Start/End) ใส่ต่อจากนี้เหมือนเดิม ---
        async function checkAndFillEmptyCourts() {
            if (middleQueue.length === 0) return;
            const emptyCourts = Array.from(document.querySelectorAll('.court-card')).filter(c => 
                !c.classList.contains('playing') && c.querySelectorAll('.occupied').length === 0
            );
            for (let court of emptyCourts) {
                if (middleQueue.length === 0) break;
                const nextGroup = middleQueue[0];
                const playersOnly = nextGroup.slots.filter(p => p !== null);
                if (playersOnly.length === 4) {
                    const batch = writeBatch(db);
                    playersOnly.forEach(p => { batch.update(doc(db, `sessions/${currentSessionId}/attendance`, p.id), { is_playing: true }); queuedPlayerIds.delete(p.id); });
                    await batch.commit();
                    fillCourtUI(court, playersOnly);
                    middleQueue.shift();
                    renderMiddleQueue();
                    renderFIFO();
                }
            }
        }

        function renderFIFO() {
            const list = document.getElementById('checkin-list');
            list.innerHTML = "";
            lastSnapshotData.forEach(player => {
                const { id, data } = player;
                const isSelected = selectedSlots.some(p => p?.id === id);
                if (!data.is_playing && (!queuedPlayerIds.has(id) || isSelected)) {
                    const div = document.createElement('div');
                    div.className = "player-item";
                    div.innerText = data.display_name;
                    div.onclick = () => toggleSelect(id, data.display_name);
                    list.appendChild(div);
                }
            });
            updateSelectionUI();
        }

        window.toggleSelect = (id, name) => {
            const idx = selectedSlots.findIndex(p => p?.id === id);
            if (idx > -1) selectedSlots[idx] = null;
            else {
                const empty = selectedSlots.findIndex(p => p === null);
                if (empty > -1) selectedSlots[empty] = { id, name };
            }
            renderFIFO();
        };

        function updateSelectionUI() {
            const count = selectedSlots.filter(p => p !== null).length;
            const btn = document.getElementById('confirmBtn');
            btn.innerText = (btn.dataset.editIndex !== undefined) ? `💾 บันทึกที่เดิม (คิว ${parseInt(btn.dataset.editIndex)+1})` : `ยืนยันลงสนาม/คิว (${count})`;
            document.querySelectorAll('.player-item').forEach(el => {
                const name = el.innerText;
                const sIdx = selectedSlots.findIndex(p => p?.name === name);
                el.classList.remove('sel-a', 'sel-b');
                if (sIdx === 0 || sIdx === 1) el.classList.add('sel-a');
                if (sIdx === 2 || sIdx === 3) el.classList.add('sel-b');
            });
        }

        function renderMiddleQueue() {
            const list = document.getElementById('queue-list');
            list.innerHTML = "";
            middleQueue.forEach((q, index) => {
                const div = document.createElement('div');
                div.className = "queue-group";
                const names = q.slots.map(p => p ? p.name : "-");
                div.innerHTML = `
                    <div style="font-size:0.75em; color:#999; text-align:center;">คิวที่ ${index+1}</div>
                    <div class="q-split">
                        <div class="q-tag" style="background:var(--team-a)">${names[0]}<br>${names[1]}</div>
                        <div class="q-tag" style="background:var(--team-b)">${names[2]}<br>${names[3]}</div>
                    </div>
                `;
                div.onclick = () => {
                    const btn = document.getElementById('confirmBtn');
                    if (btn.dataset.editIndex) return;
                    q.slots.forEach(p => p && queuedPlayerIds.delete(p.id));
                    selectedSlots = [...q.slots];
                    btn.dataset.editIndex = index;
                    middleQueue.splice(index, 1);
                    renderMiddleQueue();
                    renderFIFO();
                };
                list.appendChild(div);
            });
        }

        document.getElementById('confirmBtn').onclick = async () => {
            const players = selectedSlots.filter(p => p !== null);
            if (players.length === 0) return;
            const btn = document.getElementById('confirmBtn');
            const editIdx = btn.dataset.editIndex;
            const emptyCourt = Array.from(document.querySelectorAll('.court-card')).find(c => 
                !c.classList.contains('playing') && c.querySelectorAll('.occupied').length === 0);
            if (emptyCourt && players.length === 4 && editIdx === undefined) {
                const batch = writeBatch(db);
                players.forEach(p => batch.update(doc(db, `sessions/${currentSessionId}/attendance`, p.id), { is_playing: true }));
                await batch.commit();
                fillCourtUI(emptyCourt, players);
            } else {
                players.forEach(p => queuedPlayerIds.add(p.id));
                if (editIdx !== undefined) { middleQueue.splice(parseInt(editIdx), 0, { slots: [...selectedSlots] }); delete btn.dataset.editIndex; }
                else { middleQueue.push({ slots: [...selectedSlots] }); }
                renderMiddleQueue();
                checkAndFillEmptyCourts();
            }
            selectedSlots = [null, null, null, null];
            renderFIFO();
        };

        window.assignSlot = async (el, courtId) => {
            const oldId = el.dataset.uid;
            const sIdx = selectedSlots.findIndex(p => p !== null);
            if (sIdx === -1) {
                if (oldId && confirm("เอาออก?")) {
                    await updateDoc(doc(db, `sessions/${currentSessionId}/attendance`, oldId), { is_playing: false, last_match_end: Date.now() });
                    el.innerText = "ว่าง"; el.classList.remove('occupied'); delete el.dataset.uid;
                }
                return;
            }
            const p = selectedSlots[sIdx];
            const batch = writeBatch(db);
            if (oldId) batch.update(doc(db, `sessions/${currentSessionId}/attendance`, oldId), { is_playing: false, last_match_end: Date.now() });
            batch.update(doc(db, `sessions/${currentSessionId}/attendance`, p.id), { is_playing: true });
            await batch.commit();
            el.innerText = p.name; el.dataset.uid = p.id; el.classList.add('occupied');
            selectedSlots[sIdx] = null;
            renderFIFO();
        };

        window.startMatch = (id) => {
            document.getElementById(id).classList.add('playing');
            document.getElementById(`status-${id}`).innerText = "🎾 กำลังแข่ง...";
            document.getElementById(`btn-start-${id}`).style.display = "none";
            document.getElementById(`btn-end-${id}`).style.display = "block";
        };

        window.endMatch = async (id) => {
            const c = document.getElementById(id);
            const uids = Array.from(c.querySelectorAll('.occupied')).map(s => s.dataset.uid);
            const batch = writeBatch(db);
            uids.forEach(u => batch.update(doc(db, `sessions/${currentSessionId}/attendance`, u), { is_playing: false, last_match_end: Date.now() }));
            await batch.commit();
            c.classList.remove('playing');
            document.getElementById(`status-${id}`).innerText = "🟢 ว่าง";
            c.querySelectorAll('.slot').forEach(s => { s.innerText="ว่าง"; s.classList.remove('occupied'); delete s.dataset.uid; });
            document.getElementById(`shuttle-${id}`).innerText = "1";
            document.getElementById(`btn-start-${id}`).style.display = "block";
            document.getElementById(`btn-end-${id}`).style.display = "none";
            renderFIFO();
            setTimeout(checkAndFillEmptyCourts, 500);
        };

        window.changeShuttle = (id, v) => {
            const el = document.getElementById(`shuttle-${id}`);
            let cur = parseInt(el.innerText);
            if (cur + v >= 0) el.innerText = cur + v;
        };

        function listenToAttendance() {
            const q = query(collection(db, `sessions/${currentSessionId}/attendance`), orderBy("last_match_end", "asc"));
            onSnapshot(q, (snap) => {
                lastSnapshotData = []; snap.forEach(d => lastSnapshotData.push({ id: d.id, data: d.data() }));
                renderFIFO();
            });
        }

        function fillCourtUI(courtEl, players) {
            const slots = courtEl.querySelectorAll('.slot');
            players.forEach((p, i) => { slots[i].innerText = p.name; slots[i].dataset.uid = p.id; slots[i].classList.add('occupied'); });
        }
    </script>
</body>
</html>
