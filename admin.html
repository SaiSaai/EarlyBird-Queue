<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badminton Admin - Highlight & Toggle</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary-bg: #fdfcf0; --team-a: #a2d2ff; --team-b: #b9fbc0; --accent-red: #ffcfd2; --playing-bg: #f0fff4; 
            --v-yellow: #FFD700; --v-green: #00C853; --v-blue: #2962FF; --v-red: #D50000; --v-black: #000000;
        }
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        body { background-color: var(--primary-bg); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* --- ระบบ Sidebar หุบ-อ้า --- */
        #left-sidebar-container { 
            width: 480px; height: 100vh; display: flex; flex-direction: column; 
            background: #fff; border-right: 2px solid #eee; flex-shrink: 0; 
            transition: all 0.3s ease-in-out; 
            position: relative; z-index: 1000;
        }
        #left-sidebar-container.collapsed { transform: translateX(-480px); width: 0; }
        
        #toggle-sidebar {
            position: absolute; right: -40px; top: 20px;
            width: 40px; height: 50px; background: #fff; border: 2px solid #eee;
            border-left: none; border-radius: 0 15px 15px 0; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #333; box-shadow: 5px 0 10px rgba(0,0,0,0.1);
            z-index: 2000; font-size: 20px;
        }

        /* --- การจัดวางสนาม --- */
        .panel-main { flex: 1; padding: 20px; overflow-y: auto; background-color: var(--primary-bg); transition: all 0.3s ease; }
        .queue-split-area { display: flex; flex: 1; min-height: 0; border-bottom: 2px solid #eee; }
        .side-panel { flex: 1; display: flex; flex-direction: column; padding: 15px; overflow: hidden; width: 240px; }
        .list-box { flex: 1; border: 1px solid #ddd; border-radius: 12px; overflow-y: auto; padding: 10px; background: #fafafa; }
        
        /* --- ระบบ Highlight ชื่อ --- */
        .name-tag { padding: 2px 6px; border-radius: 6px; transition: 0.2s; cursor: pointer; }
        .name-tag.active-highlight { background-color: #ffeb3b !important; color: #000 !important; font-weight: bold; box-shadow: 0 0 8px rgba(255,235,59,0.8); transform: scale(1.1); display: inline-block; }

        /* --- Player Items & Courts --- */
        .player-item { padding: 10px; margin-bottom: 8px; border-radius: 10px; border: 2px solid #eee; background: white; cursor: pointer; font-weight: bold; display: flex; align-items: center; font-size: 0.9em; }
        .skill-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.1); margin-right: 8px; }
        .lvl-yellow { background: var(--v-yellow); } .lvl-green { background: var(--v-green); } .lvl-blue { background: var(--v-blue); } .lvl-red { background: var(--v-red); } .lvl-black { background: var(--v-black); }
        .sel-a { border-color: var(--team-a); background: #e7f3ff; } .sel-b { border-color: var(--team-b); background: #f0fff4; }

        .courts-wrapper { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .court-card { background: white; border-radius: 20px; padding: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-top: 10px solid #ccc; }
        .court-card.playing { border-top-color: #4caf50; background: var(--playing-bg); }
        .slot { background: white; padding: 8px; border-radius: 8px; font-size: 0.85em; font-weight: bold; border: 1px dashed #ccc; margin-bottom: 5px; cursor: pointer; display: flex; align-items: center; min-height: 40px; }
        
        button { cursor: pointer; border: none; font-family: 'Kanit'; font-weight: 600; border-radius: 10px; transition: 0.2s; }
        .btn-primary { background: #007bff; color: white; }
        .btn-start { background: #4caf50; color: white; width: 100%; padding: 10px; margin-top: 5px; }
        .btn-end { background: var(--accent-red); color: #d00; width: 100%; padding: 10px; margin-top: 5px; }
        
        .history-table { width: 100%; border-collapse: collapse; background: white; border-radius: 15px; overflow: hidden; }
        .history-table td { padding: 12px; border-bottom: 1px solid #f0f0f0; font-size: 0.85em; }
    </style>
</head>
<body>

    <div id="left-sidebar-container">
        <button id="toggle-sidebar" onclick="toggleSidebar()">◀</button>

        <div class="queue-split-area">
            <div class="side-panel">
                <h3 style="margin:0 0 10px 0;">👥 คิวรอ</h3>
                <div id="checkin-list" class="list-box"></div>
                <button id="confirmBtn" class="btn-primary" style="width:100%; padding:12px; margin-top:10px;">ลงสนาม (0)</button>
            </div>
            <div class="side-panel" style="background: #fffdf5;">
                <h3 style="margin:0 0 10px 0;">⏳ คิวกลาง</h3>
                <div id="queue-list" class="list-box"></div>
            </div>
        </div>
        <div style="padding: 12px; background: #f9f9f9;">
            <textarea id="bulk-paste-input" rows="2" placeholder="วางชื่อจาก LINE..." style="width: 100%; border-radius: 8px; padding: 8px; font-size: 0.8em;"></textarea>
            <button onclick="importBulkPlayers()" style="width: 100%; padding: 8px; margin-top: 5px; background: #6f42c1; color: white;">🚀 นำเข้าชื่อ</button>
        </div>
    </div>

    <div class="panel-main">
        <div style="display:flex; gap:10px; margin-bottom:20px; align-items: center;">
            <button onclick="createSession()" style="background: #4caf50; color: white; padding: 10px 15px;">🚀 เปิดก๊วน</button>
            <button onclick="addNewCourt()" style="background: #2196f3; color: white; padding: 10px 15px;">➕ เพิ่มสนาม</button>
            <button onclick="terminateSession()" style="background: #ff4d4f; color: white; padding: 10px 15px;">🏁 จบก๊วน</button>
            <div id="qrcode" onclick="expandQR()" style="margin-left: auto; cursor: zoom-in;"></div>
        </div>

        <div id="empty-msg" style="text-align:center; color:#999; margin-top:40px;">ยังไม่มีสนาม</div>
        <div class="courts-wrapper" id="main-grid"></div>

        <div style="margin-top: 40px;">
            <h3>📜 ประวัติการแข่งวันนี้ (คลิกชื่อเพื่อไฮไลต์)</h3>
            <table class="history-table">
                <tbody id="match-history-list"></tbody>
            </table>
        </div>
    </div>

    <div id="qr-overlay" onclick="this.style.display='none'"><div class="modal-content"><h2>Scan QR!</h2><div id="qr-big"></div><p id="sid-text"></p></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, query, orderBy, updateDoc, writeBatch, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDQbnx83sbs1sO4xsuLUV50uxbBinr2VtY", authDomain: "earlybird-queue.firebaseapp.com", projectId: "earlybird-queue", storageBucket: "earlybird-queue.firebasestorage.app", messagingSenderId: "310694006567", appId: "1:310694006567:web:f56fc19ed03b81bf8c2302" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let selectedSlots = [null, null, null, null], currentSessionId = localStorage.getItem('last_sid') || "", lastSnapshotData = [], middleQueue = [], nextCourtNumber = 1, currentHighlightedName = "";

        // --- ระบบหุบอ้า ---
        window.toggleSidebar = () => {
            const sidebar = document.getElementById('left-sidebar-container');
            const btn = document.getElementById('toggle-sidebar');
            sidebar.classList.toggle('collapsed');
            btn.innerText = sidebar.classList.contains('collapsed') ? "▶" : "◀";
        };

        // --- ระบบ Highlight ชื่อ ---
        window.highlightName = (name) => {
            if (!name || name === "-") return;
            // ถ้ากดชื่อเดิมซ้ำ ให้ยกเลิกไฮไลต์
            currentHighlightedName = (currentHighlightedName === name) ? "" : name;
            
            // ลบ Class เก่าออกให้หมด
            document.querySelectorAll('.name-tag').forEach(el => el.classList.remove('active-highlight'));
            
            // ใส่ Class ใหม่ในทุกจุดที่ชื่อตรงกัน
            if (currentHighlightedName !== "") {
                document.querySelectorAll('.name-tag').forEach(el => {
                    if (el.innerText.trim() === currentHighlightedName) {
                        el.classList.add('active-highlight');
                    }
                });
            }
        };

        window.onload = () => {
            if (currentSessionId) {
                generateQR(currentSessionId); listenToAttendance(); listenToMatches();
                const sq = localStorage.getItem(`queue_${currentSessionId}`);
                if(sq) { middleQueue = JSON.parse(sq); renderMiddleQueue(); }
                loadCourtsFromLocal();
            }
            new Sortable(document.getElementById('main-grid'), { animation: 150, handle: '.court-header', onEnd: saveCourtsToLocal });
        };

        // --- Firebase Listeners ---
        function listenToAttendance() {
            onSnapshot(query(collection(db, `sessions/${currentSessionId}/attendance`), orderBy("last_match_end", "asc")), snap => {
                lastSnapshotData = snap.docs.map(d => ({ id: d.id, data: d.data() })); renderFIFO();
            });
        }

        function listenToMatches() {
            onSnapshot(query(collection(db, `sessions/${currentSessionId}/matches`), orderBy("timestamp", "desc")), snap => {
                const list = document.getElementById('match-history-list'); list.innerHTML = "";
                snap.docs.forEach((doc, i) => {
                    const m = doc.data(); 
                    const time = new Date(m.timestamp).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
                    const row = `<tr>
                        <td width="40"><b>#${snap.size-i}</b></td>
                        <td width="80">สนาม ${m.court}</td>
                        <td>
                            <span class="name-tag" style="background:var(--team-a)" onclick="highlightName('${m.teamA[0]}')">${m.teamA[0]}</span>, 
                            <span class="name-tag" style="background:var(--team-a)" onclick="highlightName('${m.teamA[1]}')">${m.teamA[1]}</span>
                            <b style="margin:0 5px">VS</b>
                            <span class="name-tag" style="background:var(--team-b)" onclick="highlightName('${m.teamB[0]}')">${m.teamB[0]}</span>, 
                            <span class="name-tag" style="background:var(--team-b)" onclick="highlightName('${m.teamB[1]}')">${m.teamB[1]}</span>
                        </td>
                        <td align="right" style="color:#999">${time}</td>
                    </tr>`;
                    list.insertAdjacentHTML('beforeend', row);
                });
                // สั่งให้ไฮไลต์ทำงานซ้ำหลังจาก Render ตารางใหม่
                if (currentHighlightedName) highlightName(currentHighlightedName);
            });
        }

        // --- ส่วน Logic อื่นๆ (เหมือนเดิมแต่ปรับปรุงการเรียก Highlight) ---
        window.renderFIFO = () => {
            const list = document.getElementById('checkin-list'); list.innerHTML = "";
            const midIds = new Set(middleQueue.flatMap(q => q.slots.filter(s => s).map(s => s.id)));
            lastSnapshotData.forEach(p => {
                if (!p.data.is_playing && !midIds.has(p.id)) {
                    const selIdx = selectedSlots.findIndex(s => s?.id === p.id);
                    const div = document.createElement('div');
                    div.className = "player-item " + (selIdx > -1 ? (selIdx < 2 ? 'sel-a' : 'sel-b') : '');
                    div.innerHTML = `<span class="skill-dot lvl-${p.data.skill_level}"></span> <span>${p.data.display_name} (${p.data.games_played||0})</span>`;
                    div.onclick = () => {
                        highlightName(p.data.display_name); // คลิกชื่อในคิวรอ เพื่อดูประวัติ
                        const idx = selectedSlots.findIndex(s => s?.id === p.id);
                        if(idx > -1) selectedSlots[idx] = null;
                        else { const f = selectedSlots.indexOf(null); if(f > -1) selectedSlots[f] = {id: p.id, name: p.data.display_name}; }
                        renderFIFO(); updateBtn();
                    };
                    list.appendChild(div);
                }
            });
            updateBtn();
        };

        // --- ยก Logic เดิมมาใส่ให้ครบถ้วน ---
        window.createSession = async () => { if(currentSessionId && !confirm("เริ่มก๊วนใหม่?")) return; const sid = "GS" + Date.now().toString().slice(-6); await setDoc(doc(db, "sessions", sid), { status: "active", created_at: Date.now() }); localStorage.setItem('last_sid', sid); location.reload(); };
        window.addNewCourt = () => { document.getElementById('empty-msg').style.display = 'none'; const id = `c-${Date.now()}`; renderCourtUI({ id, courtNum: nextCourtNumber++, status: "🟢 ว่าง", shuttle: "1", playing: false, slots: [{html:"ว่าง",occupied:false},{html:"ว่าง",occupied:false},{html:"ว่าง",occupied:false},{html:"ว่าง",occupied:false}] }); saveCourtsToLocal(); };
        window.changeShuttle = (id, v) => { const el = document.getElementById(`shuttle-${id}`); let n = parseInt(el.innerText)+v; if(n>0) { el.innerText=n; saveCourtsToLocal(); } };
        window.updateBtn = () => { document.getElementById('confirmBtn').innerText = `ลงสนาม (${selectedSlots.filter(s=>s).length})`; };
        const saveQueue = () => localStorage.setItem(`queue_${currentSessionId}`, JSON.stringify(middleQueue));

        window.terminateSession = async () => {
            const baseRate = 150; let totalShuttle = 0, totalExtra = 0, totalDiscount = 0;
            lastSnapshotData.forEach(p => { totalShuttle += (p.data.shuttle_used || 0); totalExtra += (p.data.extra_cost || 0); totalDiscount += (p.data.discount || 0); });
            const netTotal = (lastSnapshotData.length * baseRate) + totalExtra - totalDiscount;
            const report = `📊 สรุปก๊วนวันนี้\n👥 สมาชิก: ${lastSnapshotData.length} คน\n🏸 ลูกแบด: ${totalShuttle} ลูก\n💵 ยอดสุทธิ: ${netTotal.toLocaleString()} บาท`;
            if (confirm(report + "\n\nCopy & จบก๊วน?")) {
                await navigator.clipboard.writeText(report); await updateDoc(doc(db, "sessions", currentSessionId), { status: "closed" });
                localStorage.clear(); location.reload();
            }
        };

        window.startMatch = (id) => { const card = document.getElementById(id); if(card.querySelectorAll('.occupied').length === 0) return; card.classList.add('playing'); document.getElementById(`status-${id}`).innerText = "🎾 กำลังแข่ง"; document.getElementById(`btn-start-${id}`).style.display = "none"; document.getElementById(`btn-end-${id}`).style.display = "block"; saveCourtsToLocal(); };
        
        window.handleEndGame = async (id) => {
            const card = document.getElementById(id); const players = Array.from(card.querySelectorAll('.slot')).map(s => s.innerText.replace('ว่าง','').trim() || "-");
            const batch = writeBatch(db); const mRef = doc(collection(db, `sessions/${currentSessionId}/matches`));
            batch.set(mRef, { court: card.querySelector('select').value, teamA: [players[0], players[1]], teamB: [players[2], players[3]], timestamp: Date.now() });
            const sUsed = parseInt(document.getElementById(`shuttle-${id}`).innerText);
            card.querySelectorAll('.occupied').forEach(s => { batch.update(doc(db, `sessions/${currentSessionId}/attendance`, s.dataset.uid), { is_playing: false, last_match_end: Date.now(), games_played: increment(1), shuttle_used: increment(sUsed) }); s.innerText = "ว่าง"; s.classList.remove('occupied'); delete s.dataset.uid; });
            await batch.commit(); card.classList.remove('playing'); document.getElementById(`status-${id}`).innerText = "🟢 ว่าง"; document.getElementById(`shuttle-${id}`).innerText = "1"; document.getElementById(`btn-start-${id}`).style.display = "block"; document.getElementById(`btn-end-${id}`).style.display = "none"; saveCourtsToLocal(); renderFIFO(); checkAndFillEmptyCourts();
        };

        window.assignSlot = async (el, courtId) => {
            const sIdx = selectedSlots.findIndex(p => p !== null); const oldUid = el.dataset.uid; const batch = writeBatch(db);
            if (sIdx === -1 && oldUid) { if(confirm("เอาออก?")) { batch.update(doc(db, `sessions/${currentSessionId}/attendance`, oldUid), { is_playing: false }); await batch.commit(); el.innerText = "ว่าง"; el.classList.remove('occupied'); delete el.dataset.uid; saveCourtsToLocal(); renderFIFO(); } return; }
            if (sIdx !== -1) {
                if (oldUid) batch.update(doc(db, `sessions/${currentSessionId}/attendance`, oldUid), { is_playing: false });
                batch.update(doc(db, `sessions/${currentSessionId}/attendance`, selectedSlots[sIdx].id), { is_playing: true }); await batch.commit();
                const p = lastSnapshotData.find(d => d.id === selectedSlots[sIdx].id); el.innerHTML = `<span class="skill-dot lvl-${p.data.skill_level}"></span> ${p.data.display_name}`; el.dataset.uid = p.id; el.classList.add('occupied');
                selectedSlots[sIdx] = null; saveCourtsToLocal(); renderFIFO();
            }
        };

        function renderCourtUI(c) {
            const opts = Array.from({length:10}, (_, i) => `<option value="${i+1}" ${i+1==c.courtNum?'selected':''}>สนาม ${i+1}</option>`).join('');
            const html = `<div class="court-card ${c.playing?'playing':''}" id="${c.id}">
                <div class="court-header" style="display:flex; justify-content:space-between; margin-bottom:10px;">
                    <select onchange="saveCourtsToLocal()">${opts}</select>
                    <button onclick="this.closest('.court-card').remove(); saveCourtsToLocal();" style="color:red; background:none;">ลบ</button>
                </div>
                <div id="status-${c.id}" style="font-size:0.8em; font-weight:bold; color:#666; margin-bottom:5px;">${c.status}</div>
                <div style="display:flex; gap:5px;">
                    <div style="flex:1; background:var(--team-a); padding:5px; border-radius:10px;">
                        <div class="slot ${c.slots[0].occupied?'occupied':''}" data-uid="${c.slots[0].uid||''}" onclick="assignSlot(this, '${c.id}')">${c.slots[0].html}</div>
                        <div class="slot ${c.slots[1].occupied?'occupied':''}" data-uid="${c.slots[1].uid||''}" onclick="assignSlot(this, '${c.id}')">${c.slots[1].html}</div>
                    </div>
                    <div style="flex:1; background:var(--team-b); padding:5px; border-radius:10px;">
                        <div class="slot ${c.slots[2].occupied?'occupied':''}" data-uid="${c.slots[2].uid||''}" onclick="assignSlot(this, '${c.id}')">${c.slots[2].html}</div>
                        <div class="slot ${c.slots[3].occupied?'occupied':''}" data-uid="${c.slots[3].uid||''}" onclick="assignSlot(this, '${c.id}')">${c.slots[3].html}</div>
                    </div>
                </div>
                <div style="text-align:center; margin:8px 0; font-size:0.9em;">🏸 <button onclick="changeShuttle('${c.id}',-1)">-</button> <b id="shuttle-${c.id}">${c.shuttle||1}</b> <button onclick="changeShuttle('${c.id}',1)">+</button></div>
                <button id="btn-start-${c.id}" class="btn-start" style="display:${c.playing?'none':'block'}" onclick="startMatch('${c.id}')">▶️ เริ่มเกม</button>
                <button id="btn-end-${c.id}" class="btn-end" style="display:${c.playing?'block':'none'}" onclick="handleEndGame('${c.id}')">⏹️ จบเกม</button>
            </div>`;
            document.getElementById('main-grid').insertAdjacentHTML('beforeend', html);
        }

        async function saveCourtsToLocal() { if(!currentSessionId) return; const courts = []; document.querySelectorAll('.court-card').forEach(card => { const slots = []; card.querySelectorAll('.slot').forEach(s => slots.push({ uid: s.dataset.uid || null, html: s.innerHTML, occupied: s.classList.contains('occupied') })); courts.push({ id: card.id, courtNum: card.querySelector('select').value, status: document.getElementById(`status-${card.id}`).innerText, playing: card.classList.contains('playing'), shuttle: document.getElementById(`shuttle-${card.id}`).innerText, slots }); }); localStorage.setItem(`courts_${currentSessionId}`, JSON.stringify(courts)); await updateDoc(doc(db, "sessions", currentSessionId), { live_courts: courts }); }
        function loadCourtsFromLocal() { const data = localStorage.getItem(`courts_${currentSessionId}`); if(!data) return; const courts = JSON.parse(data); if(courts.length > 0) document.getElementById('empty-msg').style.display = 'none'; courts.forEach(c => renderCourtUI(c)); nextCourtNumber = courts.length > 0 ? Math.max(...courts.map(c => parseInt(c.courtNum))) + 1 : 1; }
        
        function renderMiddleQueue() { const list = document.getElementById('queue-list'); list.innerHTML = ""; middleQueue.forEach((q, i) => { const div = document.createElement('div'); div.className = "player-item"; div.style.fontSize = "0.75em"; div.innerHTML = `Q${i+1}: ${q.slots[0]?.name||'-'}+${q.slots[1]?.name||'-'} vs ${q.slots[2]?.name||'-'}+${q.slots[3]?.name||'-'}`; div.onclick = () => { selectedSlots = [...q.slots]; middleQueue.splice(i, 1); saveQueue(); renderMiddleQueue(); renderFIFO(); }; list.appendChild(div); }); }
        document.getElementById('confirmBtn').onclick = () => { if(!selectedSlots.filter(s => s).length) return; middleQueue.push({slots: [...selectedSlots]}); selectedSlots = [null,null,null,null]; saveQueue(); renderFIFO(); renderMiddleQueue(); checkAndFillEmptyCourts(); };
        async function checkAndFillEmptyCourts() { const empty = Array.from(document.querySelectorAll('.court-card')).find(c => !c.classList.contains('playing') && c.querySelectorAll('.occupied').length === 0); if(empty && middleQueue.length > 0 && middleQueue[0].slots.filter(s=>s).length === 4) { const q = middleQueue.shift(); const batch = writeBatch(db); const slots = empty.querySelectorAll('.slot'); q.slots.forEach((p, i) => { batch.update(doc(db, `sessions/${currentSessionId}/attendance`, p.id), { is_playing: true }); const pd = lastSnapshotData.find(d => d.id === p.id); slots[i].innerHTML = `<span class="skill-dot lvl-${pd.data.skill_level}"></span> ${p.name}`; slots[i].dataset.uid = p.id; slots[i].classList.add('occupied'); }); await batch.commit(); saveQueue(); renderMiddleQueue(); renderFIFO(); saveCourtsToLocal(); } }
        window.importBulkPlayers = async () => { const input = document.getElementById('bulk-paste-input'); const lines = input.value.trim().split('\n').map(l => l.replace(/^\d+\.\s*/, '').trim()).filter(n => n); if(!lines.length) return; const batch = writeBatch(db); const now = Date.now(); lines.forEach((name, i) => { const id = "m_" + now + i; batch.set(doc(db, `sessions/${currentSessionId}/attendance`, id), { id, display_name: name, skill_level: "yellow", is_playing: false, games_played: 0, shuttle_used: 0, last_match_end: now + i, checkin_at: now }); }); await batch.commit(); input.value = ""; };
        window.generateQR = (id) => { document.getElementById("qrcode").innerHTML = ""; new QRCode(document.getElementById("qrcode"), { text: `https://early-bird-queue.vercel.app/index.html?session=${id}`, width: 40, height: 40 }); };
        window.expandQR = () => { document.getElementById('qr-big').innerHTML = ""; new QRCode(document.getElementById('qr-big'), { text: `https://early-bird-queue.vercel.app/profile.html?session=${currentSessionId}`, width: 200, height: 200 }); document.getElementById('sid-text').innerText = "Session ID: " + currentSessionId; document.getElementById('qr-overlay').style.display = 'flex'; };
    </script>
</body>
</html>
