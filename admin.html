<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; display: flex; height: 100vh; font-family: 'Kanit', sans-serif; overflow: hidden; }
        
        /* Layout หลัก */
        .sidebar-wrapper { display: flex; flex-direction: column; height: 100vh; background: #eee; border-right: 1px solid #ccc; }
        
        /* ส่วนของแต่ละคิว */
        .queue-section { 
            display: flex; flex-direction: column; background: white; 
            transition: width 0.3s ease; width: 300px; position: relative; border-bottom: 2px solid #eee;
        }
        /* เมื่อหุบ จะเหลือความกว้างแค่ 40px สำหรับปุ่ม */
        .queue-section.collapsed { width: 45px; flex: 0 0 45px !important; }
        .queue-section.collapsed .queue-content { display: none; }

        /* ปุ่ม หุบ-อ้า */
        .toggle-btn {
            position: absolute; right: 0; top: 0; width: 45px; height: 45px;
            background: #333; color: white; border: none; cursor: pointer; z-index: 10;
        }

        .queue-header { padding: 12px; font-weight: bold; background: #f8f9fa; border-bottom: 1px solid #eee; }
        .queue-content { flex: 1; overflow-y: auto; padding: 10px; }

        .panel-main { flex: 1; padding: 20px; overflow-y: auto; background: #fdfcf0; }

        /* Highlight Style */
        .name-tag { cursor: pointer; padding: 2px 5px; border-radius: 4px; }
        .active-hi { background: #ffeb3b !important; box-shadow: 0 0 5px orange; font-weight: bold; }
        
        /* อื่นๆ */
        .player-item { padding: 8px; margin-bottom: 5px; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; }
        .match-table { width: 100%; border-collapse: collapse; background: white; font-size: 0.9em; }
        .match-table td { padding: 10px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <div class="sidebar-wrapper">
        <div id="sec-waiting" class="queue-section" style="flex: 2;">
            <button class="toggle-btn" onclick="toggleSec('sec-waiting')">◀</button>
            <div class="queue-content">
                <div class="queue-header">👥 คิวรอ</div>
                <div id="checkin-list">
                    </div>
                <button id="confirmBtn" style="width:100%; margin-top:10px; padding:10px; background:#007bff; color:white; border:none; border-radius:5px;">ลงสนาม (0)</button>
            </div>
        </div>

        <div id="sec-middle" class="queue-section" style="flex: 1.5;">
            <button class="toggle-btn" onclick="toggleSec('sec-middle')">◀</button>
            <div class="queue-content">
                <div class="queue-header">⏳ คิวกลาง</div>
                <div id="queue-list">
                    </div>
            </div>
        </div>
    </div>

    <div class="panel-main">
        <div style="margin-bottom:20px;">
            <button onclick="addNewCourt()" style="padding:10px 20px; background:#28a745; color:white; border:none; border-radius:5px;">+ เพิ่มสนาม</button>
        </div>
        
        <div id="main-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px;">
            </div>

        <div style="margin-top:40px;">
            <h3>📜 ประวัติการแข่ง (คลิกชื่อเพื่อไฮไลต์)</h3>
            <table class="match-table">
                <tbody id="match-history-list">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // ฟังก์ชัน หุบ-อ้า แยกอิสระ
        function toggleSec(id) {
            const el = document.getElementById(id);
            const btn = el.querySelector('.toggle-btn');
            el.classList.toggle('collapsed');
            btn.innerText = el.classList.contains('collapsed') ? "▶" : "◀";
        }

        // ฟังก์ชัน ไฮไลต์ชื่อในประวัติ
        let currentHi = "";
        function highlightName(name) {
            if (!name || name === "-") return;
            currentHi = (currentHi === name) ? "" : name;
            
            document.querySelectorAll('.name-tag').forEach(tag => {
                tag.classList.remove('active-hi');
                if (currentHi !== "" && tag.innerText.trim() === currentHi) {
                    tag.classList.add('active-hi');
                }
            });
        }

        // --- หมายเหตุ: ส่วนของ Firebase Logic ให้ใช้ชุดเดิมที่คุณมีได้เลยครับ ---
        // แค่เปลี่ยนจุด Render ให้ลงที่ id="checkin-list", id="queue-list" และ id="match-history-list"
    </script>
</body>
</html>
