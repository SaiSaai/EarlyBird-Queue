<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - จัดการก๊วน</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>จัดการก๊วนแบดมินตัน</h1>
        <nav>
            <a href="member.html">สมาชิก</a>
            <a href="queue.html">คิว</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>สร้างรอบการเล่น</h2>
            <form id="sessionForm">
                <label for="sessionDate">วันที่:</label>
                <input type="date" id="sessionDate" required>
                
                <label for="sessionTime">เวลา:</label>
                <input type="time" id="sessionTime" required>
                
                <label for="playMode">โหมดการเล่น:</label>
                <select id="playMode">
                    <option value="single">เดี่ยว</option>
                    <option value="double">คู่</option>
                </select>
                
                <button type="submit">สร้างรอบการเล่น</button>
            </form>
        </section>
        
        <section>
            <h2>การจัดการคิว</h2>
            <div id="queueManagement">
                <p>แสดงคิวสมาชิกและระดับสีที่รออยู่</p>
                <!-- คลาสสำหรับจัดการคิว -->
                <div class="court-card">สมาชิก 1 - 🟢</div>
                <div class="court-card">สมาชิก 2 - 🔴</div>
                <div class="court-card">สมาชิก 3 - 🟡</div>
                <!-- เพิ่มสมาชิกตามที่ต้องการ -->
            </div>
        </section>
    </main>
</body>
</html>
