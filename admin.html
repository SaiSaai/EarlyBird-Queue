<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badminton Admin - Scrollable Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary-bg: #fdfcf0; --team-a: #a2d2ff; --team-b: #b9fbc0; --accent-red: #ffcfd2; --playing-bg: #f0fff4; 
            --v-yellow: #FFD700; --v-green: #00C853; --v-blue: #2962FF; --v-red: #D50000; --v-black: #000000;
        }
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        
        /* Fixed Layout */
        body { 
            background-color: var(--primary-bg); 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; /* ห้าม body เลื่อนเอง ให้เลื่อนข้างในแทน */
        }
        
        /* Main Panel - เพิ่ม Scroll Bar */
        .panel-main { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            height: 100%;
            -webkit-overflow-scrolling: touch; /* สำหรับ iOS scroll ลื่นๆ */
        }
        
        /* Sidebar Right - คงเดิม */
        .sidebar-right { width: 320px; display: flex; flex-direction: column; background: #fff; border-left: 2px solid #eee; transition: 0.3s; z-index: 100; flex-shrink: 0; position: relative; }
        .sidebar-right.collapsed { width: 50px; cursor: pointer; background: #eee; }
        .sidebar-right.collapsed .queue-container { display: none; }
        .sidebar-label { display: none; writing-mode: vertical-rl; text-orientation: mixed; font-weight: bold; color: #888; margin: 25px auto; font-size: 1.1em; letter-spacing: 2px; }
        .sidebar-right.collapsed .sidebar-label { display: block; }

        .queue-container { display: flex; flex-direction: column; height: 100%; padding: 15px; gap: 10px; overflow: hidden; }
        .list-box { flex: 1; border: 1px solid #ddd; border-radius: 12px; overflow-y: auto; padding: 10px; background: #fafafa; }
        #queue-list { flex: 0.4; background: #fffdf5; border-color: #ffeeba; }

        /* Court UI & Grid */
        .courts-wrapper { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); 
            gap: 20px; 
            padding-bottom: 50px; /* เพิ่มพื้นที่ท้ายกันโดนบัง */
        }
        .court-card { background: white; border-radius: 20px; padding: 15px; box-shadow: 0 8px 15px rgba(0,0,0,0.05); border-top: 10px solid #ccc; position: relative; }
        .court-card.playing { border-top-color: #4caf50; background: var(--playing-bg); }
        .court-header { cursor: grab; background: #f8f9fa; margin: -15px -15px 10px -15px; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-radius: 15px 15px 0 0; }
        
        .slot { background: white; padding: 10px; border-radius: 8px; font-size: 0.85em; font-weight: bold; border: 1px dashed #ccc; cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: 42px; margin-bottom: 5px; }
        .slot.occupied { border-style: solid; border-color: rgba(0,0,0,0.1); }

        .game-count { color: #888; font-weight: normal; font-size: 0.85em; margin-left: 5px; }
        .skill-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.1); flex-shrink: 0; }
        .lvl-yellow { background: var(--v-yellow); } .lvl-green { background: var(--v-green); } .lvl-blue { background: var(--v-blue); } .lvl-red { background: var(--v-red); } .lvl-black { background: var(--v-black); }
        
        .player-item { padding: 10px; margin-bottom: 8px; border-radius: 10px; border: 2px solid #eee; background: white; cursor: pointer; font-weight: bold; display: flex; align-items: center; font-size: 0.9em; }
        .sel-a { border-color: var(--team-a); background: #e7f3ff; }
        .sel-b { border-color: var(--team-b); background: #f0fff4; }

        .shuttle-counter { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 10px 0; background: #f9f9f9; padding: 8px; border-radius: 12px; }
        button { cursor: pointer; border: none; font-family: 'Kanit'; font-weight: 600; border-radius: 10px; }
        .btn-start { background: #4caf50; color: white; width: 100%; padding: 12px; margin-top: 8px; }
        .btn-end { background: var(--accent-red); color: #d00; width: 100%; padding: 12px; margin-top: 8px; display: none; }

        #qr-overlay, #shuttle-confirm { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 9999; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 25px; text-align: center; width: 90%; max-width: 400px; }
    </style>
</head>
<body onload="checkMobile()">

    <div class="panel-main" id="scroll-area">
        <div style="display:flex; gap:12px; margin-bottom:20px; align-items: center; flex-wrap: wrap;">
            <button onclick="createSession()" style="background: #4caf50; color: white; padding: 12px 25px;">🚀 เปิดก๊วนใหม่</button>
            <button onclick="addNewCourt()" style="background: #2196f3; color: white; padding: 12px 25px;">➕ เพิ่มสนาม</button>
            <button onclick="goToMembers()" style="background: #673ab7; color: white; padding: 12px 25px;">👥 จัดการสมาชิก</button>
            <div id="qrcode" onclick="expandQR()" style="margin-left: auto; cursor: zoom-in; background: white; padding: 5px; border-radius: 8px; border: 1px solid #ddd;"></div>
        </div>
        <div id="empty-msg" style="text-align:center; color:#999; margin-top:100px;">ยังไม่มีสนาม กด "เพิ่มสนาม"</div>
        <div class="courts-wrapper" id="main-grid"></div>
    </div>

    <div class="sidebar-right" id="sidebar" onclick="expandSidebar()">
        <div class="sidebar-label">👥 คิวทั้งหมด (คลิกเพื่อขยาย)</div>
        <div class="queue-container">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="margin:0">⏳ คิวกลาง</h3>
                <span onclick="event.stopPropagation(); toggleSidebar();" style="cursor:pointer; font-size:1.5em; color:#999;">×</span>
            </div>
            <div id="queue-list" class="list-box"></div>

            <h3 style="margin:10px 0 5px 0">👥 คิวรอ</h3>
            <div id="checkin-list" class="list-box"></div>
            
            <button id="confirmBtn" style="background:#007bff; color:white; width:100%; padding:15px; font-size:1.1em; margin-top:10px;">ยืนยันลงสนาม (0)</button>
            <button id="mockBtn" style="background:#f0f0f0; color:#666; width:100%; padding:8px; font-size:0.8em; border:1px dashed #ccc; margin-top:5px;">🤖 สุ่มคน 20 คน</button>
        </div>
    </div>

    <div id="qr-overlay" onclick="this.style.display='none'"><div class="modal-content"><h2>Scan to Join!</h2><div id="qr-big" style="display:flex; justify-content:center; margin:20px 0;"></div></div></div>
    <div id="shuttle-confirm"><div class="modal-content"><h2 style="color:red;">⚠️ ลืมใส่ลูกแบด?</h2><p>บันทึกแบบ 0 ลูกใช่หรือไม่?</p><div style="display:flex; gap:10px; margin-top:20px;"><button id="confirm-zero-btn" style="flex:1; background:#eee; padding:15px;">ใช่</button><button onclick="document.getElementById('shuttle-confirm').style.display='none'" style="flex:1; background:#007bff; color:white; padding:15px;">ไม่</button></div></div></div>
    <div id="skillPicker" style="display:none; position:fixed; background:white; border-radius:15px; box-shadow:0 10px 25px rgba(0,0,0,0.2); z-index:10001; padding:8px; min-width:170px;"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, addDoc, onSnapshot, query, orderBy, updateDoc, serverTimestamp, writeBatch, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDQbnx83sbs1sO4xsuLUV50uxbBinr2VtY", authDomain: "earlybird-queue.firebaseapp.com", projectId: "earlybird-queue", storageBucket: "earlybird-queue.firebasestorage.app", messagingSenderId: "310694006567", appId: "1:310694006567:web:f56fc19ed03b81bf8c2302" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let selectedSlots = [null, null, null, null], currentSessionId = "", lastSnapshotData = [], middleQueue = [], nextCourtNumber = 1, currentEditingPlayerId = null;

        // Sidebar Control
        window.toggleSidebar = () => document.getElementById('sidebar').classList.toggle('collapsed');
        window.expandSidebar = () => { if(document.getElementById('sidebar').classList.contains('collapsed')) document.getElementById('sidebar').classList.remove('collapsed'); };
        window.checkMobile = () => { if(window.innerWidth < 1024) toggleSidebar(); };

        // Court Setup
        window.addNewCourt = () => {
            document.getElementById('empty-msg').style.display = 'none';
            const id = `court-${Date.now()}`;
            const num = nextCourtNumber++;
            const opts = Array.from({length:20}, (_, i) => `<option value="${i+1}" ${i+1==num?'selected':''}>สนาม ${i+1}</option>`).join('');
            document.getElementById('main-grid').insertAdjacentHTML('beforeend', `
                <div class="court-card" id="${id}">
                    <div class="court-header">
                        <select style="border:none; background:none; font-weight:bold; color:#2196f3; font-size:1.1em;">${opts}</select>
                        <button onclick="deleteCourt(this)" style="color:red; background:none;">🗑️ ลบ</button>
                    </div>
                    <div style="font-size:0.85em; margin-bottom:10px; font-weight:bold; color:#666;"><span id="status-${id}">🟢 ว่าง</span></div>
                    <div style="display:flex; gap:10px;">
                        <div style="flex:1; background:var(--team-a); padding:8px; border-radius:15px;"><div class="slot" onclick="assignSlot(this, '${id}')">ว่าง</div><div class="slot" onclick="assignSlot(this, '${id}')">ว่าง</div></div>
                        <div style="flex:1; background:var(--team-b); padding:8px; border-radius:15px;"><div class="slot" onclick="assignSlot(this, '${id}')">ว่าง</div><div class="slot" onclick="assignSlot(this, '${id}')">ว่าง</div></div>
                    </div>
                    <div class="shuttle-counter"><span>🏸:</span><button onclick="changeShuttle('${id}', -1)">-</button><b id="shuttle-${id}">1</b><button onclick="changeShuttle('${id}', 1)">+</button></div>
                    <button id="btn-start-${id}" class="btn-start" onclick="startMatch('${id}')">▶️ เริ่มเกม</button>
                    <button id="btn-end-${id}" class="btn-end" onclick="handleEndGame('${id}')">⏹️ จบเกม</button>
                </div>`);
            checkAndFillEmptyCourts();
        };

        window.deleteCourt = (btn) => {
            const card = btn.closest('.court-card');
            if (card.querySelectorAll('.slot.occupied').length > 0) return alert("❌ ลบไม่ได้! ยังมีคนอยู่ในสนาม");
            if (confirm("ลบสนาม?")) { card.remove(); if(document.querySelectorAll('.court-card').length === 0) document.getElementById('empty-msg').style.display = 'block'; }
        };

        // Logic จบเกม & นับเกม
        async function finalizeEndMatch(id) {
            const card = document.getElementById(id);
            const occupied = card.querySelectorAll('.occupied');
            const batch = writeBatch(db);
            occupied.forEach(s => {
                const uid = s.dataset.uid;
                batch.update(doc(db, `sessions/${currentSessionId}/attendance`, uid), { 
                    is_playing: false, 
                    last_match_end: Date.now(),
                    games_played: increment(1) 
                });
                s.innerText="ว่าง"; s.classList.remove('occupied'); delete s.dataset.uid;
            });
            await batch.commit();
            card.classList.remove('playing');
            document.getElementById(`status-${id}`).innerText = "🟢 ว่าง";
            document.getElementById(`shuttle-${id}`).innerText = "1";
            document.getElementById(`btn-start-${id}`).style.display = "block";
            document.getElementById(`btn-end-${id}`).style.display = "none";
            renderFIFO(); checkAndFillEmptyCourts();
        }

        // Initialize Session & Sortable
        window.createSession = async () => {
            const ref = await addDoc(collection(db, "sessions"), { created_at: serverTimestamp() });
            currentSessionId = ref.id;
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: `https://early-bird-queue.vercel.app/index.html?session=${currentSessionId}`, width: 50, height: 50 });
            listenToAttendance();
            
            // ปรับปรุง Sortable ให้เลื่อนจอได้ง่ายขึ้น
            new Sortable(document.getElementById('main-grid'), { 
                animation: 150, 
                handle: '.court-header',
                fallbackTolerance: 10, // ป้องกันการขยับนิดเดียวแล้วกลายเป็น Drag
                scroll: true, // อนุญาตให้ scroll ขณะลาก
                bubbleScroll: true
            });
        };

        // ... (ส่วนที่เหลือของฟังก์ชัน assignSlot, renderFIFO, renderMiddleQueue, ฯลฯ เหมือนเดิม) ...

        function renderFIFO() {
            const list = document.getElementById('checkin-list'); list.innerHTML = "";
            const midIds = new Set(middleQueue.flatMap(q => q.slots.filter(s => s).map(s => s.id)));
            lastSnapshotData.forEach(player => {
                const { id, data } = player;
                if (!data.is_playing && !midIds.has(id)) {
                    const idx = selectedSlots.findIndex(p => p?.id === id);
                    const games = data.games_played || 0;
                    const div = document.createElement('div');
                    div.className = "player-item " + (idx > -1 ? (idx < 2 ? 'sel-a' : 'sel-b') : '');
                    div.innerHTML = `<span class="skill-dot lvl-${data.skill_level || 'yellow'}"></span> <span style="margin-left:10px">${data.display_name}</span><span class="game-count">(${games})</span>`;
                    div.onclick = () => {
                        const sIdx = selectedSlots.findIndex(p => p?.id === id);
                        if(sIdx > -1) selectedSlots[sIdx] = null;
                        else { const f = selectedSlots.indexOf(null); if(f > -1) selectedSlots[f] = {id, name: data.display_name}; }
                        renderFIFO(); updateBtn();
                    };
                    div.oncontextmenu = (e) => { e.preventDefault(); showSkillPicker(id, e.pageX, e.pageY); };
                    list.appendChild(div);
                }
            });
            updateBtn();
        }

        window.assignSlot = async (el, courtId) => {
            const sIdx = selectedSlots.findIndex(p => p !== null);
            if (sIdx === -1 && el.dataset.uid) {
                if(confirm("เอาคนนี้ออก?")) {
                    await updateDoc(doc(db, `sessions/${currentSessionId}/attendance`, el.dataset.uid), { is_playing: false });
                    el.innerText = "ว่าง"; el.classList.remove('occupied'); delete el.dataset.uid;
                    renderFIFO();
                } return;
            }
            if (sIdx !== -1) {
                const p = selectedSlots[sIdx];
                await updateDoc(doc(db, `sessions/${currentSessionId}/attendance`, p.id), { is_playing: true });
                const pData = lastSnapshotData.find(d => d.id === p.id);
                el.innerHTML = `<span class="skill-dot lvl-${pData?.data?.skill_level || 'yellow'}"></span> ${p.name}`;
                el.dataset.uid = p.id; el.classList.add('occupied');
                selectedSlots[sIdx] = null; renderFIFO();
            }
        };

        function renderMiddleQueue() {
            const list = document.getElementById('queue-list'); list.innerHTML = "";
            middleQueue.forEach((q, i) => {
                const div = document.createElement('div'); div.className = "player-item"; div.style.flexDirection = "column";
                div.innerHTML = `<div style="font-size:0.7em; color:#999;">คิวที่ ${i+1}</div>
                    <div style="display:flex; gap:5px; width:100%; margin-top:5px;">
                        <div style="flex:1; background:var(--team-a); padding:5px; border-radius:5px; font-size:0.75em; text-align:center;">${q.slots[0]?.name || '-'}<br>${q.slots[1]?.name || '-'}</div>
                        <div style="flex:1; background:var(--team-b); padding:5px; border-radius:5px; font-size:0.75em; text-align:center;">${q.slots[2]?.name || '-'}<br>${q.slots[3]?.name || '-'}</div>
                    </div>`;
                div.onclick = () => { selectedSlots = [...q.slots]; document.getElementById('confirmBtn').dataset.editIndex = i; middleQueue.splice(i, 1); renderMiddleQueue(); renderFIFO(); };
                list.appendChild(div);
            });
        }

        document.getElementById('confirmBtn').onclick = async () => {
            const ps = selectedSlots.filter(p => p); if(!ps.length) return;
            const btn = document.getElementById('confirmBtn');
            if(btn.dataset.editIndex) { middleQueue.splice(btn.dataset.editIndex, 0, {slots: [...selectedSlots]}); delete btn.dataset.editIndex; }
            else middleQueue.push({slots: [...selectedSlots]});
            selectedSlots = [null,null,null,null]; renderFIFO(); renderMiddleQueue(); checkAndFillEmptyCourts();
        };

        async function checkAndFillEmptyCourts() {
            const empty = Array.from(document.querySelectorAll('.court-card')).find(c => !c.classList.contains('playing') && c.querySelectorAll('.occupied').length === 0);
            if(empty && middleQueue.length > 0 && middleQueue[0].slots.filter(s=>s).length === 4) {
                const group = middleQueue.shift();
                const batch = writeBatch(db);
                const slots = empty.querySelectorAll('.slot');
                group.slots.forEach((p, i) => {
                    batch.update(doc(db, `sessions/${currentSessionId}/attendance`, p.id), { is_playing: true });
                    const pData = lastSnapshotData.find(d => d.id === p.id);
                    slots[i].innerHTML = `<span class="skill-dot lvl-${pData?.data?.skill_level || 'yellow'}"></span> ${p.name}`;
                    slots[i].dataset.uid = p.id; slots[i].classList.add('occupied');
                });
                await batch.commit(); renderMiddleQueue(); renderFIFO();
            }
        }

        function listenToAttendance() {
            onSnapshot(query(collection(db, `sessions/${currentSessionId}/attendance`), orderBy("last_match_end", "asc")), snap => {
                lastSnapshotData = snap.docs.map(d => ({ id: d.id, data: d.data() })); renderFIFO();
            });
        }

        window.updateBtn = () => {
            const count = selectedSlots.filter(p => p).length;
            const btn = document.getElementById('confirmBtn');
            btn.innerText = btn.dataset.editIndex ? "💾 บันทึกแก้ไข" : `ยืนยันลงสนาม (${count})`;
        };

        window.showSkillPicker = (id, x, y) => {
            currentEditingPlayerId = id; const pk = document.getElementById('skillPicker'); pk.style.display = 'block';
            pk.style.left = Math.min(x, window.innerWidth-180)+'px'; pk.style.top = Math.min(y, window.innerHeight-250)+'px';
            pk.innerHTML = ['yellow','green','blue','red','black'].map(l => `<div style="padding:10px; cursor:pointer; font-weight:bold;" onclick="updateSkill('${l}')"><span class="skill-dot lvl-${l}"></span> ${l.toUpperCase()}</div>`).join('');
        };
        window.updateSkill = async (lvl) => { await updateDoc(doc(db, `sessions/${currentSessionId}/attendance`, currentEditingPlayerId), { skill_level: lvl }); document.getElementById('skillPicker').style.display='none'; };
        
        window.changeShuttle = (id, v) => { const el = document.getElementById(`shuttle-${id}`); let val = parseInt(el.innerText) + v; if(val >= 0) el.innerText = val; };
        window.startMatch = (id) => {
            const card = document.getElementById(id);
            if(card.querySelectorAll('.slot.occupied').length === 0) return alert("เลือกคนก่อน!");
            card.classList.add('playing');
            document.getElementById(`status-${id}`).innerText = "🎾 กำลังแข่ง";
            document.getElementById(`btn-start-${id}`).style.display = "none";
            document.getElementById(`btn-end-${id}`).style.display = "block";
        };
        window.handleEndGame = (id) => {
            const shuttle = parseInt(document.getElementById(`shuttle-${id}`).innerText);
            if (shuttle === 0) {
                document.getElementById('shuttle-confirm').style.display = 'flex';
                document.getElementById('confirm-zero-btn').onclick = () => { document.getElementById('shuttle-confirm').style.display = 'none'; finalizeEndMatch(id); };
            } else finalizeEndMatch(id);
        };
        window.expandQR = () => {
            if(!currentSessionId) return;
            document.getElementById('qr-big').innerHTML = "";
            new QRCode(document.getElementById('qr-big'), { text: `https://early-bird-queue.vercel.app/index.html?session=${currentSessionId}`, width: 250, height: 250 });
            document.getElementById('qr-overlay').style.display = 'flex';
        };
        document.getElementById('mockBtn').onclick = async () => {
            if(!currentSessionId) return alert("เปิดก๊วนก่อน!");
            const batch = writeBatch(db);
            const lvls = ['yellow','green','blue','red','black'];
            for (let i = 1; i <= 20; i++) {
                const uid = "mock_" + Date.now() + "_" + i;
                batch.set(doc(db, `sessions/${currentSessionId}/attendance`, uid), { display_name: "Player " + i, is_playing: false, last_match_end: Date.now() + (i * 100), skill_level: lvls[Math.floor(Math.random()*5)], games_played: 0 });
            }
            await batch.commit();
        };

        // เพิ่มฟังก์ชันนี้ใน <script> ของหน้า Admin
        window.goToMembers = () => {
            if(!currentSessionId) return alert("กรุณาเปิดก๊วนก่อน");
            window.location.href = `members.html?session=${currentSessionId}`;
        };
    </script>
</body>
</html>
