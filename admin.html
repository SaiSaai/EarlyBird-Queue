<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badminton Admin - Multi Highlight</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary-bg: #fdfcf0; --team-a: #a2d2ff; --team-b: #b9fbc0; --accent-red: #ffcfd2; --playing-bg: #f0fff4; 
            --v-yellow: #FFD700; --v-green: #00C853; --v-blue: #2962FF; --v-red: #D50000; --v-black: #000000;
        }
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        body { background-color: var(--primary-bg); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        #left-sidebar-container { width: 350px; height: 100vh; display: flex; flex-direction: column; background: #fff; border-right: 1px solid #eee; flex-shrink: 0; }
        .side-section { display: flex; flex-direction: column; border-bottom: 1px solid #eee; flex: 1; overflow: hidden; }
        .section-header { padding: 12px 15px; background: #f8f9fa; font-weight: bold; border-bottom: 1px solid #ddd; }
        .section-content { flex: 1; overflow-y: auto; padding: 10px; }

        /* --- Buttons & UI --- */
        button { cursor: pointer; border: none !important; border-radius: 10px; font-weight: 600; transition: 0.2s; }
        .player-item { padding: 10px; margin-bottom: 8px; border-radius: 10px; border: 2px solid #eee; background: white; cursor: pointer; display: flex; align-items: center; font-weight: bold; font-size: 0.9em; }
        .skill-dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; border: 1px solid rgba(0,0,0,0.05); }
        .lvl-yellow { background: var(--v-yellow); } .lvl-green { background: var(--v-green); } .lvl-blue { background: var(--v-blue); } .lvl-red { background: var(--v-red); } .lvl-black { background: var(--v-black); }
        
        /* สีที่คิวรอตอนกดเลือก */
        .sel-a { border-color: var(--team-a) !important; background: #e7f3ff !important; } 
        .sel-b { border-color: var(--team-b) !important; background: #f0fff4 !important; }

        /* --- ประวัติและการไฮไลต์ --- */
        .history-table { width: 100%; border-collapse: collapse; background: white; }
        .history-table td { padding: 10px; border-bottom: 1px solid #eee; font-size: 0.85em; }
        .team-pill { padding: 3px 8px; border-radius: 6px; font-weight: 600; transition: 0.3s; border: 2px solid transparent; }
        .pill-a { background: var(--team-a); }
        .pill-b { background: var(--team-b); }

        /* ไฮไลต์ในประวัติแยกตามทีมที่เลือก */
        .hi-history-a { border-color: #007bff !important; box-shadow: 0 0 8px rgba(0,123,255,0.5); transform: scale(1.05); display: inline-block; }
        .hi-history-b { border-color: #28a745 !important; box-shadow: 0 0 8px rgba(40,167,69,0.5); transform: scale(1.05); display: inline-block; }

        .panel-main { flex: 1; padding: 20px; overflow-y: auto; }
        .courts-wrapper { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .court-card { background: white; border-radius: 15px; padding: 12px; border-top: 8px solid #ccc; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .slot { background: white; padding: 8px; border-radius: 8px; font-size: 0.85em; border: 1px dashed #ccc; margin-bottom: 5px; cursor: pointer; min-height: 40px; display: flex; align-items: center; font-weight: bold; }
    </style>
</head>
<body>

    <div id="left-sidebar-container">
        <div class="side-section">
            <div class="section-header">👥 คิวรอ</div>
            <div class="section-content">
                <div id="checkin-list"></div>
                <button id="confirmBtn" style="width:100%; padding:12px; margin-top:10px; background:#007bff; color:white;">ยืนยันลงสนาม (0)</button>
            </div>
        </div>
        <div class="side-section" style="flex: 0.5;">
            <div class="section-header">⏳ คิวกลาง</div>
            <div class="section-content"><div id="queue-list"></div></div>
        </div>
    </div>

    <div class="panel-main">
        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <button onclick="createSession()" style="background:#4caf50; color:white; padding:10px 15px;">🚀 เปิดก๊วน</button>
            <button onclick="addNewCourt()" style="background:#2196f3; color:white; padding:10px 15px;">➕ เพิ่มสนาม</button>
            <div id="qrcode" style="margin-left:auto;"></div>
        </div>
        <div id="main-grid" class="courts-wrapper"></div>
        <div style="margin-top:40px;">
            <h3>📜 ประวัติการแข่ง</h3>
            <table class="history-table"><tbody id="match-history-list"></tbody></table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, query, orderBy, updateDoc, writeBatch, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDQbnx83sbs1sO4xsuLUV50uxbBinr2VtY", authDomain: "earlybird-queue.firebaseapp.com", projectId: "earlybird-queue", storageBucket: "earlybird-queue.firebasestorage.app", messagingSenderId: "310694006567", appId: "1:310694006567:web:f56fc19ed03b81bf8c2302" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let selectedSlots = [null, null, null, null], currentSessionId = localStorage.getItem('last_sid') || "", lastSnapshotData = [];

        window.onload = () => { if (currentSessionId) { listenToAttendance(); listenToMatches(); loadCourtsFromLocal(); } };

        function listenToAttendance() { 
            onSnapshot(query(collection(db, `sessions/${currentSessionId}/attendance`), orderBy("last_match_end", "asc")), snap => { 
                lastSnapshotData = snap.docs.map(d => ({ id: d.id, data: d.data() })); 
                renderFIFO(); 
            }); 
        }

        function listenToMatches() { 
            onSnapshot(query(collection(db, `sessions/${currentSessionId}/matches`), orderBy("timestamp", "desc")), snap => { 
                const list = document.getElementById('match-history-list'); 
                list.innerHTML = ""; 
                snap.docs.forEach((doc, i) => { 
                    const m = doc.data(); 
                    list.insertAdjacentHTML('beforeend', `
                        <tr>
                            <td width="30">#${snap.size-i}</td>
                            <td>
                                <span class="team-pill pill-a hist-name">${m.teamA[0]}</span> + <span class="team-pill pill-a hist-name">${m.teamA[1]}</span>
                                <b style="color:#ccc;"> VS </b>
                                <span class="team-pill pill-b hist-name">${m.teamB[0]}</span> + <span class="team-pill pill-b hist-name">${m.teamB[1]}</span>
                            </td>
                        </tr>`); 
                });
                updateHistoryHighlights(); // ไฮไลต์ซ้ำทุกครั้งที่ข้อมูลเปลี่ยน
            }); 
        }

        // --- Logic ไฮไลต์ประวัติ (หลายคน) ---
        window.updateHistoryHighlights = () => {
            // ล้างไฮไลต์เก่าทั้งหมดในประวัติ
            document.querySelectorAll('.hist-name').forEach(el => el.classList.remove('hi-history-a', 'hi-history-b'));

            selectedSlots.forEach((slot, idx) => {
                if (!slot) return;
                const name = slot.name.trim();
                const highlightClass = idx < 2 ? 'hi-history-a' : 'hi-history-b'; // ทีม A (0,1) ทีม B (2,3)

                document.querySelectorAll('.hist-name').forEach(el => {
                    if (el.innerText.trim() === name) {
                        el.classList.add(highlightClass);
                    }
                });
            });
        };

        window.renderFIFO = () => {
            const list = document.getElementById('checkin-list'); list.innerHTML = "";
            lastSnapshotData.forEach(p => {
                if (!p.data.is_playing) {
                    const selIdx = selectedSlots.findIndex(s => s?.id === p.id);
                    const div = document.createElement('div');
                    
                    // แก้บัค: ใส่คลาสสีกลับเข้าไป (sel-a / sel-b)
                    div.className = "player-item " + (selIdx > -1 ? (selIdx < 2 ? 'sel-a' : 'sel-b') : '');
                    
                    div.innerHTML = `<span class="skill-dot lvl-${p.data.skill_level}"></span> <span>${p.data.display_name}</span>`;
                    div.onclick = () => {
                        const idx = selectedSlots.findIndex(s => s?.id === p.id);
                        if(idx > -1) selectedSlots[idx] = null;
                        else { 
                            const f = selectedSlots.indexOf(null); 
                            if(f > -1) selectedSlots[f] = {id: p.id, name: p.data.display_name}; 
                        }
                        renderFIFO(); 
                        updateBtn(); 
                        updateHistoryHighlights(); // สั่งไฮไลต์ประวัติทันทีที่กดเลือก
                    };
                    list.appendChild(div);
                }
            });
            updateBtn();
        };

        window.assignSlot = async (el, courtId) => {
            const sIdx = selectedSlots.findIndex(p => p !== null);
            if (sIdx !== -1) {
                const p = lastSnapshotData.find(d => d.id === selectedSlots[sIdx].id);
                el.innerHTML = `<span class="skill-dot lvl-${p.data.skill_level}"></span> ${p.data.display_name}`;
                el.dataset.uid = p.id; el.classList.add('occupied');
                await updateDoc(doc(db, `sessions/${currentSessionId}/attendance`, p.id), { is_playing: true });
                selectedSlots[sIdx] = null;
                renderFIFO(); updateBtn(); saveCourtsToLocal(); updateHistoryHighlights();
            }
        };

        window.handleEndGame = async (id) => {
            const card = document.getElementById(id); const slots = card.querySelectorAll('.slot.occupied');
            if (slots.length === 0) return;
            const names = Array.from(card.querySelectorAll('.slot')).map(s => s.innerText.trim() || "-");
            const batch = writeBatch(db);
            batch.set(doc(collection(db, `sessions/${currentSessionId}/matches`)), { court: card.querySelector('select').value, teamA: [names[0], names[1]], teamB: [names[2], names[3]], timestamp: Date.now() });
            slots.forEach(s => { batch.update(doc(db, `sessions/${currentSessionId}/attendance`, s.dataset.uid), { is_playing: false, last_match_end: Date.now(), games_played: increment(1) }); s.innerText = "ว่าง"; s.classList.remove('occupied'); delete s.dataset.uid; });
            await batch.commit(); saveCourtsToLocal(); renderFIFO();
        };

        // --- ส่วนเสริมอื่นๆ ---
        window.addNewCourt = () => { renderCourtUI({id:`c-${Date.now()}`,courtNum:1,slots:[{html:"ว่าง"},{html:"ว่าง"},{html:"ว่าง"},{html:"ว่าง"}]}); saveCourtsToLocal(); };
        function renderCourtUI(c) {
            const html = `<div class="court-card" id="${c.id}">
                <div style="display:flex; justify-content:space-between; margin-bottom:10px;"><select>${Array.from({length:10},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('')}</select><button onclick="this.closest('.court-card').remove();saveCourtsToLocal();" style="color:red; background:none;">❌</button></div>
                <div style="display:flex; gap:5px;">
                    <div style="flex:1; background:var(--team-a); padding:5px; border-radius:8px;">
                        <div class="slot" data-uid="${c.slots[0].uid||''}" onclick="assignSlot(this,'${c.id}')">${c.slots[0].html}</div>
                        <div class="slot" data-uid="${c.slots[1].uid||''}" onclick="assignSlot(this,'${c.id}')">${c.slots[1].html}</div>
                    </div>
                    <div style="flex:1; background:var(--team-b); padding:5px; border-radius:8px;">
                        <div class="slot" data-uid="${c.slots[2].uid||''}" onclick="assignSlot(this,'${c.id}')">${c.slots[2].html}</div>
                        <div class="slot" data-uid="${c.slots[3].uid||''}" onclick="assignSlot(this,'${c.id}')">${c.slots[3].html}</div>
                    </div>
                </div>
                <button style="width:100%; margin-top:10px; background:#ff4d4f; color:white; padding:8px;" onclick="handleEndGame('${c.id}')">⏹️ จบเกม</button>
            </div>`;
            document.getElementById('main-grid').insertAdjacentHTML('beforeend', html);
        }
        function saveCourtsToLocal() { const courts=[]; document.querySelectorAll('.court-card').forEach(card=>{ const slots=[]; card.querySelectorAll('.slot').forEach(s=>slots.push({uid:s.dataset.uid||null,html:s.innerHTML,occupied:s.classList.contains('occupied')})); courts.push({id:card.id,courtNum:card.querySelector('select').value,slots}); }); localStorage.setItem(`courts_${currentSessionId}`, JSON.stringify(courts)); }
        function loadCourtsFromLocal() { const data=localStorage.getItem(`courts_${currentSessionId}`); if(data) JSON.parse(data).forEach(c=>renderCourtUI(c)); }
        window.updateBtn = () => { document.getElementById('confirmBtn').innerText = `ยืนยันลงสนาม (${selectedSlots.filter(s=>s).length})`; };
        window.createSession = async () => { const sid="GS"+Date.now(); await setDoc(doc(db,"sessions",sid),{status:"active"}); localStorage.setItem('last_sid',sid); location.reload(); };
    </script>
</body>
</html>
