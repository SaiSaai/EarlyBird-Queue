<!DOCTYPE html>
<html>
<head>
    <title>Admin - จัดการคิวแบด</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary-bg: #fdfcf0;
            --card-bg: #ffffff;
            --accent-green: #b9fbc0;
            --accent-blue: #a2d2ff;
            --accent-red: #ffcfd2;
            --text-color: #555;
        }
        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* ฝั่งซ้าย: สนามและการควบคุม */
        .court-container { flex: 1; padding: 20px; overflow-y: auto; }
        
        /* ฝั่งขวา: รายชื่อคนรอ */
        .side-panel {
            width: 350px;
            background-color: var(--card-bg);
            border-left: 2px solid #eee;
            padding: 20px;
            box-shadow: -2px 0 10px rgba(0,0,0,0.05);
            overflow-y: auto;
        }

        /* ตารางสนาม */
        .courts-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .court-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border-top: 8px solid var(--accent-green);
            text-align: center;
        }
        .court-players {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
            min-height: 100px;
        }
        .slot {
            background: #f8f9fa;
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 15px 5px;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
        }
        .slot.filled {
            background: var(--accent-blue);
            border: none;
            font-weight: bold;
        }

        /* รายชื่อคนรอ */
        .player-tag {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 12px;
            background: var(--accent-blue);
            font-weight: bold;
        }

        #qrcode img { margin: 0 auto; border: 5px solid white; border-radius: 10px; }
        button { cursor: pointer; border: none; font-family: 'Kanit'; }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="court-container">
        <h1>🏸 ระบบจัดการคิว (Admin)</h1>
        
        <div style="margin-bottom: 20px;">
            <button id="startSessionBtn" style="padding: 12px 24px; border-radius: 10px; background: var(--accent-green); font-weight: bold;">
                + เปิดรอบก๊วนใหม่
            </button>
            <button id="mockUserBtn" style="padding: 12px 24px; border-radius: 10px; background: #eee; margin-left: 10px; font-weight: bold;">
                🤖 สุ่มคนจำลอง 15 คน
            </button>
        </div>
        
        <div id="session-qr-area" style="display:none; margin: 20px 0; background: white; padding: 20px; border-radius: 15px; max-width: 250px; text-align: center;">
            <div id="qrcode"></div>
            <p id="session-id-text" style="font-size: 0.7em; color: #888; margin-top:10px;"></p>
        </div>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

        <div class="courts-wrapper">
            <div class="court-card" id="court-1">
                <h3>สนาม 1</h3>
                <div class="court-players">
                    <div class="slot" id="c1-p1">ว่าง</div>
                    <div class="slot" id="c1-p2">ว่าง</div>
                    <div class="slot" id="c1-p3">ว่าง</div>
                    <div class="slot" id="c1-p4">ว่าง</div>
                </div>
                <button onclick="clearCourt(1)" style="width:100%; padding:10px; border-radius:10px; background: var(--accent-red); font-weight:bold;">จบเกม / เคลียร์สนาม</button>
            </div>

            <div class="court-card" id="court-2">
                <h3>สนาม 2</h3>
                <div class="court-players">
                    <div class="slot" id="c2-p1">ว่าง</div>
                    <div class="slot" id="c2-p2">ว่าง</div>
                    <div class="slot" id="c2-p3">ว่าง</div>
                    <div class="slot" id="c2-p4">ว่าง</div>
                </div>
                <button onclick="clearCourt(2)" style="width:100%; padding:10px; border-radius:10px; background: var(--accent-red); font-weight:bold;">จบเกม / เคลียร์สนาม</button>
            </div>
        </div>
    </div>

    <div class="side-panel">
        <h3>👥 สมาชิกที่เช็คอินแล้ว</h3>
        <div id="waiting-list">
            <p style="color: #ccc;">ยังไม่มีคนเช็คอิน...</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script type="module">
        // --- 1. Security & Firebase Setup ---
        const ADMIN_PASSWORD = "mysecretpass"; 
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('pass') !== ADMIN_PASSWORD) {
            alert("ไม่มีสิทธิ์เข้าถึง");
            window.location.href = "index.html"; 
        }

        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDQbnx83sbs1sO4xsuLUV50uxbBinr2VtY",
            authDomain: "earlybird-queue.firebaseapp.com",
            projectId: "earlybird-queue",
            storageBucket: "earlybird-queue.firebasestorage.app",
            messagingSenderId: "310694006567",
            appId: "1:310694006567:web:f56fc19ed03b81bf8c2302",
            measurementId: "G-CHJP8C4V5S"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentSessionId = "";
        let courtData = { 1: [], 2: [] };

        // --- 2. Session & QR Logic ---
        document.getElementById('startSessionBtn').onclick = async () => {
            if (typeof window.QRCode === "undefined") {
                alert("ระบบ QR ยังไม่พร้อม กรุณารอครู่เดียวครับ");
                return;
            }
            const sessionRef = await addDoc(collection(db, "sessions"), {
                created_at: Date.now(),
                is_closed: false
            });
            currentSessionId = sessionRef.id;
            
            document.getElementById('session-qr-area').style.display = 'block';
            const qrcodeContainer = document.getElementById("qrcode");
            qrcodeContainer.innerHTML = ""; 
            new window.QRCode(qrcodeContainer, {
                text: `https://early-bird-queue.vercel.app/index.html?session=${currentSessionId}`,
                width: 150,
                height: 150
            });
            document.getElementById('session-id-text').innerText = "ID: " + currentSessionId;
            listenToAttendance(currentSessionId);
        };

        // --- 3. Mock Data ---
        document.getElementById('mockUserBtn').onclick = async () => {
            if (!currentSessionId) return alert("กดเปิดก๊วนก่อนครับ");
            const names = ["พี่เอ็ม", "น้องบี", "เจ๊ดา", "เก่ง", "ตั้ม", "ฟ้า", "ปอนด์", "นัท", "แชมป์", "อาร์ม", "ปลา", "กิ๊ฟ", "โอม", "นุช", "บอย"];
            for (let i = 0; i < names.length; i++) {
                await setDoc(doc(db, `sessions/${currentSessionId}/attendance`, "mock_"+i), {
                    display_name: names[i],
                    check_in_time: Date.now() + i
                });
            }
        };

        // --- 4. Real-time Attendance ---
        function listenToAttendance(sessionId) {
            onSnapshot(collection(db, `sessions/${sessionId}/attendance`), (snapshot) => {
                const listDiv = document.getElementById('waiting-list');
                listDiv.innerHTML = "";
                snapshot.forEach(doc => {
                    const user = doc.data();
                    listDiv.innerHTML += `
                        <div class="player-tag">
                            <span>${user.display_name}</span>
                            <button onclick="addToQueue('${doc.id}', '${user.display_name}')" style="background:#fff; border-radius:5px; padding: 2px 8px;">จัดคิว</button>
                        </div>`;
                });
            });
        }

        // --- 5. Court Logic ---
        window.addToQueue = (id, name) => {
            let courtNum = 0;
            if (courtData[1].length < 4) courtNum = 1;
            else if (courtData[2].length < 4) courtNum = 2;

            if (courtNum === 0) return alert("สนามเต็ม!");
            
            courtData[courtNum].push(name);
            updateUI(courtNum);
        };

        window.clearCourt = (num) => {
            courtData[num] = [];
            updateUI(num);
        };

        function updateUI(num) {
            for (let i = 1; i <= 4; i++) {
                const el = document.getElementById(`c${num}-p${i}`);
                if (courtData[num][i-1]) {
                    el.innerText = courtData[num][i-1];
                    el.classList.add('filled');
                } else {
                    el.innerText = "ว่าง";
                    el.classList.remove('filled');
                }
            }
        }
    </script>
</body>
</html>
