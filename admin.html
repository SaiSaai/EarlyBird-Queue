<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badminton Admin Pro - Bug Fixed</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary-bg: #fdfcf0; --team-a: #a2d2ff; --team-b: #b9fbc0; --accent-red: #ffcfd2; --text-color: #444; }
        body { font-family: 'Kanit', sans-serif; background-color: var(--primary-bg); color: var(--text-color); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .side-panel { width: 280px; background: #fff; border-right: 2px solid #eee; padding: 15px; display: flex; flex-direction: column; transition: 0.3s; position: relative; }
        .panel-main { flex: 1; padding: 20px; overflow-y: auto; }
        .list-box { flex: 1; border: 1px solid #ddd; border-radius: 12px; overflow-y: auto; padding: 10px; background: #fafafa; }
        .player-item { padding: 10px; margin-bottom: 8px; border-radius: 10px; border: 2px solid #eee; background: white; cursor: pointer; font-weight: bold; text-align: center; }
        .sel-a { border-color: var(--team-a); background: #e7f3ff; box-shadow: 0 0 5px var(--team-a); }
        .sel-b { border-color: var(--team-b); background: #f0fff4; box-shadow: 0 0 5px var(--team-b); }
        .queue-group { background: white; border: 2px solid #ffeeba; border-radius: 12px; padding: 10px; margin-bottom: 12px; cursor: pointer; }
        .q-split { display: flex; gap: 8px; margin-top: 8px; }
        .q-tag { flex: 1; font-size: 0.8em; padding: 6px; border-radius: 6px; text-align: center; font-weight: bold; }
        .courts-wrapper { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .court-card { background: white; border-radius: 20px; padding: 15px; box-shadow: 0 8px 15px rgba(0,0,0,0.05); border-top: 10px solid #ddd; }
        .court-card.playing { border-top-color: #4caf50; }
        .team-box { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 15px; min-height: 90px; }
        .slot { background: rgba(255,255,255,0.8); padding: 10px; border-radius: 8px; font-size: 0.9em; text-align: center; font-weight: bold; cursor: pointer; }
        .slot.occupied { background: white; border: 1px solid rgba(0,0,0,0.1); }
        button { border: none; padding: 10px; border-radius: 10px; cursor: pointer; font-family: 'Kanit'; font-weight: bold; }
        .btn-confirm { background: #007bff; color: white; margin-top: 10px; width: 100%; }
        .side-panel.collapsed { width: 45px !important; padding: 10px 5px !important; cursor: pointer; background: #eee !important; }
        .side-panel.collapsed * { display: none !important; }
        .side-panel.collapsed::after { content: attr(data-label); writing-mode: vertical-rl; text-orientation: mixed; font-weight: bold; margin: 20px auto; display: block; }
        .toggle-btn { float: right; background: #ddd; padding: 2px 8px; border-radius: 5px; font-size: 0.7em; }
    </style>
</head>
<body>

    <div class="side-panel" id="panel-fifo" data-label="👥 1. คิวรอ" onclick="checkAndOpen(this)">
        <h3>👥 คิวรอ <span class="toggle-btn" onclick="event.stopPropagation(); togglePanel('panel-fifo')">❌ ซ่อน</span></h3>
        <div id="checkin-list" class="list-box"></div>
        <button id="confirmBtn" class="btn-confirm">ยืนยันลงสนาม (0)</button>
        <button id="mockUserBtn" style="margin-top:8px; background:#eee; font-size:0.8em;">🤖 สุ่มคน</button>
    </div>

    <div class="side-panel" id="panel-queue" style="background: #fffdf5;" data-label="⏳ 2. คิวกลาง" onclick="checkAndOpen(this)">
        <h3>⏳ คิวกลาง <span class="toggle-btn" onclick="event.stopPropagation(); togglePanel('panel-queue')">❌ ซ่อน</span></h3>
        <div id="queue-list" class="list-box"></div>
    </div>

    <div class="panel-main">
        <div style="display:flex; gap:15px; margin-bottom:20px; align-items: center; background:white; padding:15px; border-radius:15px;">
            <button onclick="createSession()" style="background: #4caf50; color: white;">🚀 เปิดก๊วนใหม่</button>
            <button onclick="addNewCourt()" style="background: #2196f3; color: white;">➕ เพิ่มสนาม</button>
            <div id="qrcode" style="margin-left: auto;"></div>
        </div>
        <div class="courts-wrapper" id="main-grid"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, addDoc, onSnapshot, query, orderBy, updateDoc, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDQbnx83sbs1sO4xsuLUV50uxbBinr2VtY",
            authDomain: "earlybird-queue.firebaseapp.com",
            projectId: "earlybird-queue",
            storageBucket: "earlybird-queue.firebasestorage.app",
            messagingSenderId: "310694006567",
            appId: "1:310694006567:web:f56fc19ed03b81bf8c2302"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let selectedSlots = [null, null, null, null]; 
        let currentSessionId = "";
        let queuedPlayerIds = new Set();
        let lastSnapshotData = []; // เก็บข้อมูลล่าสุดไว้สำหรับ Re-render

        window.togglePanel = (id) => document.getElementById(id).classList.toggle('collapsed');
        window.checkAndOpen = (el) => { if (el.classList.contains('collapsed')) togglePanel(el.id); };

        window.createSession = async () => {
            const sessionRef = await addDoc(collection(db, "sessions"), { created_at: serverTimestamp() });
            currentSessionId = sessionRef.id;
            new QRCode(document.getElementById("qrcode"), { text: `https://early-bird-queue.vercel.app/index.html?session=${currentSessionId}`, width: 60, height: 60 });
            listenToAttendance();
            addNewCourt(); addNewCourt();
        };

        function renderFIFO() {
            const list = document.getElementById('checkin-list');
            list.innerHTML = "";
            lastSnapshotData.forEach(player => {
                const { id, data } = player;
                const isSelected = selectedSlots.some(p => p?.id === id);
                // ต้อง (ไม่เล่นอยู่) AND (ไม่อยู่ในคิวกลาง) OR (กำลังถูกเลือก/แก้ไขอยู่)
                if (!data.is_playing && (!queuedPlayerIds.has(id) || isSelected)) {
                    const div = document.createElement('div');
                    div.className = "player-item";
                    div.innerText = data.display_name;
                    div.onclick = () => toggleSelect(id, data.display_name);
                    list.appendChild(div);
                }
            });
            updateSelectionUI();
        }

        function listenToAttendance() {
            if(!currentSessionId) return;
            const q = query(collection(db, `sessions/${currentSessionId}/attendance`), orderBy("last_match_end", "asc"));
            onSnapshot(q, (snapshot) => {
                lastSnapshotData = [];
                snapshot.forEach(docSnap => {
                    lastSnapshotData.push({ id: docSnap.id, data: docSnap.data() });
                });
                renderFIFO();
            });
        }

        window.toggleSelect = (id, name) => {
            const index = selectedSlots.findIndex(p => p?.id === id);
            if (index > -1) {
                selectedSlots[index] = null;
            } else {
                const emptyIdx = selectedSlots.findIndex(p => p === null);
                if (emptyIdx > -1) selectedSlots[emptyIdx] = { id, name };
            }
            renderFIFO(); // บังคับ Render ใหม่ทันทีเพื่อเช็คสถานะ
        };

        function updateSelectionUI() {
            const count = selectedSlots.filter(p => p !== null).length;
            document.getElementById('confirmBtn').innerText = `ยืนยันลงสนาม (${count})`;
            document.querySelectorAll('.player-item').forEach(el => {
                const name = el.innerText;
                const idx = selectedSlots.findIndex(p => p?.name === name);
                el.classList.remove('sel-a', 'sel-b');
                if (idx === 0 || idx === 1) el.classList.add('sel-a');
                if (idx === 2 || idx === 3) el.classList.add('sel-b');
            });
        }

        document.getElementById('confirmBtn').onclick = async () => {
            const players = selectedSlots.filter(p => p !== null);
            if (players.length === 0) return;

            const emptyCourt = Array.from(document.querySelectorAll('.court-card')).find(c => {
                return !c.classList.contains('playing') && c.querySelectorAll('.occupied').length === 0;
            });

            if (emptyCourt && players.length === 4) {
                const batch = writeBatch(db);
                players.forEach(p => batch.update(doc(db, `sessions/${currentSessionId}/attendance`, p.id), { is_playing: true }));
                await batch.commit();
                fillCourtUI(emptyCourt, players);
            } else {
                // ลงคิวกลาง
                players.forEach(p => queuedPlayerIds.add(p.id));
                addToQueueUI([...selectedSlots]);
            }
            selectedSlots = [null, null, null, null];
            renderFIFO(); // เคลียร์ชื่อออกจาก FIFO ทันที
        };

        function addToQueueUI(slotsCopy) {
            const div = document.createElement('div');
            div.className = "queue-group";
            const pNames = slotsCopy.map(p => p ? p.name : "-");
            div.innerHTML = `
                <div style="font-size:0.7em; color:#999; text-align:center;">คิวกลุ่ม (ลงสนาม/แก้ไข)</div>
                <div class="q-split">
                    <div class="q-tag" style="background:var(--team-a)">${pNames[0]}<br>${pNames[1]}</div>
                    <div class="q-tag" style="background:var(--team-b)">${pNames[2]}<br>${pNames[3]}</div>
                </div>
            `;

            div.onclick = async () => {
                const emptyCourt = Array.from(document.querySelectorAll('.court-card')).find(c => !c.classList.contains('playing') && c.querySelectorAll('.occupied').length === 0);
                const playersOnly = slotsCopy.filter(x => x !== null);

                if (emptyCourt && playersOnly.length === 4) {
                    const batch = writeBatch(db);
                    playersOnly.forEach(p => { 
                        batch.update(doc(db, `sessions/${currentSessionId}/attendance`, p.id), { is_playing: true }); 
                        queuedPlayerIds.delete(p.id); 
                    });
                    await batch.commit();
                    fillCourtUI(emptyCourt, playersOnly);
                    div.remove();
                    renderFIFO();
                } else {
                    // โหมดแก้ไข
                    playersOnly.forEach(p => queuedPlayerIds.delete(p.id));
                    selectedSlots = [...slotsCopy];
                    div.remove();
                    renderFIFO();
                }
            };
            document.getElementById('queue-list').appendChild(div);
        }

        function fillCourtUI(courtEl, players) {
            const slots = courtEl.querySelectorAll('.slot');
            players.forEach((p, i) => { 
                slots[i].innerText = p.name; 
                slots[i].dataset.uid = p.id; 
                slots[i].classList.add('occupied'); 
            });
        }

        window.addNewCourt = () => {
            const id = `court-${Date.now()}`;
            document.getElementById('main-grid').insertAdjacentHTML('beforeend', `
                <div class="court-card" id="${id}">
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                        <select>${generateOptions()}</select>
                        <button onclick="this.closest('.court-card').remove()" style="color:red; background:none; padding:0;">ลบ</button>
                    </div>
                    <div style="display:flex; gap:10px;">
                        <div class="team-box" style="background:var(--team-a)">
                            <div class="slot" onclick="assignSlot(this, '${id}', 0)">ว่าง</div>
                            <div class="slot" onclick="assignSlot(this, '${id}', 1)">ว่าง</div>
                        </div>
                        <div class="team-box" style="background:var(--team-b)">
                            <div class="slot" onclick="assignSlot(this, '${id}', 2)">ว่าง</div>
                            <div class="slot" onclick="assignSlot(this, '${id}', 3)">ว่าง</div>
                        </div>
                    </div>
                    <div class="match-controls">
                        <button id="btn-start-${id}" class="btn-start" style="width:100%" onclick="startMatch('${id}')">▶️ เริ่มเกม</button>
                        <button id="btn-end-${id}" class="btn-end" style="width:100%" onclick="endMatch('${id}')">⏹️ จบเกม / เคลียร์</button>
                    </div>
                </div>`);
        };

        window.assignSlot = async (slotEl, courtId, slotIdx) => {
            const oldUid = slotEl.dataset.uid;
            const firstPIdx = selectedSlots.findIndex(p => p !== null);
            if (firstPIdx === -1) {
                if (oldUid && confirm("เอาออก?")) {
                    await updateDoc(doc(db, `sessions/${currentSessionId}/attendance`, oldUid), { is_playing: false, last_match_end: Date.now() });
                    slotEl.innerText = "ว่าง"; slotEl.classList.remove('occupied'); delete slotEl.dataset.uid;
                }
                return;
            }
            const newP = selectedSlots[firstPIdx];
            const batch = writeBatch(db);
            if (oldUid) batch.update(doc(db, `sessions/${currentSessionId}/attendance`, oldUid), { is_playing: false, last_match_end: Date.now() });
            batch.update(doc(db, `sessions/${currentSessionId}/attendance`, newP.id), { is_playing: true });
            await batch.commit();
            slotEl.innerText = newP.name; slotEl.dataset.uid = newP.id; slotEl.classList.add('occupied');
            selectedSlots[firstPIdx] = null; 
            renderFIFO();
        };

        window.startMatch = (id) => {
            const c = document.getElementById(id);
            if(c.querySelectorAll('.occupied').length < 2) return alert("อย่างน้อย 2 คน");
            c.classList.add('playing');
            document.getElementById(`btn-start-${id}`).style.display = "none";
            document.getElementById(`btn-end-${id}`).style.display = "block";
        };

        window.endMatch = async (id) => {
            const c = document.getElementById(id);
            const uids = Array.from(c.querySelectorAll('.occupied')).map(s => s.dataset.uid);
            const batch = writeBatch(db);
            uids.forEach(uid => batch.update(doc(db, `sessions/${currentSessionId}/attendance`, uid), { is_playing: false, last_match_end: Date.now() }));
            await batch.commit();
            c.classList.remove('playing');
            c.querySelectorAll('.slot').forEach(s => { s.innerText="ว่าง"; s.classList.remove('occupied'); delete s.dataset.uid; });
            document.getElementById(`btn-start-${id}`).style.display = "block";
            document.getElementById(`btn-end-${id}`).style.display = "none";
        };

        function generateOptions() {
            let opt = "";
            for(let i=1; i<=15; i++) opt += `<option>สนาม ${i}</option>`;
            return opt;
        }

        document.getElementById('mockUserBtn').onclick = async () => {
            if(!currentSessionId) return;
            const names = ["พี่เอ็ม", "บีบี", "ดา", "เก่ง", "ตั้ม", "ฟ้า", "ปอนด์", "นัท"];
            for (const [i, n] of names.entries()) {
                await setDoc(doc(db, `sessions/${currentSessionId}/attendance`, "u"+i), { display_name: n, is_playing: false, last_match_end: Date.now()+(i*10) });
            }
        };
    </script>
</body>
</html>
