<!DOCTYPE html>
<html>
<head>
    <title>Admin Pro - Management</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        :root { --primary-bg: #fdfcf0; --card-bg: #ffffff; --accent-green: #b9fbc0; --accent-blue: #a2d2ff; --accent-red: #ffcfd2; --text-color: #555; }
        body { font-family: 'Kanit', sans-serif; background-color: var(--primary-bg); color: var(--text-color); margin: 0; display: flex; height: 100vh; }
        
        /* Layout */
        .court-container { flex: 1; padding: 20px; overflow-y: auto; }
        .side-panel { width: 320px; background: var(--card-bg); border-left: 2px solid #eee; padding: 20px; overflow-y: auto; }

        /* Court Cards */
        .courts-wrapper { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        .court-card { background: white; border-radius: 20px; padding: 15px; box-shadow: 0 8px 15px rgba(0,0,0,0.05); border-top: 10px solid var(--accent-green); position: relative; }
        
        .court-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .match-area { display: flex; align-items: center; justify-content: space-around; background: #f9f9f9; border-radius: 15px; padding: 10px; margin: 10px 0; }
        
        .team-box { width: 120px; min-height: 100px; display: flex; flex-direction: column; gap: 5px; }
        .player-slot { background: var(--accent-blue); padding: 8px; border-radius: 8px; font-size: 0.85em; font-weight: bold; text-align: center; cursor: grab; }
        .vs-circle { background: white; border: 2px solid #ddd; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.7em; font-weight: bold; }
        
        /* Shuttlecock Counter */
        .shuttle-ui { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 10px 0; font-weight: bold; }
        .btn-shuttle { background: #eee; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; display: flex; align-items: center; justify-content: center; border: none; }

        /* Waiting List Tags */
        .waiting-tag { background: #eee; padding: 8px; margin-bottom: 5px; border-radius: 8px; cursor: grab; font-size: 0.9em; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <div class="court-container">
        <div class="admin-header">
            <h1>🏸 Badminton Admin Pro</h1>
            <button id="startSessionBtn" style="padding: 10px; background: var(--accent-green); border-radius: 8px;">เปิดรอบก๊วน</button>
            <button id="mockUserBtn" style="padding: 10px; background: #eee; border-radius: 8px;">สุ่ม 15 คน</button>
        </div>

        <div id="session-qr-area" style="display:none; margin: 10px 0;"><div id="qrcode"></div></div>

        <div class="courts-wrapper" id="main-grid">
            <div class="court-card" id="court-card-1">
                <div class="court-header">
                    <select class="court-select">
                        <option value="01" selected>สนาม 01</option>
                        <option value="02">สนาม 02</option>
                        <option value="03">สนาม 03</option>
                        </select>
                    <span style="font-size: 0.8em; color: green;">● กำลังแข่ง</span>
                </div>
                
                <div class="match-area">
                    <div class="team-box sortable-court" id="c1-teamA"></div>
                    <div class="vs-circle">VS</div>
                    <div class="team-box sortable-court" id="c1-teamB"></div>
                </div>

                <div class="shuttle-ui">
                    🏸 ลูกแบด: 
                    <button class="btn-shuttle" onclick="updateShuttle(1, -1)">-</button>
                    <span id="shuttle-count-1">1</span>
                    <button class="btn-shuttle" onclick="updateShuttle(1, 1)">+</button>
                </div>

                <button onclick="clearCourt(1)" style="width:100%; background: var(--accent-red); padding: 8px; border-radius: 10px; font-weight: bold;">จบเกม</button>
            </div>
            </div>
    </div>

    <div class="side-panel">
        <h3>👥 รายชื่อคนรอ (ลากลงสนามได้เลย)</h3>
        <div id="waiting-list" class="sortable-waiting" style="min-height: 200px; border: 2px dashed #eee; padding: 10px; border-radius: 10px;">
            <p style="color:#ccc">รอกดสุ่มคน...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

        // --- Firebase Config (เหมือนเดิม) ---
        const firebaseConfig = { apiKey: "AIzaSyDQbnx83sbs1sO4xsuLUV50uxbBinr2VtY", authDomain: "earlybird-queue.firebaseapp.com", projectId: "earlybird-queue", storageBucket: "earlybird-queue.firebasestorage.app", messagingSenderId: "310694006567", appId: "1:310694006567:web:f56fc19ed03b81bf8c2302" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentSessionId = "";

        // --- Initialize Drag & Drop ---
        function initSortable() {
            // ลากจาก Waiting List
            Sortable.create(document.getElementById('waiting-list'), { group: 'players', animation: 150 });
            
            // ลากลงสนาม Team A / B
            document.querySelectorAll('.sortable-court').forEach(el => {
                Sortable.create(el, {
                    group: 'players',
                    animation: 150,
                    onAdd: function (evt) {
                        if (el.children.length > 2) { // 1 ทีมมีได้แค่ 2 คน
                            alert("ทีมนี้เต็มแล้ว!");
                            document.getElementById('waiting-list').appendChild(evt.item);
                        }
                    }
                });
            });
        }

        // --- Functions ---
        window.updateShuttle = (id, val) => {
            let el = document.getElementById(`shuttle-count-${id}`);
            let current = parseInt(el.innerText);
            if (current + val >= 0) el.innerText = current + val;
        };

        window.clearCourt = (id) => {
            if(confirm("จบเกมและล้างรายชื่อ?")) {
                document.getElementById(`c${id}-teamA`).innerHTML = "";
                document.getElementById(`c${id}-teamB`).innerHTML = "";
                document.getElementById(`shuttle-count-${id}`).innerText = "1";
            }
        };

        // --- Logic (Session & Mock) ---
        document.getElementById('startSessionBtn').onclick = async () => {
            const sessionRef = await addDoc(collection(db, "sessions"), { created_at: Date.now() });
            currentSessionId = sessionRef.id;
            document.getElementById('session-qr-area').style.display = 'block';
            new QRCode(document.getElementById("qrcode"), { text: `https://early-bird-queue.vercel.app/index.html?session=${currentSessionId}`, width: 120, height: 120 });
            listenToAttendance(currentSessionId);
            initSortable(); // เปิดระบบลากวาง
        };

        document.getElementById('mockUserBtn').onclick = async () => {
            if (!currentSessionId) return alert("เปิดรอบก่อน!");
            const names = ["พี่เอ็ม", "น้องบี", "เจ๊ดา", "เก่ง", "ตั้ม", "ฟ้า", "ปอนด์", "นัท", "แชมป์", "อาร์ม", "ปลา", "กิ๊ฟ", "โอม", "นุช", "บอย"];
            for (let i = 0; i < names.length; i++) {
                await setDoc(doc(db, `sessions/${currentSessionId}/attendance`, "m"+i), { display_name: names[i] });
            }
        };

        function listenToAttendance(sessionId) {
            onSnapshot(collection(db, `sessions/${sessionId}/attendance`), (snapshot) => {
                const list = document.getElementById('waiting-list');
                list.innerHTML = "";
                snapshot.forEach(doc => {
                    const u = doc.data();
                    const div = document.createElement('div');
                    div.className = "waiting-tag";
                    div.innerHTML = `<span>${u.display_name}</span>`;
                    list.appendChild(div);
                });
            });
        }
    </script>
</body>
</html>
