<!DOCTYPE html>
<html>
<head>
    <title>Admin - จัดการคิวแบด</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary-bg: #fdfcf0;
            --card-bg: #ffffff;
            --accent-green: #b9fbc0;
            --accent-blue: #a2d2ff;
            --text-color: #555;
        }
        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .court-container { flex: 1; padding: 20px; overflow-y: auto; }
        .side-panel {
            width: 350px;
            background-color: var(--card-bg);
            border-left: 2px solid #eee;
            padding: 20px;
            box-shadow: -2px 0 10px rgba(0,0,0,0.05);
            overflow-y: auto;
        }
        .player-tag {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 12px;
            background: var(--accent-blue);
            font-size: 0.9em;
            font-weight: bold;
        }
        #qrcode {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        #qrcode img {
            border: 10px solid white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .admin-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        button {
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="court-container">
        <div class="admin-header">
            <h1>🏸 ระบบจัดการคิว (Admin)</h1>
        </div>
        
        <div style="margin-bottom: 20px;">
            <button id="startSessionBtn" style="padding: 12px 24px; border-radius: 10px; border: none; background: var(--accent-green); font-weight: bold; cursor: pointer; font-size: 16px;">
                + เปิดรอบก๊วนใหม่
            </button>
            <button id="mockUserBtn" style="padding: 12px 24px; border-radius: 10px; border: 1px solid #ccc; background: #eee; cursor: pointer; margin-left: 10px; font-weight: bold;">
                🤖 สุ่มคนจำลอง 15 คน
            </button>
        </div>
        
        <div id="session-qr-area" style="display:none; margin: 20px 0; text-align: center; background: white; padding: 20px; border-radius: 15px; max-width: 300px;">
            <p style="font-weight: bold;">ให้สมาชิกสแกนเพื่อเข้าก๊วน:</p>
            <div id="qrcode"></div>
            <p id="session-id-text" style="font-size: 0.8em; color: #888;"></p>
        </div>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 30px 0;">
        
        <div id="courts-grid">
            <h3>สนามแข่งขัน (Court Grid)</h3>
            <p style="color: #999;">รอกดเปิดก๊วนเพื่อเริ่มจัดการสนาม...</p>
        </div>
    </div>

    <div class="side-panel">
        <h3>👥 สมาชิกที่เช็คอินแล้ว</h3>
        <div id="waiting-list">
            <p style="color: #ccc;">ยังไม่มีคนเช็คอิน...</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script type="module">
        // --- 1. Security Check ---
        const ADMIN_PASSWORD = "mysecretpass"; 
        const urlParams = new URLSearchParams(window.location.search);
        const enteredPass = urlParams.get('pass');

        if (enteredPass !== ADMIN_PASSWORD) {
            alert("ขออภัย คุณไม่มีสิทธิ์เข้าถึงหน้านี้");
            window.location.href = "index.html"; 
        }

        // --- 2. Firebase Setup ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDQbnx83sbs1sO4xsuLUV50uxbBinr2VtY",
            authDomain: "earlybird-queue.firebaseapp.com",
            projectId: "earlybird-queue",
            storageBucket: "earlybird-queue.firebasestorage.app",
            messagingSenderId: "310694006567",
            appId: "1:310694006567:web:f56fc19ed03b81bf8c2302",
            measurementId: "G-CHJP8C4V5S"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentSessionId = "";

        // --- 3. Session Logic ---
        document.getElementById('startSessionBtn').onclick = async () => {
            // เช็คว่า Library QRCode โหลดหรือยัง
            if (typeof window.QRCode === "undefined") {
                alert("ระบบสร้าง QR กำลังโหลด... กรุณารอ 2 วินาทีแล้วลองใหม่อีกครั้ง");
                return;
            }

            const sessionRef = await addDoc(collection(db, "sessions"), {
                session_name: "ก๊วนแบดมินตัน",
                is_closed: false,
                created_at: Date.now()
            });
            currentSessionId = sessionRef.id;
            
            const checkInURL = `https://early-bird-queue.vercel.app/index.html?session=${currentSessionId}`;
            
            document.getElementById('session-qr-area').style.display = 'block';
            const qrcodeContainer = document.getElementById("qrcode");
            qrcodeContainer.innerHTML = ""; 

            new window.QRCode(qrcodeContainer, {
                text: checkInURL,
                width: 180,
                height: 180,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : window.QRCode.CorrectLevel.H
            });
            
            document.getElementById('session-id-text').innerText = "Session ID: " + currentSessionId;
            listenToAttendance(currentSessionId);
        };

        // --- 4. ฟังก์ชันสร้างคนจำลอง ---
        document.getElementById('mockUserBtn').onclick = async () => {
            if (!currentSessionId) {
                alert("กรุณากด 'เปิดรอบก๊วนใหม่' ก่อนสร้างคนจำลองครับ");
                return;
            }

            const mockNames = ["พี่เอ็ม", "น้องบี", "เจ๊ดา", "เก่ง", "ตั้ม", "ฟ้า", "ปอนด์", "นัท", "แชมป์", "อาร์ม", "ปลา", "กิ๊ฟ", "โอม", "นุช", "บอย"];
            const levels = ["YELLOW", "GREEN", "BLUE", "RED", "BLACK"];

            for (let i = 0; i < mockNames.length; i++) {
                const mockId = "mock_user_" + i;
                const attendanceRef = doc(db, `sessions/${currentSessionId}/attendance`, mockId);
                await setDoc(attendanceRef, {
                    user_id: mockId,
                    display_name: mockNames[i],
                    level_color: levels[Math.floor(Math.random() * levels.length)],
                    check_in_time: Date.now() + (i * 1000),
                    is_paid: false
                });
            }
            alert("สร้างคนจำลอง 15 คนสำเร็จแล้ว!");
        };

        // --- 5. ดึงข้อมูลคนเช็คอิน Real-time ---
        function listenToAttendance(sessionId) {
            const attendanceRef = collection(db, `sessions/${sessionId}/attendance`);
            onSnapshot(attendanceRef, (snapshot) => {
                const listDiv = document.getElementById('waiting-list');
                listDiv.innerHTML = "";
                if (snapshot.empty) {
                    listDiv.innerHTML = '<p style="color: #ccc;">ยังไม่มีคนเช็คอิน...</p>';
                    return;
                }
                
                snapshot.forEach(doc => {
                    const user = doc.data();
                    listDiv.innerHTML += `
                        <div class="player-tag">
                            <span>${user.display_name}</span>
                            <button onclick="addToQueue('${user.user_id}', '${user.display_name}')" style="border:none; background:#fff; border-radius:5px; cursor:pointer; padding: 4px 10px; font-weight: bold;">จัดคิว</button>
                        </div>
                    `;
                });
            });
        }

        // --- 6. ฟังก์ชันจัดคิว ---
        window.addToQueue = (userId, name) => {
            alert("พร้อมจัดคิวให้คุณ " + name + " แล้วครับ!");
            // ในขั้นตอนถัดไป เราจะเขียนให้ชื่อคนไปลงสนามที่เลือก
        };

    </script>
</body>
</html>
