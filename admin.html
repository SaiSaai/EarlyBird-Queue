<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badminton Admin - Pro Edition 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --sidebar-width: 320px;
            /* ลดความกว้างลงเพื่อให้เหลือพื้นที่สนาม */
            --primary-bg: #fdfcf0;
            --team-a: #a2d2ff;
            --team-b: #b9fbc0;
            --accent-red: #ffcfd2;
            --playing-bg: #f0fff4;
            --v-yellow: #FFD700;
            --v-green: #00C853;
            --v-blue: #2962FF;
            --v-red: #D50000;
            --v-black: #000000;
        }

        * {
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            /* ล็อกหน้าจอไม่ให้ Scroll ทั้งหน้า */
        }

        /* ปรับ Sidebar เป็นแนวตั้งแทน */
        #left-sidebar-container {
            width: var(--sidebar-width);
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #fff;
            border-right: 2px solid #eee;
            flex-shrink: 0;
        }

        .queue-split-area {
            display: flex;
            flex-direction: column;
            /* เปลี่ยนจาก row เป็น column */
            flex: 1;
            min-height: 0;
        }

        .side-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
            /* ลด padding */
            overflow: hidden;
        }

        .side-panel h3 {
            font-size: 1em;
            margin: 5px 0;
        }

        /* พื้นที่หลักทางขวา */
        .panel-main {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            /* ให้ Scroll เฉพาะฝั่งขวา */
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .list-box {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 12px;
            overflow-y: auto;
            padding: 10px;
            background: #fafafa;
        }

        .player-item {
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 10px;
            border: 2px solid #eee;
            background: white;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            transition: 0.2s;
        }

        .player-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        }

        .skill-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
        }

        .lvl-yellow {
            background: var(--v-yellow);
        }

        .lvl-green {
            background: var(--v-green);
        }

        .lvl-blue {
            background: var(--v-blue);
        }

        .lvl-red {
            background: var(--v-red);
        }

        .lvl-black {
            background: var(--v-black);
        }

        .sel-a {
            border-color: var(--team-a);
            background: #e7f3ff;
        }

        .sel-b {
            border-color: var(--team-b);
            background: #f0fff4;
        }

        /* ปรับ Grid สนามให้เล็กลงหน่อยเพื่อประหยัดพื้นที่ */
        .courts-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 10px;
        }

        .court-card {
            background: white;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.05);
            border-top: 10px solid #ccc;
        }

        .court-card.playing {
            border-top-color: #4caf50;
            background: var(--playing-bg);
        }

        .slot {
            background: white;
            padding: 10px;
            border-radius: 8px;
            font-size: 1.3em;
            font-weight: bold;
            border: 1px dashed #ccc;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 42px;
            margin-bottom: 5px;
            overflow: hidden;
        }

        .slot.occupied {
            border-style: solid;
            border-color: rgba(0, 0, 0, 0.1);
        }

        button {
            cursor: pointer;
            border: none;
            font-family: 'Kanit';
            font-weight: 600;
            border-radius: 10px;
            transition: 0.2s;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-start {
            background: #4caf50;
            color: white;
            width: 100%;
            padding: 12px;
            margin-top: 8px;
        }

        .btn-end {
            background: var(--accent-red);
            color: #d00;
            width: 100%;
            padding: 12px;
            margin-top: 8px;
        }

        /* ปรับตารางประวัติให้กะทัดรัด */
        .history-section {
            margin-top: 10px;
            padding: 15px;
            flex-shrink: 0;
            /* ไม่ให้ส่วนประวัติโดนบีบจนหาย */
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .history-table td,
        .history-table th {
            padding: 8px 5px;
            font-size: 0.8em;
        }

        /* สไตล์เพิ่มเติมสำหรับตารางประวัติ */
        .badge-court {
            background: #444;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
        }

        /* ชื่อทีมในประวัติให้เล็กลงเล็กน้อยแต่ยังอ่านง่าย */
        .team-pill {
            padding: 2px 6px;
            font-size: 1.3em;
        }

        .team-a-pill {
            background-color: var(--team-a);
            color: #004085;
        }

        .team-b-pill {
            background-color: var(--team-b);
            color: #09440c;
        }

        .vs-text {
            margin: 0 10px;
            font-weight: bold;
            color: #999;
            font-style: italic;
        }

        .game-no {
            font-weight: bold;
            color: #666;
        }

        #qr-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 25px;
            text-align: center;
        }

        /* สไตล์ตอนกำลังลากคิว */
        .sortable-ghost {
            opacity: 0.4;
            background-color: #e2e2e2 !important;
            border: 2px dashed #999 !important;
        }

        .drag-handle {
            touch-action: none;
            /* สำคัญมากสำหรับ iPad เพื่อให้ลากได้ลื่นไม่ติด Scroll จอ */
            user-select: none;
        }

        #queue-list {
            min-height: 50px;
            /* ให้มีพื้นที่เหลือพอให้ลากมาวางได้ */
        }
    </style>
</head>

<body>

    <div id="left-sidebar-container">
        <div class="queue-split-area">
            <div class="side-panel" style="border-bottom: 1px solid #eee;">
                <h3>👥 คิวรอ (FIFO)</h3>
                <div id="checkin-list" class="list-box"></div>
                <button id="confirmBtn" class="btn-primary"
                    style="width:100%; padding:14px; margin-top:8px; font-size:1em;">ยืนยันลงสนาม (0)</button>
            </div>
            <div class="side-panel" style="background: #fffdf5;">
                <h3>⏳ คิวกลาง</h3>
                <div id="queue-list" class="list-box"></div>
            </div>
        </div>
        <div style="padding: 10px; background: #f9f9f9; border-top: 1px solid #eee;">
            <textarea id="bulk-paste-input" rows="2" placeholder="วางรายชื่อที่นี่..."
                style="width: 100%; border-radius: 8px; border: 1px solid #ddd; padding: 10px; font-size: 0.8em; resize: none;"></textarea>
            <button onclick="importBulkPlayers()"
                style="width: 100%; padding: 10px; margin-top: 5px; background: #6f42c1; color: white;">🚀
                นำเข้ารายชื่อ</button>
        </div>
    </div>

    <div class="panel-main">
        <div style="display:flex; gap:12px; margin-bottom:20px; align-items: center;">
            <button onclick="createSession()" style="background: #4caf50; color: white; padding: 12px 20px;">🚀
                เปิดก๊วนใหม่</button>
            <button onclick="addNewCourt()" style="background: #2196f3; color: white; padding: 12px 20px;">➕
                เพิ่มสนาม</button>
            <button onclick="terminateSession()" style="background: #ff4d4f; color: white; padding: 12px 20px;">🏁
                จบก๊วน & ส่งสรุป</button>
            <div id="qrcode" onclick="expandQR()" style="margin-left: auto; cursor: zoom-in;"></div>
        </div>

        <div id="empty-msg" style="text-align:center; color:#999; margin-top:50px;">ยังไม่มีสนาม กด "เพิ่มสนาม"</div>
        <div class="courts-wrapper" id="main-grid"></div>

        <div class="history-section">
            <h3>📜 ประวัติการแข่งวันนี้</h3>
            <table class="history-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>คู่แข่งขัน</th>
                        <th>เวลาจบ</th>
                    </tr>
                </thead>
                <tbody id="match-history-list"></tbody>
            </table>
        </div>
    </div>

    <div id="qr-overlay" onclick="this.style.display='none'">
        <div class="modal-content">
            <h2>Scan QR!</h2>
            <div id="qr-big" style="display:flex; justify-content:center; margin:20px 0;"></div>
            <p id="sid-text"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import {
            getFirestore, collection, doc, setDoc, onSnapshot,
            query, orderBy, updateDoc, runTransaction, writeBatch, increment
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDQbnx83sbs1sO4xsuLUV50uxbBinr2VtY", authDomain: "earlybird-queue.firebaseapp.com", projectId: "earlybird-queue", storageBucket: "earlybird-queue.firebasestorage.app", messagingSenderId: "310694006567", appId: "1:310694006567:web:f56fc19ed03b81bf8c2302" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ---------------- STATE ----------------
        let currentSessionId = localStorage.getItem('last_sid') || "";
        let selectedSlots = [null, null, null, null];
        let middleQueue = [];
        let lastSnapshotData = [];
        let unsubAttendance = null;
        let unsubMatches = null;

        // ---------------- INIT ----------------
        window.onload = () => {
            if (!currentSessionId) return;

            generateQR(currentSessionId);
            loadLocal();
            attachListeners();
        };

        // ---------------- STORAGE ----------------
        const saveLocal = () => {
            localStorage.setItem(`ebq_queue_${currentSessionId}`, JSON.stringify(middleQueue));
        };

        const loadLocal = () => {
            const q = localStorage.getItem(`ebq_queue_${currentSessionId}`);
            if (q) middleQueue = JSON.parse(q);
            renderMiddleQueue();
        };

        // ---------------- SESSION ----------------
        window.createSession = async () => {
            const sid = "GS" + Date.now().toString().slice(-6);
            await setDoc(doc(db, "sessions", sid), { status: "active", created_at: Date.now() });
            localStorage.setItem('last_sid', sid);
            location.reload();
        };

        // ---------------- LISTENERS ----------------
        function attachListeners() {
            if (unsubAttendance) unsubAttendance();
            if (unsubMatches) unsubMatches();

            unsubAttendance = onSnapshot(
                query(collection(db, `sessions/${currentSessionId}/attendance`), orderBy("last_match_end", "asc")),
                snap => {
                    lastSnapshotData = snap.docs.map(d => ({ id: d.id, data: d.data() }));
                    renderFIFO();
                }
            );

            unsubMatches = onSnapshot(
                query(collection(db, `sessions/${currentSessionId}/matches`), orderBy("timestamp", "desc")),
                snap => renderMatches(snap)
            );
        }

        window.onbeforeunload = () => {
            if (unsubAttendance) unsubAttendance();
            if (unsubMatches) unsubMatches();
        };

        // ---------------- SAFE TEXT ----------------
        const safeText = (str) => {
            const div = document.createElement("div");
            div.textContent = str || "";
            return div.innerHTML;
        };

        // ---------------- FIFO ----------------
        window.renderFIFO = () => {
            const list = document.getElementById('checkin-list');
            list.innerHTML = "";

            const selectedIds = new Set(selectedSlots.filter(s => s).map(s => s.id));
            const queueIds = new Set(middleQueue.flatMap(q => q.slots.map(s => s?.id)));

            lastSnapshotData.forEach(p => {
                const d = p.data;
                if (d.is_playing || d.is_paid) return;

                if (queueIds.has(p.id) && !selectedIds.has(p.id)) return;

                const div = document.createElement('div');
                div.className = "player-item";

                const games = d.games_played || 0;

                div.innerHTML = `
        <span class="skill-dot lvl-${d.skill_level}"></span>
        <span style="flex:1">${safeText(d.display_name)}</span>
        <span>(${games})</span>
        `;

                div.onclick = () => toggleSelect(p);

                list.appendChild(div);
            });
        };

        function toggleSelect(player) {
            const idx = selectedSlots.findIndex(s => s?.id === player.id);

            if (idx !== -1) {
                selectedSlots[idx] = null;
            } else {
                const empty = selectedSlots.findIndex(s => s === null);
                if (empty !== -1) {
                    selectedSlots[empty] = { id: player.id, name: player.data.display_name };
                }
            }

            renderFIFO();
            updateBtn();
        }

        // ---------------- CONFIRM → QUEUE ----------------
        document.getElementById('confirmBtn').onclick = () => {
            if (selectedSlots.filter(s => s).length !== 4) return;

            middleQueue.push({ slots: [...selectedSlots] });
            selectedSlots = [null, null, null, null];

            saveLocal();
            renderMiddleQueue();
            renderFIFO();

            autoFillCourt(); // 🔥 auto flow
        };

        // ---------------- AUTO FILL ----------------
        async function autoFillCourt() {
            const emptyCourt = document.querySelector('.court-card:not(.playing)');
            if (!emptyCourt) return;

            if (!middleQueue.length) return;

            const q = middleQueue.shift();
            const slots = emptyCourt.querySelectorAll('.slot');

            await runTransaction(db, async (tx) => {
                q.slots.forEach((p, i) => {
                    tx.update(doc(db, `sessions/${currentSessionId}/attendance`, p.id), {
                        is_playing: true
                    });

                    slots[i].innerHTML = safeText(p.name);
                    slots[i].classList.add('occupied');
                    slots[i].dataset.uid = p.id;
                });
            });

            saveLocal();
            renderMiddleQueue();
        }

        // ---------------- MATCH END ----------------
        window.handleEndGame = async (id) => {
            const card = document.getElementById(id);
            const slots = card.querySelectorAll('.slot');

            const batch = writeBatch(db);

            slots.forEach(s => {
                if (!s.dataset.uid) return;

                batch.update(doc(db, `sessions/${currentSessionId}/attendance`, s.dataset.uid), {
                    is_playing: false,
                    games_played: increment(1),
                    last_match_end: Date.now()
                });

                s.innerHTML = "ว่าง";
                s.classList.remove('occupied');
                delete s.dataset.uid;
            });

            await batch.commit();

            autoFillCourt(); // 🔥 เล่นต่อทันที
        };

        // ---------------- QUEUE UI ----------------
        window.renderMiddleQueue = () => {
            const list = document.getElementById('queue-list');
            list.innerHTML = "";

            middleQueue.forEach((q, i) => {
                const div = document.createElement('div');
                div.className = "player-item";

                const names = q.slots.map(s => s?.name || "-");

                div.innerHTML = `
        <b>Q${i + 1}</b> 
        ${safeText(names[0])}+${safeText(names[1])}
        VS
        ${safeText(names[2])}+${safeText(names[3])}
        `;

                list.appendChild(div);
            });
        };

        // ---------------- MATCH HISTORY ----------------
        function renderMatches(snap) {
            const list = document.getElementById('match-history-list');
            list.innerHTML = "";

            snap.docs.forEach(doc => {
                const m = doc.data();

                const row = `
        <tr>
            <td>${safeText(m.teamA.join(" + "))}</td>
            <td>VS</td>
            <td>${safeText(m.teamB.join(" + "))}</td>
        </tr>
        `;

                list.insertAdjacentHTML('beforeend', row);
            });
        }

        // ---------------- UI ----------------
        window.updateBtn = () => {
            document.getElementById('confirmBtn').innerText =
                `ยืนยัน (${selectedSlots.filter(s => s).length}/4)`;
        };

        // ---------------- QR ----------------
        window.generateQR = (id) => {
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: `https://early-bird-queue.vercel.app/index.html?session=${id}`,
                width: 60,
                height: 60
            });
        };
    </script>
</body>
