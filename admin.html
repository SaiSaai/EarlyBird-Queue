<!DOCTYPE html>
<html>
<head>
    <title>Badminton Admin - Smart Cycle</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --primary-bg: #fdfcf0; --team-a: #a2d2ff; --team-b: #b9fbc0; --accent-red: #ffcfd2; }
        body { font-family: 'Kanit', sans-serif; background-color: var(--primary-bg); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        .panel-left, .panel-center { width: 260px; background: #fff; border-right: 2px solid #eee; padding: 15px; display: flex; flex-direction: column; }
        .panel-main { flex: 1; padding: 20px; overflow-y: auto; }
        .list-box { flex: 1; border: 1px solid #ddd; border-radius: 10px; overflow-y: auto; padding: 8px; background: #fafafa; }
        
        /* Player Selection Styles */
        .player-item { 
            padding: 12px; margin-bottom: 8px; border-radius: 10px; border: 2px solid #ddd; 
            background: white; cursor: pointer; font-weight: bold; text-align: center; transition: 0.2s;
        }
        /* สีตามลำดับการเลือก */
        .sel-team-a { border-color: var(--team-a); background: #e7f3ff; box-shadow: 0 0 8px var(--team-a); }
        .sel-team-b { border-color: var(--team-b); background: #f0fff4; box-shadow: 0 0 8px var(--team-b); }

        /* Queue Group */
        .queue-group { background: white; border: 2px solid #ffeeba; border-radius: 12px; padding: 8px; margin-bottom: 12px; cursor: pointer; }
        .q-team-split { display: flex; gap: 5px; margin-top: 5px; }
        .q-box { flex: 1; font-size: 0.75em; padding: 5px; border-radius: 5px; text-align: center; font-weight: bold; }

        /* Courts */
        .courts-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .court-card { background: white; border-radius: 20px; padding: 15px; box-shadow: 0 8px 15px rgba(0,0,0,0.05); border-top: 10px solid #ccc; }
        .court-card.playing { border-top-color: #4caf50; }
        .team-box { flex: 1; display: flex; flex-direction: column; gap: 5px; padding: 10px; border-radius: 12px; min-height: 80px; }
        .slot { background: rgba(255,255,255,0.7); padding: 10px; border-radius: 8px; font-size: 0.9em; text-align: center; font-weight: bold; }

        button { border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-family: 'Kanit'; font-weight: bold; }
    </style>
</head>
<body>

    <div class="panel-left">
        <h3>👥 1. รอจัดคิว</h3>
        <div id="checkin-list" class="list-box"></div>
        <button id="confirmBtn" style="background: #007bff; color: white; margin-top: 10px;">ยืนยันลงสนาม (0)</button>
    </div>

    <div class="panel-center" style="background: #fff9e6;">
        <h3>⏳ 2. คิวกลาง</h3>
        <div id="queue-list" class="list-box"></div>
    </div>

    <div class="panel-main">
        <div style="display:flex; gap:10px; margin-bottom:20px; align-items: center;">
            <button onclick="createSession()" style="background: var(--team-b);">🚀 เปิดก๊วน</button>
            <button onclick="addNewCourt()" style="background: var(--team-a);">➕ เพิ่มสนาม</button>
            <div id="qrcode"></div>
        </div>
        <div class="courts-wrapper" id="main-grid"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";
        import { query, collection, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDQbnx83sbs1sO4xsuLUV50uxbBinr2VtY", authDomain: "earlybird-queue.firebaseapp.com", projectId: "earlybird-queue", storageBucket: "earlybird-queue.firebasestorage.app", messagingSenderId: "310694006567", appId: "1:310694006567:web:f56fc19ed03b81bf8c2302" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let selectedPlayers = [];
        let currentSessionId = "";

        // --- 1. Selection with Colors ---
        window.toggleSelect = (name, el) => {
            const index = selectedPlayers.indexOf(name);
            if (index > -1) {
                selectedPlayers.splice(index, 1);
            } else if (selectedPlayers.length < 4) {
                selectedPlayers.push(name);
            }
            updateSelectionUI();
        };

        function updateSelectionUI() {
            const allItems = document.querySelectorAll('.player-item');
            allItems.forEach(el => {
                const name = el.innerText;
                const idx = selectedPlayers.indexOf(name);
                el.classList.remove('sel-team-a', 'sel-team-b');
                if (idx !== -1) {
                    if (idx < 2) el.classList.add('sel-team-a');
                    else el.classList.add('sel-team-b');
                }
            });
            document.getElementById('confirmBtn').innerText = `ยืนยันลงสนาม (${selectedPlayers.length})`;
        }

// --- แก้ไขส่วนยืนยันลงสนาม ---
       document.getElementById('confirmBtn').onclick = () => {
    if (selectedPlayers.length === 0) return;
    
    // หาเลขสนามที่ว่าง (เช็คว่าไม่มีคนที่มีคลาส occupied)
    const emptyCourt = Array.from(document.querySelectorAll('.court-card')).find(c => {
        return c.querySelectorAll('.occupied').length === 0;
    });

    if (emptyCourt) {
        // ส่งคนตามจำนวนที่เลือกจริง (ไม่จำเป็นต้องครบ 4 ก็ไม่ Error)
        fillCourt(emptyCourt, [...selectedPlayers]);
    } else {
        addToQueue([...selectedPlayers]);
    }

    // ล้างรายชื่อที่เลือกออกจากหน้าจอ Waiting List
    const selectedElements = document.querySelectorAll('.player-item.sel-team-a, .player-item.sel-team-b');
    selectedElements.forEach(el => el.remove());

    // รีเซ็ตค่าตัวแปร
    selectedPlayers = [];
    updateSelectionUI();
};

        // --- 2. Fill Court & Queue ---
        function fillCourt(courtEl, players) {
    const slotsA = courtEl.querySelectorAll('.team-box:first-of-type .slot'); // ทีม A
    const slotsB = courtEl.querySelectorAll('.team-box:last-of-type .slot');  // ทีม B
    
    players.forEach((name, i) => {
        let targetSlot;
        if (i < 2) {
            targetSlot = slotsA[i];
        } else {
            targetSlot = slotsB[i - 2];
        }

        // เช็คก่อนว่ามีช่องรองรับไหม (ป้องกัน Error property of undefined)
        if (targetSlot) {
            targetSlot.innerText = name;
            targetSlot.classList.add('occupied');
        }
    });
    
    // ถ้ามีคนลงสนามอย่างน้อย 1 คน ให้เปลี่ยนสถานะเป็นกำลังแข่ง
    if (players.length > 0) {
        courtEl.classList.add('playing');
    }
}

        function addToQueue(players) {
            const queueList = document.getElementById('queue-list');
            const group = document.createElement('div');
            group.className = "queue-group";
            group.innerHTML = `
                <div class="q-team-split">
                    <div class="q-box" style="background:var(--team-a)">${players[0]}<br>${players[1] || ''}</div>
                    <div style="align-self:center; font-size:10px;">VS</div>
                    <div class="q-box" style="background:var(--team-b)">${players[2] || ''}<br>${players[3] || ''}</div>
                </div>`;
            group.onclick = () => {
                const court = Array.from(document.querySelectorAll('.court-card')).find(c => c.querySelectorAll('.occupied').length === 0);
                if (court) { fillCourt(court, players); group.remove(); }
            };
            queueList.appendChild(group);
        }

        // --- 3. End Match & Return to Top ---
        window.endMatch = async (courtId, playerIds) => {
    // 1. เคลียร์สถานะในสนาม (UI)
    // ... โค้ดเคลียร์ UI เดิมของคุณ ...

    // 2. อัปเดต Database
    const now = Date.now();
    playerIds.forEach(async (uid) => {
        const attendanceRef = doc(db, `sessions/${currentSessionId}/attendance`, uid);
        await updateDoc(attendanceRef, {
            is_playing: false,
            last_match_end: now // ตั้งเวลาเป็น 'ปัจจุบัน' เพื่อให้ไปต่อท้ายคิว
        });
    });
};

        // --- 4. UI Helpers ---
        function addPlayerToUI(name, toTop = false) {
            const list = document.getElementById('checkin-list');
            const div = document.createElement('div');
            div.className = "player-item";
            div.innerText = name;
            div.onclick = () => toggleSelect(name, div);
            
            if (toTop) list.prepend(div);
            else list.appendChild(div);
        }

        window.addNewCourt = () => {
            const grid = document.getElementById('main-grid');
            let maxNum = 0;
            document.querySelectorAll('.court-select').forEach(s => maxNum = Math.max(maxNum, parseInt(s.value)));
            const nextNum = (maxNum + 1).toString().padStart(2, '0');
            const id = Date.now();
            grid.insertAdjacentHTML('beforeend', `
                <div class="court-card" id="c-${id}">
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                        <select class="court-select">${generateOptions(nextNum)}</select>
                        <button onclick="this.closest('.court-card').remove()" style="color:red; background:none; padding:0;">ลบ</button>
                    </div>
                    <div style="display:flex; gap:10px;">
                        <div class="team-box" style="background:var(--team-a)"><div class="slot">ว่าง</div><div class="slot">ว่าง</div></div>
                        <div class="team-box" style="background:var(--team-b)"><div class="slot">ว่าง</div><div class="slot">ว่าง</div></div>
                    </div>
                    <button onclick="endMatch('${id}')" style="width:100%; background:var(--accent-red); margin-top:10px;">จบเกม</button>
                </div>`);
        };

        function generateOptions(sel) {
            let opt = "";
            for(let i=1; i<=25; i++) {
                let v = i.toString().padStart(2, '0');
                opt += `<option value="${v}" ${v==sel?'selected':''}>สนาม ${v}</option>`;
            }
            return opt;
        }

        window.createSession = async () => {
            const ref = await addDoc(collection(db, "sessions"), { created_at: Date.now() });
            currentSessionId = ref.id;
            new QRCode(document.getElementById("qrcode"), { text: `https://.../index.html?session=${currentSessionId}`, width: 50, height: 50 });
            listenToAttendance(currentSessionId);
            addNewCourt(); addNewCourt();
            
            // ปุ่ม Mock สำหรับทดสอบ
            addPlayerToUI("เอ็ม"); addPlayerToUI("บี"); addPlayerToUI("ดา"); addPlayerToUI("เก่ง");
            addPlayerToUI("ตั้ม"); addPlayerToUI("ฟ้า"); addPlayerToUI("ปอนด์"); addPlayerToUI("นัท");
            //addPlayerToUI("ทราย"); addPlayerToUI("ชาติ"); addPlayerToUI("พิม"); addPlayerToUI("นุ่น");
        };

        function listenToAttendance(sid) {
            onSnapshot(collection(db, `sessions/${sid}/attendance`), snap => {
                snap.docChanges().forEach(change => {
                    if (change.type === "added") addPlayerToUI(change.doc.data().display_name);
                });
            });
        }

        function listenToWaitingList(sessionId) {
    // 💡 คีย์หลักคือตรงนี้: เรียงจาก "เก่าไปใหม่" (asc) 
    // ใครที่มีเวลา last_match_end เป็นอดีตมากกว่า (รอนานกว่า) จะขึ้นก่อน
    const q = query(
        collection(db, `sessions/${sessionId}/attendance`),
        orderBy("last_match_end", "asc") 
    );

    onSnapshot(q, (snapshot) => {
        const list = document.getElementById('checkin-list');
        list.innerHTML = ""; // ล้างรายการเพื่อวาดใหม่ตามลำดับที่ Query ส่งมา

        snapshot.forEach(doc => {
            const data = doc.data();
            
            // กรองเฉพาะคนที่ไม่ได้กำลังเล่นอยู่ในสนาม
            if (!data.is_playing) {
                const div = document.createElement('div');
                div.className = "player-item";
                div.innerText = data.display_name;
                div.onclick = () => toggleSelect(data.display_name, div, doc.id);
                list.appendChild(div); // เพิ่มต่อท้ายลงไปเรื่อยๆ ตามลำดับ Query
            }
        });
    });
}
    </script>
</body>
</html>
