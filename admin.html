<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badminton Admin - Match Start Fixed</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary-bg: #fdfcf0; --team-a: #a2d2ff; --team-b: #b9fbc0;
            --lvl-yellow: #FFD700; --lvl-green: #00C853; --lvl-blue: #2962FF; --lvl-red: #D50000; --lvl-black: #000000;
        }
        * { font-family: 'Kanit', sans-serif !important; box-sizing: border-box; }
        body { background-color: var(--primary-bg); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        .side-panel { width: 300px; flex-shrink: 0; display: flex; flex-direction: column; background: #fff; border-right: 2px solid #eee; padding: 15px; transition: 0.3s; height: 100vh; }
        .side-panel.collapsed { width: 60px; padding: 10px; }
        .side-panel.collapsed .content-view { display: none; }
        
        .list-box { flex: 1; border: 1px solid #ddd; border-radius: 15px; overflow-y: auto; padding: 10px; background: #fafafa; min-height: 0; }
        .panel-main { flex: 1; padding: 20px; overflow-y: auto; height: 100vh; }
        .courts-wrapper { display: grid; gap: 20px; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); }

        /* Skill & Player Items */
        .skill-dot { display: inline-block; width: 16px; height: 16px; border-radius: 50%; margin-right: 10px; vertical-align: middle; border: 1px solid rgba(0,0,0,0.1); }
        .lvl-yellow { background: var(--lvl-yellow); } .lvl-green { background: var(--lvl-green); } .lvl-blue { background: var(--lvl-blue); } .lvl-red { background: var(--lvl-red); } .lvl-black { background: var(--lvl-black); }

        .player-item { padding: 12px; margin-bottom: 8px; border-radius: 12px; border: 2px solid #eee; background: white; cursor: pointer; font-weight: 600; text-align: left; transition: 0.1s; }
        .sel-a { border-color: var(--team-a); background: #e7f3ff; }
        .sel-b { border-color: var(--team-b); background: #f0fff4; }

        .court-card { background: white; border-radius: 20px; padding: 15px; box-shadow: 0 8px 15px rgba(0,0,0,0.05); border-top: 10px solid #ccc; transition: 0.3s; }
        .court-card.playing { border-top-color: var(--lvl-green); background: #fafffa; }
        .court-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #f8f9fa; border-radius: 15px; cursor: grab; margin-bottom: 10px; }
        
        .slot { background: white; padding: 10px; border-radius: 10px; font-size: 0.85em; text-align: center; border: 1px dashed #ccc; cursor: pointer; min-height: 45px; display: flex; align-items: center; margin-bottom: 5px; width: 100%; }
        .slot.occupied { border-style: solid; border-color: #eee; font-weight: bold; justify-content: flex-start; }

        .toggle-btn { background: #eee; padding: 8px; border-radius: 8px; cursor: pointer; text-align: center; margin-bottom: 10px; font-weight: bold; }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="side-panel" id="panel-wait">
        <div class="toggle-btn" onclick="togglePanel('panel-wait')">◀/▶ คิวรอ</div>
        <div class="content-view" style="display:flex; flex-direction:column; height:100%;">
            <h3>👥 คิวรอ</h3>
            <div id="checkin-list" class="list-box"></div>
            <button id="confirmBtn" style="background:#007bff; color:white; width:100%; padding:15px; margin-top:10px; border-radius:12px; font-size:1.1em;">ยืนยันลงสนาม (0)</button>
            <button id="mockBtn" style="background:#f0f0f0; width:100%; padding:8px; margin-top:8px; border-radius:8px; font-size:0.8em;">🤖 สุ่มคน 20 คน</button>
        </div>
    </div>

    <div class="side-panel" id="panel-mid" style="background:#fffdf5;">
        <div class="toggle-btn" onclick="togglePanel('panel-mid')">◀/▶ คิวกลาง</div>
        <div class="content-view" style="display:flex; flex-direction:column; height:100%;">
            <h3>⏳ คิวกลาง</h3>
            <div id="queue-list" class="list-box"></div>
        </div>
    </div>

    <div class="panel-main">
        <div style="display:flex; gap:15px; margin-bottom:20px; align-items:center;">
            <button id="btnCreate" style="background:#4caf50; color:white; padding:12px 25px; border-radius:12px; font-weight:bold;">🚀 เปิดก๊วนใหม่</button>
            <button id="btnAddCourt" style="background:#2196f3; color:white; padding:12px 25px; border-radius:12px; font-weight:bold;">➕ เพิ่มสนาม</button>
            <div id="qrcode" style="margin-left:auto; cursor:zoom-in; background:white; padding:5px; border-radius:10px; border:1px solid #ddd;"></div>
        </div>
        <div class="courts-wrapper" id="main-grid"></div>
    </div>

    <div id="skillPicker" style="display:none; position:fixed; background:white; padding:10px; border-radius:15px; box-shadow:0 10px 30px rgba(0,0,0,0.2); z-index:9999;"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, addDoc, onSnapshot, query, orderBy, updateDoc, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDQbnx83sbs1sO4xsuLUV50uxbBinr2VtY", authDomain: "earlybird-queue.firebaseapp.com", projectId: "earlybird-queue", storageBucket: "earlybird-queue.firebasestorage.app", messagingSenderId: "310694006567", appId: "1:310694006567:web:f56fc19ed03b81bf8c2302" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentSessionId = "", selectedSlots = [null, null, null, null], allPlayers = [], middleQueue = [], nextCourtNum = 1, timers = {};

        window.togglePanel = (id) => { document.getElementById(id).classList.toggle('collapsed'); updateGridCols(); };
        function updateGridCols() {
            const w = !document.getElementById('panel-wait').classList.contains('collapsed');
            const m = !document.getElementById('panel-mid').classList.contains('collapsed');
            let cols = (w && m) ? 1 : (w || m) ? 2 : 3;
            if (window.innerWidth < 1000) cols = Math.min(cols, 2);
            document.getElementById('main-grid').style.setProperty('--cols', cols);
        }

        window.addNewCourt = () => {
            const id = `c-${Date.now()}`;
            const num = nextCourtNum++;
            const options = Array.from({length:25}, (_, i) => `<option value="${i+1}" ${i+1==num?'selected':''}>สนาม ${i+1}</option>`).join('');
            const html = `
                <div class="court-card" id="${id}">
                    <div class="court-header">
                        <select style="border:none; background:none; font-weight:bold; color:#2196f3; font-size:1.1em;">${options}</select>
                        <span id="timer-${id}" style="font-family:monospace; font-weight:bold; font-size:1.1em; color:#666;">00:00</span>
                        <button onclick="window.deleteCourt('${id}')" style="color:red; background:none; border:none; cursor:pointer;">ลบ</button>
                    </div>
                    <div style="display:flex; gap:10px; margin:10px 0;">
                        <div style="flex:1; background:var(--team-a); padding:10px; border-radius:15px;">
                            <div class="slot" onclick="window.assignSlot(this, '${id}')">ว่าง</div>
                            <div class="slot" onclick="window.assignSlot(this, '${id}')">ว่าง</div>
                        </div>
                        <div style="flex:1; background:var(--team-b); padding:10px; border-radius:15px;">
                            <div class="slot" onclick="window.assignSlot(this, '${id}')">ว่าง</div>
                            <div class="slot" onclick="window.assignSlot(this, '${id}')">ว่าง</div>
                        </div>
                    </div>
                    <button id="start-${id}" onclick="window.startMatch('${id}')" style="background:#4caf50; color:white; width:100%; padding:12px; border-radius:12px; font-weight:bold; border:none;">▶ เริ่มเกม</button>
                    <button id="end-${id}" onclick="window.endMatch('${id}')" style="background:#ffcfd2; color:red; width:100%; padding:12px; border-radius:12px; font-weight:bold; border:none; display:none;">⏹ จบเกม</button>
                </div>`;
            document.getElementById('main-grid').insertAdjacentHTML('beforeend', html);
        };

        window.startMatch = (id) => {
            const card = document.getElementById(id);
            const occupiedSlots = card.querySelectorAll('.slot.occupied');
            if(occupiedSlots.length === 0) return alert("กรุณาเลือกผู้เล่นลงสนามก่อน!");
            
            card.classList.add('playing');
            document.getElementById(`start-${id}`).style.display = "none";
            document.getElementById(`end-${id}`).style.display = "block";
            
            let seconds = 0;
            timers[id] = setInterval(() => {
                seconds++;
                const m = String(Math.floor(seconds / 60)).padStart(2, '0');
                const s = String(seconds % 60).padStart(2, '0');
                document.getElementById(`timer-${id}`).innerText = `${m}:${s}`;
            }, 1000);
        };

        window.endMatch = async (id) => {
            if(!confirm("จบการแข่งขันและเคลียร์สนาม?")) return;
            const card = document.getElementById(id);
            const slots = card.querySelectorAll('.slot.occupied');
            const batch = writeBatch(db);
            
            slots.forEach(s => {
                batch.update(doc(db, `sessions/${currentSessionId}/attendance`, s.dataset.uid), { 
                    is_playing: false, 
                    last_match_end: Date.now() 
                });
                s.innerText = "ว่าง";
                s.classList.remove('occupied');
                delete s.dataset.uid;
            });

            await batch.commit();
            clearInterval(timers[id]);
            document.getElementById(`timer-${id}`).innerText = "00:00";
            card.classList.remove('playing');
            document.getElementById(`start-${id}`).style.display = "block";
            document.getElementById(`end-${id}`).style.display = "none";
            checkAutoFill();
        };

        window.assignSlot = async (el, courtId) => {
            const sIdx = selectedSlots.findIndex(s => s !== null);
            // กรณีคลิกเพื่อเอาคนออก
            if(sIdx === -1 && el.dataset.uid) {
                await updateDoc(doc(db, `sessions/${currentSessionId}/attendance`, el.dataset.uid), { is_playing: false });
                el.innerText = "ว่าง"; el.classList.remove('occupied'); delete el.dataset.uid;
                renderFIFO();
                return;
            }
            // กรณีเลือกคนจากคิวมาลง
            if(sIdx !== -1) {
                const p = selectedSlots[sIdx];
                await updateDoc(doc(db, `sessions/${currentSessionId}/attendance`, p.id), { is_playing: true });
                const pD = allPlayers.find(x => x.id === p.id);
                el.innerHTML = `<span class="skill-dot lvl-${pD.data.skill_level || 'yellow'}"></span> ${p.name}`;
                el.dataset.uid = p.id; el.classList.add('occupied');
                selectedSlots[sIdx] = null;
                renderFIFO();
            }
        };

        function renderFIFO() {
            const list = document.getElementById('checkin-list'); list.innerHTML = "";
            const queuedIds = new Set(middleQueue.flatMap(q => q.slots.filter(s => s).map(s => s.id)));
            
            allPlayers.forEach(p => {
                if (p.data.is_playing || queuedIds.has(p.id)) return;
                const idx = selectedSlots.findIndex(s => s?.id === p.id);
                const div = document.createElement('div');
                div.className = `player-item ${idx !== -1 ? (idx < 2 ? 'sel-a' : 'sel-b') : ''}`;
                div.innerHTML = `<span class="skill-dot lvl-${p.data.skill_level || 'yellow'}"></span> ${p.data.display_name}`;
                
                let pressTimer;
                div.onmousedown = (e) => pressTimer = setTimeout(() => showSkillPicker(e, p.id), 600);
                div.onmouseup = () => clearTimeout(pressTimer);
                div.onclick = () => {
                    if (idx !== -1) selectedSlots[idx] = null;
                    else { const f = selectedSlots.indexOf(null); if (f !== -1) selectedSlots[f] = { id: p.id, name: p.data.display_name }; }
                    renderFIFO();
                };
                list.appendChild(div);
            });
            document.getElementById('confirmBtn').innerText = `ยืนยันลงสนาม (${selectedSlots.filter(s=>s).length})`;
        }

        function showSkillPicker(e, uid) {
            const pk = document.getElementById('skillPicker');
            pk.style.display = 'block'; pk.style.left = e.pageX+'px'; pk.style.top = e.pageY+'px';
            pk.innerHTML = ['yellow','green','blue','red','black'].map(l => 
                `<div style="padding:10px; cursor:pointer; font-weight:bold;" onclick="updateSkillDb('${uid}', '${l}')"><span class="skill-dot lvl-${l}"></span> ระดับ ${l.toUpperCase()}</div>`
            ).join('');
        }

        window.updateSkillDb = async (uid, lvl) => {
            await updateDoc(doc(db, `sessions/${currentSessionId}/attendance`, uid), { skill_level: lvl });
            document.getElementById('skillPicker').style.display = 'none';
        };

        window.deleteCourt = (id) => {
            if(document.getElementById(id).classList.contains('playing')) return alert("ไม่สามารถลบสนามที่กำลังแข่งอยู่ได้");
            document.getElementById(id).remove();
        };

        document.getElementById('confirmBtn').onclick = () => {
            const ps = selectedSlots.filter(s => s); if(!ps.length) return;
            middleQueue.push({ slots: [...selectedSlots] });
            selectedSlots = [null,null,null,null]; renderFIFO(); renderMiddleQueue(); checkAutoFill();
        };

        function renderMiddleQueue() {
            const list = document.getElementById('queue-list'); list.innerHTML = "";
            middleQueue.forEach(q => {
                const div = document.createElement('div'); div.className = "player-item"; div.style.borderLeft = "10px solid var(--lvl-yellow)";
                div.innerHTML = `<div style="display:flex; gap:5px; font-size:0.75em;">
                    <div style="flex:1; background:var(--team-a); border-radius:8px; padding:5px;">${q.slots[0]?.name||'-'}<br>${q.slots[1]?.name||'-'}</div>
                    <div style="flex:1; background:var(--team-b); border-radius:8px; padding:5px;">${q.slots[2]?.name||'-'}<br>${q.slots[3]?.name||'-'}</div>
                </div>`;
                list.appendChild(div);
            });
        }

        async function checkAutoFill() {
            const empty = Array.from(document.querySelectorAll('.court-card')).find(c => !c.classList.contains('playing') && c.querySelectorAll('.occupied').length === 0);
            if(empty && middleQueue.length > 0) {
                const q = middleQueue.shift();
                const batch = writeBatch(db), slots = empty.querySelectorAll('.slot');
                q.slots.forEach((p, i) => { if(p) {
                    batch.update(doc(db, `sessions/${currentSessionId}/attendance`, p.id), { is_playing: true });
                    const pD = allPlayers.find(x => x.id === p.id);
                    slots[i].innerHTML = `<span class="skill-dot lvl-${pD.data.skill_level || 'yellow'}"></span> ${p.name}`;
                    slots[i].dataset.uid = p.id; slots[i].classList.add('occupied');
                }});
                await batch.commit(); renderMiddleQueue(); renderFIFO();
            }
        }

        document.getElementById('mockBtn').onclick = async () => {
            if(!currentSessionId) return alert("เปิดก๊วนก่อน!");
            const batch = writeBatch(db);
            for(let i=1; i<=20; i++) {
                batch.set(doc(db, `sessions/${currentSessionId}/attendance`, "m-"+i), {
                    display_name: "ผู้เล่น " + i, is_playing: false, last_match_end: Date.now() + (i * 100), skill_level: 'yellow'
                });
            }
            await batch.commit();
        };

        document.getElementById('btnCreate').onclick = async () => {
            const ref = await addDoc(collection(db, "sessions"), { created_at: serverTimestamp() });
            currentSessionId = ref.id;
            const url = `https://early-bird-queue.vercel.app/index.html?session=${currentSessionId}`;
            new QRCode(document.getElementById("qrcode"), { text: url, width: 60, height: 60 });
            onSnapshot(query(collection(db, `sessions/${currentSessionId}/attendance`), orderBy("last_match_end", "asc")), snap => {
                allPlayers = snap.docs.map(d => ({ id: d.id, data: d.data() })); renderFIFO();
            });
            window.addNewCourt(); window.addNewCourt();
            new Sortable(document.getElementById('main-grid'), { animation: 150, handle: '.court-header' });
            updateGridCols();
        };

        document.getElementById('btnAddCourt').onclick = window.addNewCourt;
    </script>
</body>
</html>
