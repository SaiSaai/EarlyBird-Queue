<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Badminton</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00C853; --bg: #fdfcf0; }
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        body { background: var(--bg); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; width: 100%; max-width: 400px; border-radius: 25px; padding: 25px; box-shadow: 0 8px 25px rgba(0,0,0,0.05); text-align: center; }
        .hidden { display: none !important; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 12px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-index { background: #2196f3; color: white; margin-top: 20px; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .stat-item { background: #f9f9f9; padding: 15px; border-radius: 12px; }
    </style>
</head>
<body>

    <div id="loading">กำลังเตรียมข้อมูล...</div>

    <div id="reg-zone" class="card hidden">
        <h3>ยินดีต้อนรับ! 👋</h3>
        <p>ระบุชื่อเล่นเพื่อเข้าก๊วน</p>
        <input type="text" id="reg-name" placeholder="ชื่อเล่น">
        <select id="reg-skill">
            <option value="green">มือใหม่</option>
            <option value="blue">ทั่วไป</option>
            <option value="red">แข็งแกร่ง</option>
        </select>
        <button class="btn btn-primary" onclick="doRegister()">เข้าก๊วนเลย</button>
    </div>

    <div id="profile-zone" class="card hidden">
        <img id="user-img" src="" style="width:90px; height:90px; border-radius:50%; border:3px solid var(--primary);">
        <h2 id="u-name" style="margin:10px 0 0 0;">-</h2>
        <div class="stat-grid">
            <div class="stat-item"><small>แข่งไป</small><br><b id="u-games" style="color:var(--primary); font-size:1.5em;">0</b> เกม</div>
            <div class="stat-item"><small>ใช้ลูก</small><br><b id="u-shuttles" style="color:var(--primary); font-size:1.5em;">0</b> ลูก</div>
        </div>
        <button class="btn btn-index" onclick="goToQueue()">⌛ ไปหน้าดูคิวกลาง</button>
        <p style="font-size:12px; color:#ccc; margin-top:15px;" id="sid-display"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDQbnx83sbs1sO4xsuLUV50uxbBinr2VtY", authDomain: "earlybird-queue.firebaseapp.com", projectId: "earlybird-queue", storageBucket: "earlybird-queue.firebasestorage.app", messagingSenderId: "310694006567", appId: "1:310694006567:web:f56fc19ed03b81bf8c2302" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let uid, sid;

        window.onload = async () => {
            await liff.init({ liffId: "2009012689-o7UBlAd7" });
            if (!liff.isLoggedIn()) { liff.login(); return; }
            const profile = await liff.getProfile();
            uid = profile.userId;
            document.getElementById('user-img').src = profile.pictureUrl;

            const params = new URLSearchParams(window.location.search);
            sid = params.get('session') || localStorage.getItem('last_sid');
            
            if (!sid) {
                document.getElementById('loading').innerText = "❌ กรุณาสแกน QR ใหม่";
                return;
            }
            localStorage.setItem('last_sid', sid);
            document.getElementById('sid-display').innerText = "ก๊วน ID: " + sid;
            
            const snap = await getDoc(doc(db, `sessions/${sid}/attendance`, uid));
            document.getElementById('loading').classList.add('hidden');

            if (snap.exists()) {
                showData(snap.data());
            } else {
                document.getElementById('reg-zone').classList.remove('hidden');
            }
        };

        window.doRegister = async () => {
            const name = document.getElementById('reg-name').value.trim();
            if(!name) return;
            const data = { display_name: name, skill_level: document.getElementById('reg-skill').value, games_played: 0, shuttle_used: 0, is_playing: false };
            await setDoc(doc(db, `sessions/${sid}/attendance`, uid), data);
            showData(data);
        };

        function showData(data) {
            document.getElementById('reg-zone').classList.add('hidden');
            document.getElementById('profile-zone').classList.remove('hidden');
            onSnapshot(doc(db, `sessions/${sid}/attendance`, uid), (d) => {
                const res = d.data();
                document.getElementById('u-name').innerText = res.display_name;
                document.getElementById('u-games').innerText = res.games_played || 0;
                document.getElementById('u-shuttles').innerText = res.shuttle_used || 0;
            });
        }

        window.goToQueue = () => location.href = `index.html?session=${sid}`;
    </script>
</body>
</html>
