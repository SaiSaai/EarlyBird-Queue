<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Badminton</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background: #fdfcf0; padding: 20px; text-align: center; color: #333; }
        .card { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; border: 4px solid #4caf50; margin-bottom: 15px; object-fit: cover; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
        .stat-box { background: #f8f9fa; padding: 15px; border-radius: 15px; border: 1px solid #eee; }
        .stat-box small { color: #888; display: block; margin-bottom: 5px; }
        .stat-box b { font-size: 1.4em; color: #2c3e50; }
        .btn { border: none; padding: 15px; border-radius: 15px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; font-size: 1em; }
        .btn-green { background: #00b900; color: white; }
        .btn-blue { background: #2196f3; color: white; }
        input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ddd; margin-bottom: 10px; text-align: center; font-size: 1em; }
    </style>
</head>
<body>
    <div class="card">
        <div id="loader">กำลังเชื่อมต่อ LINE...</div>
        <div id="content" style="display:none;">
            <img id="user-img" class="profile-img" src="">
            <h2 id="user-name" style="margin:0 0 20px 0;"></h2>

            <div id="reg-section" style="display:none;">
                <p>ยินดีต้อนรับ! กรุณาเลือกระดับฝีมือ</p>
                <select id="skill-level" style="width:100%; padding:12px; border-radius:12px; margin-bottom:20px;">
                    <option value="yellow">Yellow</option><option value="green">Green</option>
                    <option value="blue">Blue</option><option value="red">Red</option><option value="black">Black</option>
                </select>
                <button class="btn btn-green" onclick="handleCheckin()">เช็คอินเข้าก๊วน 🏸</button>
            </div>

            <div id="info-section" style="display:none;">
                <div class="stat-grid">
                    <div class="stat-box"><small>ลูกแบดใช้ไป</small><b id="stat-shuttle">0</b> ลูก</div>
                    <div class="stat-box"><small>ค่าใช้จ่ายวันนี้</small><b id="stat-money">0</b> ฿</div>
                </div>
                <input type="text" id="edit-name" placeholder="ระบุชื่อเล่นใหม่">
                <button class="btn btn-blue" onclick="handleUpdate()">อัปเดตข้อมูล</button>
                <button class="btn" style="background:#eee; color:#666;" onclick="window.location.href='index.html'+window.location.search">ดูคิวรวมทั้งหมด 📊</button>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyDQbnx83sbs1sO4xsuLUV50uxbBinr2VtY", authDomain: "earlybird-queue.firebaseapp.com", projectId: "earlybird-queue", storageBucket: "earlybird-queue.firebasestorage.app", messagingSenderId: "310694006567", appId: "1:310694006567:web:f56fc19ed03b81bf8c2302" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session');
    let userProfile = null;

    async function init() {
        await liff.init({ liffId: "2009012689-o7UBlAd7" });
        if (!liff.isLoggedIn()) { liff.login(); return; }
        userProfile = await liff.getProfile();
        checkUser();
    }

    async function checkUser() {
        if (!sessionId) return alert("Session Expired");
        const docRef = doc(db, `sessions/${sessionId}/attendance`, userProfile.userId);
        
        onSnapshot(docRef, (snap) => {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            const data = snap.data();
            if (data) {
                document.getElementById('info-section').style.display = 'block';
                document.getElementById('reg-section').style.display = 'none';
                document.getElementById('user-name').innerText = data.display_name;
                document.getElementById('user-img').src = data.picture_url;
                document.getElementById('stat-shuttle').innerText = data.shuttle_used || 0;
                
                // คำนวณเงินเบื้องต้น (สมมติค่าคอร์ท 60 + ลูกละ 30)
                const money = (data.shuttle_used * 30) + 60;
                document.getElementById('stat-money').innerText = money;
            } else {
                document.getElementById('reg-section').style.display = 'block';
                document.getElementById('user-name').innerText = userProfile.displayName;
                document.getElementById('user-img').src = userProfile.pictureUrl;
            }
        });
    }

    window.handleCheckin = async () => {
        await setDoc(doc(db, `sessions/${sessionId}/attendance`, userProfile.userId), {
            display_name: userProfile.displayName,
            picture_url: userProfile.pictureUrl,
            skill_level: document.getElementById('skill-level').value,
            is_playing: false, is_paid: false, games_played: 0, shuttle_used: 0, last_match_end: Date.now()
        });
    };

    window.handleUpdate = async () => {
        const name = document.getElementById('edit-name').value;
        if(name) await updateDoc(doc(db, `sessions/${sessionId}/attendance`, userProfile.userId), { 
            display_name: name,
            picture_url: userProfile.pictureUrl // อัปเดตรูปตาม LINE ล่าสุด
        });
        alert("บันทึกสำเร็จ");
    };

    init();

    // --- ระบบจดจำตัวตนสมาชิก ---

    let currentUser = null;

    function checkExistingUser() {
        const savedUser = localStorage.getItem('badminton_user_profile');
        const lastSession = localStorage.getItem('user_last_session');

        if (savedUser) {
            currentUser = JSON.parse(savedUser);
            console.log("ยินดีต้อนรับกลับ:", currentUser.display_name);
            // ถ้ามีข้อมูลเดิมอยู่แล้ว ให้ข้ามหน้า Login ไปที่หน้าดูคิวได้เลย
            showDashboard(); 
        }
    }

    // ฟังก์ชันตอนที่ User กดตกลงชื่อตัวเองครั้งแรก (ตอน Login/ลงชื่อ)
    function saveUserProfile(uid, name, skill) {
        const profile = {
            uid: uid,
            display_name: name,
            skill_level: skill,
            timestamp: Date.now()
        };
        localStorage.setItem('badminton_user_profile', JSON.stringify(profile));
        currentUser = profile;
    }

    // เรียกใช้งานตอนโหลดหน้าเว็บ
    window.onload = () => {
        // 1. เช็คก่อนว่าใน URL มี Session ก๊วนส่งมาไหม (ถ้ามีให้จำก๊วนใหม่)
        const urlParams = new URLSearchParams(window.location.search);
        const sessionFromUrl = urlParams.get('session');
        if (sessionFromUrl) {
            localStorage.setItem('user_last_session', sessionFromUrl);
        }

        // 2. เช็คว่าเคยลงชื่อไว้หรือยัง
        checkExistingUser();
        
        // 3. เริ่มโหลดข้อมูลจาก Firebase ตาม Session ที่จำไว้
        startApp(); 
    };
</script>
</body>
</html>
