<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in Profile</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00C853; --bg: #fdfcf0; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        .hidden { display: none; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 12px; font-size: 1rem; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 15px; font-weight: 600; cursor: pointer; background: var(--primary); color: white; font-size: 1rem; }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <div id="loading-state">
            <div class="loader"></div>
            <p>กำลังยืนยันตัวตนผ่าน LINE...</p>
        </div>

        <div id="reg-form" class="hidden">
            <img id="user-img" style="width:80px; height:80px; border-radius:50%; margin-bottom:15px;">
            <h3>ลงทะเบียนเข้าก๊วน</h3>
            <input type="text" id="display-name" placeholder="ชื่อเล่นของคุณ">
            <select id="skill-level">
                <option value="green">มือใหม่ (Green)</option>
                <option value="blue" selected>ทั่วไป (Blue)</option>
                <option value="red">แข็งแรง (Red)</option>
            </select>
            <button class="btn" onclick="submitCheckin()">ยืนยันการเช็คอิน</button>
        </div>

        <div id="success-state" class="hidden">
            <h2 style="color: var(--primary);">✅ เช็คอินสำเร็จ!</h2>
            <p>ชื่อของคุณอยู่ในคิวรอแล้ว</p>
            <button class="btn" onclick="location.href='index.html'">กลับไปหน้าดูคิว</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDQbnx83sbs1sO4xsuLUV50uxbBinr2VtY", authDomain: "earlybird-queue.firebaseapp.com", projectId: "earlybird-queue", storageBucket: "earlybird-queue.firebasestorage.app", messagingSenderId: "310694006567", appId: "1:310694006567:web:f56fc19ed03b81bf8c2302" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let uid, sid, lineDisplayName, linePic;

        window.onload = async () => {
            try {
                await liff.init({ liffId: "2009012689-o7UBlAd7" });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                const profile = await liff.getProfile();
                uid = profile.userId;
                lineDisplayName = profile.displayName;
                linePic = profile.pictureUrl;

                const params = new URLSearchParams(window.location.search);
                sid = params.get('session') || localStorage.getItem('last_sid');

                if (!sid) {
                    alert("ไม่พบรหัสก๊วน!");
                    return;
                }

                // ตรวจสอบว่าเคยเช็คอินหรือยัง
                const userDoc = await getDoc(doc(db, `sessions/${sid}/attendance`, uid));
                if (userDoc.exists()) {
                    showSuccess();
                } else {
                    showForm();
                }
            } catch (e) { console.error(e); }
        };

        function showForm() {
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('reg-form').classList.remove('hidden');
            document.getElementById('user-img').src = linePic;
            document.getElementById('display-name').value = lineDisplayName;
        }

        function showSuccess() {
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('reg-form').classList.add('hidden');
            document.getElementById('success-state').classList.remove('hidden');
        }

        window.submitCheckin = async () => {
            const name = document.getElementById('display-name').value.trim();
            const skill = document.getElementById('skill-level').value;
            if (!name) return alert("กรุณากรอกชื่อ");

            await setDoc(doc(db, `sessions/${sid}/attendance`, uid), {
                display_name: name,
                skill_level: skill,
                is_playing: false,
                is_paid: false,
                games_played: 0,
                shuttle_used: 0,
                last_match_end: Date.now()
            });
            showSuccess();
        };
    </script>
</body>
</html>
