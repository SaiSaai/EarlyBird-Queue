<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Badminton</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00C853; --bg: #fdfcf0; }
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        body { background: var(--bg); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .profile-card { background: white; width: 100%; max-width: 400px; border-radius: 25px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; margin-top: 20px; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; border: 4px solid var(--primary); margin-bottom: 15px; object-fit: cover; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 25px 0; }
        .stat-box { background: #f9f9f9; padding: 15px; border-radius: 15px; border: 1px solid #eee; }
        .stat-val { display: block; font-size: 1.5rem; font-weight: 600; color: var(--primary); }
        .stat-label { font-size: 0.8rem; color: #888; }

        .btn-action { width: 100%; padding: 12px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
        .btn-home { background: var(--primary); color: white; }
        .btn-edit { background: #eee; color: #555; }

        #debug-log { width: 100%; max-width: 400px; background: #333; color: #0f0; padding: 10px; font-size: 10px; border-radius: 10px; margin-top: 20px; text-align: left; display: none; }
    </style>
</head>
<body>

    <div id="loader">กำลังดึงข้อมูลโปรไฟล์...</div>

    <div id="content" class="profile-card" style="display:none;">
        <img id="user-img" class="avatar" src="" alt="Profile">
        <h2 id="user-name" style="margin:0;">-</h2>
        <p id="user-skill" style="color:#666; margin:5px 0 0 0;">-</p>

        <div class="stats-grid">
            <div class="stat-box">
                <span id="stat-games" class="stat-val">0</span>
                <span class="stat-label">จำนวนเกม</span>
            </div>
            <div class="stat-box">
                <span id="stat-shuttles" class="stat-val">0</span>
                <span class="stat-label">ลูกที่ใช้</span>
            </div>
        </div>

        <button class="btn-action btn-home" onclick="location.href='index.html'">กลับไปดูคิว</button>
        <button class="btn-action btn-edit" onclick="resetUser()">แก้ไขชื่อ/เปลี่ยนก๊วน</button>
    </div>

    <div id="debug-log"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDQbnx83sbs1sO4xsuLUV50uxbBinr2VtY", authDomain: "earlybird-queue.firebaseapp.com", projectId: "earlybird-queue", storageBucket: "earlybird-queue.firebasestorage.app", messagingSenderId: "310694006567", appId: "1:310694006567:web:f56fc19ed03b81bf8c2302" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function log(m) {
            const d = document.getElementById('debug-log');
            d.style.display = 'block';
            d.innerHTML += `> ${m}<br>`;
            console.log(m);
        }

        window.onload = async () => {
            try {
                await liff.init({ liffId: "2009012689-o7UBlAd7" });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                const profile = await liff.getProfile();
                const uid = profile.userId;
                const sid = localStorage.getItem('last_sid'); // ใช้ชื่อ Key เดียวกับหน้า index

                document.getElementById('user-img').src = profile.pictureUrl || 'https://via.placeholder.com/100';

                if (!sid) {
                    alert("ไม่พบรหัสก๊วน กรุณาสแกน QR ใหม่");
                    window.location.href = 'index.html';
                    return;
                }

                log("Checking: sessions/" + sid + "/attendance/" + uid);

                // ดึงข้อมูลจาก Firebase
                const userRef = doc(db, "sessions", sid, "attendance", uid);
                
                onSnapshot(userRef, (snap) => {
                    if (snap.exists()) {
                        const data = snap.data();
                        document.getElementById('loader').style.display = 'none';
                        document.getElementById('content').style.display = 'block';
                        
                        document.getElementById('user-name').innerText = data.display_name;
                        document.getElementById('user-skill').innerText = "ระดับ: " + data.skill_level.toUpperCase();
                        document.getElementById('stat-games').innerText = data.games_played || 0;
                        document.getElementById('stat-shuttles').innerText = data.shuttle_used || 0;
                    } else {
                        log("ยังไม่มีข้อมูลการเช็คอินในก๊วนนี้");
                        alert("คุณยังไม่ได้ลงชื่อเข้าก๊วนนี้");
                        window.location.href = 'index.html';
                    }
                }, (err) => {
                    log("Error: " + err.message);
                });

            } catch (err) {
                log("Crash: " + err.message);
            }
        };

        window.resetUser = () => {
            if(confirm("ต้องการเปลี่ยนก๊วนหรือแก้ไขข้อมูลใช่หรือไม่?")) {
                localStorage.removeItem('last_sid');
                window.location.href = 'index.html';
            }
        };
    </script>
</body>
</html>
