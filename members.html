<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Billing - Fix Rate</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary-font: 'Kanit', sans-serif;
            --v-yellow: #FFD700; --v-green: #00C853; --v-blue: #2962FF; --v-red: #D50000; --v-black: #000000; 
            --paid-color: #9e9e9e;
        }
        * { 
            box-sizing: border-box; 
            font-family: var(--primary-font); 
        }
        body { font-family: 'Kanit', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; display: flex; justify-content: space-between; align-items: center; color: #1a1a1a; }
        
        .setup-bar { background: #fff3e0; padding: 20px; border-radius: 15px; margin-bottom: 25px; display: flex; gap: 25px; flex-wrap: wrap; border: 1px solid #ffe0b2; }
        .setup-item { display: flex; align-items: center; gap: 10px; font-weight: 600; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #f8f9fa; padding: 15px; text-align: left; border-bottom: 2px solid #dee2e6; color: #666; font-weight: 600; }
        td { padding: 12px 15px; border-bottom: 1px solid #eee; transition: 0.3s; }
        
        .paid-row { opacity: 0.5; background-color: #fafafa !important; }
        .skill-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.1); }
        .lvl-yellow { background: var(--v-yellow); } .lvl-green { background: var(--v-green); }
        .lvl-blue { background: var(--v-blue); } .lvl-red { background: var(--v-red); } .lvl-black { background: var(--v-black); }
        
        .input-small { width: 80px; padding: 8px; border: 1px solid #ddd; border-radius: 8px; text-align: center; font-family: 'Kanit'; }
        .total-row { background: #e8f5e9; font-weight: bold; font-size: 1.1em; }
        
        .btn-paid { background: #4caf50; color: white; border: none; padding: 8px 15px; border-radius: 10px; cursor: pointer; font-weight: 600; }
        .btn-paid.is-paid { background: #bdbdbd; }
        .btn-del { color: #ff4d4f; background: none; border: none; cursor: pointer; font-size: 0.9rem; padding: 5px; opacity: 0.3; transition: 0.3s; }
        .btn-del:hover { opacity: 1; }

        .edit-zone { display: flex; align-items: center; gap: 8px; }
        select { padding: 5px; border-radius: 6px; border: 1px solid #ddd; }
        input[type="text"] { border: 1px solid transparent; padding: 5px; border-radius: 6px; width: 110px; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <h2>👥 สรุปยอดสมาชิก (รายคน)
        <button onclick="window.history.back()" style="font-size: 0.6em; cursor: pointer; padding: 8px 15px; border-radius: 10px; border: 1px solid #ddd; background: #fff;">⬅️ กลับ</button>
    </h2>

    <div class="setup-bar">
        <div class="setup-item">
            💰 ค่าคอร์ท / คน: 
            <input type="number" id="court-per-person" value="90" oninput="calculateAll()" class="input-small"> บาท
        </div>
        <div class="setup-item">
            🏸 ราคาลูกแบด / ลูก: 
            <input type="number" id="shuttle-price" value="25" oninput="calculateAll()" class="input-small"> บาท
        </div>
        <div style="margin-left: auto; color: #e65100; font-size: 0.9em; font-weight: 600;">
            *ยอด = ค่าคอร์ทคงที่ + (ลูกสะสม x ราคาลูก) + อื่นๆ
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>สมาชิก / ระดับ</th>
                <th style="text-align:center;">เกม</th>
                <th style="text-align:center;">ลูก (x)</th>
                <th>น้ำ/ของ (+)</th>
                <th>ลด (-)</th>
                <th>ยอดสุทธิ</th>
                <th>สถานะ</th>
            </tr>
        </thead>
        <tbody id="member-list">
            <tr><td colspan="7" style="text-align:center; padding:40px; color:#999;">กำลังโหลดรายชื่อ...</td></tr>
        </tbody>
        <tfoot>
            <tr class="total-row">
                <td colspan="5" style="text-align: right; padding-right: 20px;">ยอดรวมที่เก็บได้ (ทั้งหมด):</td>
                <td id="grand-total" style="color: #2e7d32; font-size: 1.3em;">0</td>
                <td>บาท</td>
            </tr>
        </tfoot>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyDQbnx83sbs1sO4xsuLUV50uxbBinr2VtY", 
        authDomain: "earlybird-queue.firebaseapp.com", 
        projectId: "earlybird-queue", 
        storageBucket: "earlybird-queue.firebasestorage.app", 
        messagingSenderId: "310694006567", 
        appId: "1:310694006567:web:f56fc19ed03b81bf8c2302" 
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const sessionId = localStorage.getItem('last_sid');
    let members = [];
    let currentLiveCourts = []; // เก็บรายชื่อคนในสนาม
    let currentQueue = [];      // เก็บรายชื่อคนในคิว

    if (sessionId) {
        listenToSession(); // ติดตามสถานะสนาม/คิว
        listenToMembers(); // ติดตามรายชื่อสมาชิก
    }

    // 1. ฟังก์ชันติดตามสถานะสนามและคิว (เพื่อใช้เช็คชื่อตอนกดจ่ายเงิน)
    function listenToSession() {
        onSnapshot(doc(db, "sessions", sessionId), (snap) => {
            const data = snap.data();
            if (data) {
                currentLiveCourts = data.live_courts || [];
                currentQueue = data.middle_queue || [];
            }
        });
    }

    function listenToMembers() {
        onSnapshot(query(collection(db, `sessions/${sessionId}/attendance`), orderBy("display_name")), (snap) => {
            members = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderTable();
        });
    }

    // 2. ฟังก์ชันตรวจสอบว่าคนนี้ "ติดภารกิจ" หรือไม่
    function isMemberBusy(id) {
        // เช็คในสนาม
        const inCourt = currentLiveCourts.some(court => 
            court.slots.some(slot => slot.id === id)
        );
        if (inCourt) return "แข่งอยู่";

        // เช็คในคิว
        const inQueue = currentQueue.some(q => 
            q.slots.some(slot => slot && slot.id === id)
        );
        if (inQueue) return "รอคิวอยู่";

        return null;
    }

    window.togglePaid = async (id, status) => {
        // ถ้าจะกด "จ่ายแล้ว" (Status = true) ต้องเช็คก่อน
        if (status === true) {
            const busyStatus = isMemberBusy(id);
            if (busyStatus) {
                const player = members.find(m => m.id === id);
                alert(`⚠️ ไม่สามารถเก็บเงิน ${player.display_name} ได้\nเนื่องจากยัง "${busyStatus}" กรุณารอให้จบเกมหรือเอาออกจากคิวก่อน`);
                return;
            }
            await updateDoc(doc(db, `sessions/${sessionId}/attendance`, id), { is_paid: status });
        }
        // 2. ถ้ากด "ยกเลิก" (เปลี่ยนจากจ่ายแล้ว กลับมาเป็น "ยังไม่จ่าย")
        else {
            const now = Date.now(); // สร้างเวลาปัจจุบันขึ้นมา
            await updateDoc(doc(db, `sessions/${sessionId}/attendance`, id), { 
                is_paid: false,
                // ✨ เพิ่ม 2 บรรทัดนี้ เพื่อให้เวลาเช็คอินเป็น "ล่าสุด" 
                // ชื่อจะกระเด้งไปอยู่ "ล่างสุด" ของคิวในหน้าจัดทีมทันที
                checkin_at: now,
                //last_match_end: now 
            });
        }        
    };

    // --- ส่วนแสดงผลและการคำนวณ (เหมือนเดิม) ---
    window.calculateAll = () => {
        const courtRate = parseFloat(document.getElementById('court-per-person').value) || 0;
        const shuttlePrice = parseFloat(document.getElementById('shuttle-price').value) || 0;
        let grandTotal = 0;
        members.forEach(m => {
            const extra = parseFloat(document.getElementById(`extra-${m.id}`)?.value) || m.extra_cost || 0;
            const discount = parseFloat(document.getElementById(`discount-${m.id}`)?.value) || m.discount || 0;
            const shuttleCost = (m.shuttle_used || 0) * shuttlePrice;
            const total = courtRate + shuttleCost + extra - discount;
            const rowTotalEl = document.getElementById(`total-${m.id}`);
            if (rowTotalEl) rowTotalEl.innerText = Math.round(total).toLocaleString();
            grandTotal += total;
        });
        document.getElementById('grand-total').innerText = Math.round(grandTotal).toLocaleString();
    };

    function renderTable() {
        const list = document.getElementById('member-list');
        if (members.length === 0) {
            list.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:40px; color:#999;">ยังไม่มีสมาชิกเช็คอิน</td></tr>';
            return;
        }
        list.innerHTML = "";
        //const sortedMembers = [...members].sort((a, b) => (a.is_paid === b.is_paid) ? 0 : a.is_paid ? 1 : -1);

        // --- แก้ไขการเรียงลำดับตรงนี้ ---
        const sortedMembers = [...members].sort((a, b) => {
            // 1. เรียงตามสถานะการจ่ายเงิน (false ขึ้นก่อน true)
            if (a.is_paid !== b.is_paid) {
                return a.is_paid ? 1 : -1;
            }
            // 2. ถ้าสถานะเหมือนกัน ให้เรียงชื่อตาม ก-ฮ
            return (a.display_name || "").localeCompare((b.display_name || ""), 'th');
        });
        // ----------------------------

        sortedMembers.forEach(m => {
            const tr = document.createElement('tr');
            if (m.is_paid) tr.className = "paid-row";
            tr.innerHTML = `
                <td>
                    <div class="edit-zone">
                        <span class="skill-dot lvl-${m.skill_level || 'yellow'}"></span>
                        <input type="text" value="${m.display_name}" onchange="updateMember('${m.id}', {display_name: this.value})">
                        <select onchange="updateMember('${m.id}', {skill_level: this.value})">
                            <option value="yellow" ${m.skill_level=='yellow'?'selected':''}>มือใหม่</option>
                            <option value="green" ${m.skill_level=='green'?'selected':''}>เบา</option>
                            <option value="blue" ${m.skill_level=='blue'?'selected':''}>กลาง</option>
                            <option value="red" ${m.skill_level=='red'?'selected':''}>หนัก</option>
                            <option value="black" ${m.skill_level=='black'?'selected':''}>หนักมาก</option>
                        </select>
                        <button class="btn-del" onclick="deleteMember('${m.id}', '${m.display_name}')">🗑️</button>
                    </div>
                </td>
                <td style="text-align:center;">${m.games_played || 0}</td>
                <td style="text-align:center; color:#d32f2f; font-weight:bold;">${m.shuttle_used || 0}</td>
                <td><input type="number" id="extra-${m.id}" value="${m.extra_cost || 0}" class="input-small" oninput="updateDebounced('${m.id}', 'extra_cost', this.value)"></td>
                <td><input type="number" id="discount-${m.id}" value="${m.discount || 0}" class="input-small" oninput="updateDebounced('${m.id}', 'discount', this.value)"></td>
                <td id="total-${m.id}" style="font-weight:bold; color:#1a73e8;">0</td>
                <td>
                    <button onclick="togglePaid('${m.id}', ${!m.is_paid})" class="btn-paid ${m.is_paid ? 'is-paid' : ''}">
                        ${m.is_paid ? 'ยกเลิก' : 'จ่ายแล้ว'}
                    </button>
                </td>
            `;
            list.appendChild(tr);
        });
        calculateAll();
    }

    window.updateMember = async (id, data) => { await updateDoc(doc(db, `sessions/${sessionId}/attendance`, id), data); };
    window.deleteMember = async (id, name) => { if (confirm(`ลบคุณ ${name} ออกจากก๊วน?`)) await deleteDoc(doc(db, `sessions/${sessionId}/attendance`, id)); };
    let timer;
    window.updateDebounced = (id, field, val) => {
        clearTimeout(timer);
        timer = setTimeout(() => {
            const data = {};
            data[field] = parseFloat(val) || 0;
            updateMember(id, data);
        }, 800);
        calculateAll();
    };

    window.markAsPaid = async (uid, name) => {
        // 1. เช็คว่าคนนี้อยู่ในสนาม (lastSnapshotData เก็บข้อมูล Real-time อยู่แล้ว)
        const player = lastSnapshotData.find(p => p.id === uid);
        
        if (!player) return;

        // 2. เช็คเงื่อนไข: ต้องไม่เล่นอยู่ (is_playing)
        if (player.data.is_playing) {
            alert(`ไม่สามารถแจ้งจ่ายเงินได้ เนื่องจาก ${name} กำลังอยู่ในสนามครับ`);
            return;
        }

        // 3. เช็คเงื่อนไข: ต้องไม่อยู่ในคิวกลาง (middleQueue)
        const inMiddleQueue = middleQueue.some(q => q.slots.some(s => s && s.id === uid));
        if (inMiddleQueue) {
            alert(`ไม่สามารถแจ้งจ่ายเงินได้ เนื่องจาก ${name} อยู่ในคิวรอลงสนาม (Q) กรุณาดึงออกก่อนครับ`);
            return;
        }

        // 4. ถ้าผ่านเงื่อนไข ให้ Update Firebase เป็นจ่ายแล้ว
        if (confirm(`ยืนยันการจ่ายเงินของ ${name}? (ชื่อจะออกจากคิวทันที)`)) {
            await updateDoc(doc(db, `sessions/${currentSessionId}/attendance`, uid), {
                is_paid: true,
                is_playing: false // เผื่อไว้กันพลาด
            });
            alert(`บันทึกการจ่ายเงินของ ${name} เรียบร้อย`);
        }
    };
</script>
</body>
</html>
