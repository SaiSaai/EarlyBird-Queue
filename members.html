<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Billing - Badminton Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --v-yellow: #FFD700; --v-green: #00C853; --v-blue: #2962FF; --v-red: #D50000; --v-black: #000000; 
            --paid-color: #9e9e9e;
        }
        body { font-family: 'Kanit', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        h2 { margin-top: 0; display: flex; justify-content: space-between; align-items: center; color: #1a1a1a; }
        
        /* Setup Box */
        .setup-bar { background: #fff8e1; padding: 20px; border-radius: 15px; margin-bottom: 25px; display: flex; gap: 25px; flex-wrap: wrap; border: 1px solid #ffe082; }
        .setup-item { display: flex; align-items: center; gap: 10px; font-weight: 600; }
        
        /* Table Styling */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #f8f9fa; padding: 15px; text-align: left; border-bottom: 2px solid #dee2e6; color: #666; font-weight: 600; }
        td { padding: 12px 15px; border-bottom: 1px solid #eee; transition: 0.3s; }
        
        .paid-row { opacity: 0.5; background-color: #fafafa !important; }
        .paid-row input { pointer-events: none; background: #eee; border-color: transparent; }

        .skill-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.1); }
        .lvl-yellow { background: var(--v-yellow); } .lvl-green { background: var(--v-green); }
        .lvl-blue { background: var(--v-blue); } .lvl-red { background: var(--v-red); } .lvl-black { background: var(--v-black); }
        
        .input-small { width: 70px; padding: 8px; border: 1px solid #ddd; border-radius: 8px; text-align: center; font-family: 'Kanit'; }
        .total-row { background: #e3f2fd; font-weight: bold; font-size: 1.1em; }
        
        .btn-paid { background: #4caf50; color: white; border: none; padding: 8px 15px; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-paid.is-paid { background: #bdbdbd; }
        .btn-paid:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }

        .edit-zone { display: flex; align-items: center; gap: 8px; }
        select { padding: 5px; border-radius: 6px; border: 1px solid #ddd; cursor: pointer; }
        input[type="text"] { border: 1px solid transparent; padding: 5px; border-radius: 6px; transition: 0.2s; }
        input[type="text"]:focus { border-color: #2196f3; background: #fff; outline: none; }

        @media (max-width: 768px) {
            .container { padding: 10px; }
            th, td { padding: 8px; font-size: 0.85em; }
            .input-small { width: 50px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>👥 สรุปยอดสมาชิกและค่าใช้จ่าย 
        <button onclick="window.history.back()" style="font-size: 0.6em; cursor: pointer; padding: 8px 15px; border-radius: 10px; border: 1px solid #ddd;">⬅️ กลับหน้าแอดมิน</button>
    </h2>

    <div class="setup-bar">
        <div class="setup-item">
            💰 ค่าคอร์ททั้งหมด: 
            <input type="number" id="global-court-fee" value="0" oninput="calculateAll()" class="input-small" style="width: 100px;"> บาท
        </div>
        <div class="setup-item">
            🏸 ราคาลูกแบด/ลูก: 
            <input type="number" id="shuttle-price" value="30" oninput="calculateAll()" class="input-small"> บาท
        </div>
        <div style="margin-left: auto; color: #666; font-size: 0.9em;">*ระบบบันทึกส่วนลดและค่าน้ำอัตโนมัติ</div>
    </div>

    <table>
        <thead>
            <tr>
                <th>สมาชิก / ระดับ</th>
                <th style="text-align:center;">เกม</th>
                <th style="text-align:center;">ลูก (x)</th>
                <th>ซื้อของ (+)</th>
                <th>ส่วนลด (-)</th>
                <th>ยอดสุทธิ</th>
                <th>สถานะ</th>
            </tr>
        </thead>
        <tbody id="member-list">
            </tbody>
        <tfoot>
            <tr class="total-row">
                <td colspan="5" style="text-align: right; padding-right: 20px;">ยอดรวมทั้งหมดของก๊วน:</td>
                <td id="grand-total" style="color: #1976d2;">0</td>
                <td>บาท</td>
            </tr>
        </tfoot>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyDQbnx83sbs1sO4xsuLUV50uxbBinr2VtY", authDomain: "earlybird-queue.firebaseapp.com", projectId: "earlybird-queue", storageBucket: "earlybird-queue.firebasestorage.app", messagingSenderId: "310694006567", appId: "1:310694006567:web:f56fc19ed03b81bf8c2302" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const sessionId = localStorage.getItem('last_session_id');
    let members = [];

    if (!sessionId) {
        alert("ไม่พบ Session ID กรุณากลับไปเปิดก๊วนที่หน้า Admin ก่อน");
    } else {
        listenToMembers();
    }

    function listenToMembers() {
        onSnapshot(query(collection(db, `sessions/${sessionId}/attendance`), orderBy("display_name")), (snap) => {
            members = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderTable();
        });
    }

    window.calculateAll = () => {
        const courtTotal = parseFloat(document.getElementById('global-court-fee').value) || 0;
        const shuttlePrice = parseFloat(document.getElementById('shuttle-price').value) || 0;
        const memberCount = members.length;
        const courtPerHead = memberCount > 0 ? courtTotal / memberCount : 0;

        let grandTotal = 0;

        members.forEach(m => {
            const extra = parseFloat(document.getElementById(`extra-${m.id}`)?.value) || m.extra_cost || 0;
            const discount = parseFloat(document.getElementById(`discount-${m.id}`)?.value) || m.discount || 0;
            
            // สูตร: (ค่าคอร์ทหารเฉลี่ย) + (จำนวนลูกแบดคนละ x ลูก * ราคา) + ซื้อของ - ส่วนลด
            const shuttleCost = (m.shuttle_used || 0) * shuttlePrice;
            const total = courtPerHead + shuttleCost + extra - discount;

            const rowTotalEl = document.getElementById(`total-${m.id}`);
            if (rowTotalEl) rowTotalEl.innerText = Math.round(total).toLocaleString();
            grandTotal += total;
        });

        document.getElementById('grand-total').innerText = Math.round(grandTotal).toLocaleString();
    };

    function renderTable() {
        const list = document.getElementById('member-list');
        list.innerHTML = "";
        
        // เรียงลำดับ: ใครยังไม่จ่ายไว้บน (false), ใครจ่ายแล้วไว้ล่าง (true)
        const sortedMembers = [...members].sort((a, b) => (a.is_paid === b.is_paid) ? 0 : a.is_paid ? 1 : -1);

        sortedMembers.forEach(m => {
            const tr = document.createElement('tr');
            if (m.is_paid) tr.className = "paid-row";

            tr.innerHTML = `
                <td>
                    <div class="edit-zone">
                        <span class="skill-dot lvl-${m.skill_level || 'yellow'}"></span>
                        <input type="text" value="${m.display_name}" onchange="updateMember('${m.id}', {display_name: this.value})" style="font-weight:600; width:100px;">
                        <select onchange="updateMember('${m.id}', {skill_level: this.value})">
                            <option value="yellow" ${m.skill_level=='yellow'?'selected':''}>Y</option>
                            <option value="green" ${m.skill_level=='green'?'selected':''}>G</option>
                            <option value="blue" ${m.skill_level=='blue'?'selected':''}>B</option>
                            <option value="red" ${m.skill_level=='red'?'selected':''}>R</option>
                            <option value="black" ${m.skill_level=='black'?'selected':''}>BK</option>
                        </select>
                    </div>
                </td>
                <td style="text-align:center; font-weight:bold;">${m.games_played || 0}</td>
                <td style="text-align:center; color: #e91e63; font-weight:bold;">${m.shuttle_used || 0}</td>
                <td><input type="number" id="extra-${m.id}" value="${m.extra_cost || 0}" class="input-small" oninput="updateDebounced('${m.id}', 'extra_cost', this.value)"></td>
                <td><input type="number" id="discount-${m.id}" value="${m.discount || 0}" class="input-small" oninput="updateDebounced('${m.id}', 'discount', this.value)"></td>
                <td id="total-${m.id}" style="font-weight:bold; color: #2c3e50;">0</td>
                <td>
                    <button onclick="togglePaid('${m.id}', ${!m.is_paid})" class="btn-paid ${m.is_paid ? 'is-paid' : ''}">
                        ${m.is_paid ? 'ยกเลิก' : 'จ่ายแล้ว?'}
                    </button>
                </td>
            `;
            list.appendChild(tr);
        });
        calculateAll();
    }

    window.updateMember = async (id, data) => {
        await updateDoc(doc(db, `sessions/${sessionId}/attendance`, id), data);
    };

    let timer;
    window.updateDebounced = (id, field, val) => {
        clearTimeout(timer);
        timer = setTimeout(() => {
            const data = {};
            data[field] = parseFloat(val) || 0;
            updateMember(id, data);
        }, 800);
        calculateAll();
    };

    window.togglePaid = async (id, status) => {
        await updateMember(id, { is_paid: status });
    };

</script>
</body>
</html>
